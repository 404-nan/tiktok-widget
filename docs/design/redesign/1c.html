.yellow{--bg:#141414;--deep:#0c0c0c;--line:#262626;--line2:#1e1e1e;--line3:#3a3a3a;--hover:#1f1f1f;--ink:#f4f4f0;--ink2:#cfcfc8;--mute:#8d8d86;--acc:#ffe600;--accink:#0c0c0c;--card:#1f1f1f;--pv1:#191919;--pv2:#161616;--gold:#ffe600}

body{background:var(--bg);color:var(--ink);display:grid;grid-template-columns:72px 1fr;grid-template-rows:56px 1fr}
.rail{grid-row:1/3;background:var(--deep);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.logo{color:var(--accink);width:36px;height:36px;border-radius:8px;background:var(--acc);display:grid;place-items:center;font-weight:900;margin-bottom:12px}
.ri{width:56px;padding:8px 0;text-align:center;font-size:10px;color:var(--mute);border-radius:8px}.ri b{display:block;font-size:18px;color:var(--ink2);margin-bottom:2px}
.ri.on{background:var(--hover);color:var(--ink)}.ri.on b{color:var(--acc)}.sp{flex:1}
.top{display:flex;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid var(--line)}
.onair{font-size:12px;font-weight:800;letter-spacing:.12em;padding:4px 10px;border:1px solid var(--line3);color:var(--mute)}.onair i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mute);margin-right:6px}
.top .grow{flex:1}.top .who{font-size:13px;color:var(--mute)}
.btn{border:1px solid var(--ink)}.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accink)}
main{padding:22px 28px;display:grid;gap:20px;align-content:start}
.head{display:flex;align-items:baseline;gap:14px}.head h1{font-size:24px}.sel{border:1px solid var(--line3);padding:5px 10px;font-size:13px;font-family:ui-monospace,monospace}.use{color:var(--acc);font-size:11px;font-weight:800;letter-spacing:.12em}
.stage{display:grid;grid-template-columns:1fr 300px;gap:0;border:1px solid var(--line)}
.pv{aspect-ratio:16/7;display:grid;place-items:center;background:repeating-linear-gradient(0deg,var(--pv1) 0 2px,var(--pv2) 2px 4px);position:relative}.pv .tag{position:absolute;left:12px;top:10px;color:var(--acc)}
.telop .bar{background:var(--acc)}.telop .g,.telop .m{background:var(--card)}.telop .c{background:var(--deep);color:var(--gold)}
.side{border-left:1px solid var(--line);padding:16px;display:grid;gap:10px;align-content:start}.side .k{font-size:11px;color:var(--mute);letter-spacing:.12em}
code{background:var(--deep);border:1px solid var(--line);padding:9px;font-family:ui-monospace,monospace}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
h3{font-size:11px;color:var(--mute);letter-spacing:.14em;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}
.row{border-bottom:1px solid var(--line2)}.chip{border:1px solid var(--line3)}.chip.on{background:var(--ink);color:var(--bg)}
.seg{border:1px solid var(--line3);margin-top:8px}.seg span+span{border-left:1px solid var(--line3)}.seg .on{background:var(--acc);color:var(--accink);font-weight:800}
.num{background:var(--deep);border:1px solid var(--line3);font-family:ui-monospace,monospace}
</style>
