<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1180">
<title>スロット演出 モック</title>
<style>
/* 書体は node_modules の fontsource から読む（リポジトリ直下で開いたとき）。無ければ下の代わりの書体になる */
@import url("../../node_modules/@fontsource/dela-gothic-one/index.css");
@import url("../../node_modules/@fontsource/zen-kaku-gothic-new/700.css");
@import url("../../node_modules/@fontsource/zen-kaku-gothic-new/900.css");

:root {
  --sumi: #111113;
  --shiro: #F6F5F1;
  --aka: #D8121B;
  --koaka: #B00D16;
  --kin: #FFC53D;
  --usukin: #FFE08A;
  --keshi: #3A3A40;
  --nibi: #C9C9D1;
  --f-ja: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  --f-slam: "Dela Gothic One", "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
}

/* ページ（モックの台紙） */
html, body { margin: 0; background: #1B1B1F; color: var(--shiro); font-family: var(--f-ja); }
.page { width: 1080px; padding: 32px 48px 64px; }
.page-title { margin: 0 0 32px; font-size: 28px; font-weight: 900; }
.shot { margin: 0 0 48px; }
.shot figcaption { margin: 0 0 12px; font-size: 24px; font-weight: 700; }
.stage { position: relative; width: 1080px; height: 600px; overflow: hidden; background: #3C4350; outline: 2px solid #5A6270; }

/* ===== 筐体（1032×480・上から 8px に置き、下 112px は空ける） ===== */
.cab {
  position: absolute; left: 24px; top: 8px;
  box-sizing: border-box; width: 1032px; height: 480px; padding: 12px;
  display: flex; flex-direction: column; gap: 12px;
  background: var(--aka); border: 8px solid var(--kin); border-radius: 16px;
  box-shadow: 0 0 0 4px var(--sumi);
}

/* 上の帯: 状況のひと言（左）＋送った人（右。左下はコメント欄に隠れやすい） */
.band { box-sizing: border-box; height: 96px; display: flex; border: 4px solid var(--sumi); border-radius: 8px; overflow: hidden; }
.who { box-sizing: border-box; width: 320px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--shiro); color: var(--sumi); border-left: 4px solid var(--sumi); }
.avatar { box-sizing: border-box; width: 60px; height: 60px; flex: none; display: grid; place-items: center; background: var(--kin); border: 4px solid var(--sumi); border-radius: 6px; font-size: 30px; font-weight: 900; }
.who-text { display: flex; flex-direction: column; min-width: 0; }
.name { font-size: 34px; line-height: 1.15; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gift { font-size: 26px; line-height: 1.2; font-weight: 700; color: var(--koaka); }
.call { position: relative; flex: 1; display: grid; place-items: center; overflow: hidden; background: var(--sumi); }
.call-text { position: relative; font-family: var(--f-slam); font-size: 60px; line-height: 1; letter-spacing: .04em; }
.queue { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); padding: 4px 10px; background: var(--aka); color: var(--shiro); border: 3px solid var(--shiro); border-radius: 6px; font-size: 26px; font-weight: 900; }

/* リール窓 */
.window { position: relative; box-sizing: border-box; height: 332px; padding: 12px 28px; background: var(--sumi); border-radius: 10px; }
.reels { display: flex; gap: 24px; }
.reel { position: relative; box-sizing: border-box; width: 296px; height: 288px; overflow: hidden; background: var(--shiro); border: 6px solid #2A2A30; border-radius: 4px; }
.reel::after { content: ""; position: absolute; left: 0; right: 0; top: 92px; height: 92px; box-sizing: border-box; border-top: 4px solid var(--aka); border-bottom: 4px solid var(--aka); pointer-events: none; }
.strip { will-change: transform; }
.cell { height: 92px; display: flex; align-items: center; justify-content: center; }
.cell.win { background: var(--kin); }
.sym { width: 76px; height: 76px; display: block; }
.mark { position: absolute; top: 144px; width: 0; height: 0; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
.mark--l { left: 6px; border-left: 16px solid var(--aka); }
.mark--r { right: 6px; border-right: 16px solid var(--aka); }
.lamps { display: flex; gap: 24px; margin-top: 8px; }
.lamp { width: 296px; height: 12px; border-radius: 6px; background: var(--keshi); }
.lamp.on { background: var(--kin); }

/* 回転中: 1周 6コマ=552px を下向きに流す */
.reel.spin { background: #E9E7DF; }
.reel.spin .strip { animation: spin 240ms linear infinite; }
.reel.spin .sym { transform: scaleY(1.4); opacity: .55; }
.reel.d1 .strip { animation-delay: -80ms; }
.reel.d2 .strip { animation-delay: -160ms; }
.reel.slow .strip { animation-duration: 600ms; }
@keyframes spin { from { transform: translateY(-552px); } to { transform: translateY(0); } }

/* 状態ごと */
.cab--spin .call-text { color: var(--kin); }

.cab--reach .call { animation: reach-band 400ms steps(1) infinite; }
.cab--reach .call-text { font-size: 64px; animation: reach-text 400ms steps(1) infinite; }
.cab--reach .mark--l { border-left-color: var(--kin); }
.cab--reach .mark--r { border-right-color: var(--kin); }
.reel.slow { outline: 6px solid var(--kin); animation: reach-reel 400ms steps(1) infinite; }
@keyframes reach-band { 0% { background: var(--kin); } 50% { background: var(--aka); } }
@keyframes reach-text { 0% { color: var(--koaka); } 50% { color: var(--shiro); } }
@keyframes reach-reel { 0% { outline-color: var(--kin); } 50% { outline-color: var(--aka); } }

.cab--small .call { background: var(--aka); }
.cab--small .call-text { color: var(--shiro); text-shadow: 0 5px 0 var(--sumi); }

.cab--jackpot { animation: cab-flash 500ms steps(1) infinite; }
.cab--jackpot .call { background: var(--kin); }
.cab--jackpot .call-text { font-size: 72px; color: var(--koaka); }
.cab--jackpot .mark--l { border-left-color: var(--kin); }
.cab--jackpot .mark--r { border-right-color: var(--kin); }
.burst { position: absolute; left: 50%; top: 50%; width: 1200px; height: 1200px; margin: -600px 0 0 -600px; fill: var(--usukin); animation: burst 6000ms linear infinite; }
@keyframes cab-flash { 0% { border-color: var(--kin); } 50% { border-color: var(--shiro); } }
@keyframes burst { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.cab--lose .call-text { font-family: var(--f-ja); font-weight: 900; font-size: 52px; color: var(--nibi); }

/* ===== 待機（小表示 376×112・右下。筐体の下端にそろえる） ===== */
.mini {
  position: absolute; right: 24px; bottom: 112px;
  box-sizing: border-box; width: 376px; height: 112px; padding: 0 14px;
  display: flex; align-items: center; gap: 14px;
  background: var(--aka); border: 6px solid var(--kin); border-radius: 12px;
  box-shadow: 0 0 0 4px var(--sumi);
  animation: mini-lamp 2000ms steps(1) infinite;
}
.mini-reels { display: flex; gap: 6px; }
.mini-reel { box-sizing: border-box; width: 48px; height: 72px; display: grid; place-items: center; background: var(--shiro); border: 4px solid var(--sumi); border-radius: 4px; }
.mini-reel svg { width: 36px; height: 36px; }
.mini-text { margin: 0; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 32px; font-weight: 900; line-height: 1.15; color: var(--shiro); text-shadow: 0 3px 0 var(--sumi); }
.mini-gift { box-sizing: border-box; max-width: 100%; padding: 0 8px; background: var(--sumi); color: var(--kin); border-radius: 4px; text-shadow: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes mini-lamp { 0% { border-color: var(--kin); } 50% { border-color: var(--shiro); } }

</style>
</head>
