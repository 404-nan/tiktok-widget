# ライコネの設定
#
# このファイルを保存すると、開いているウィジェットに自動で反映されます。
# 書ける項目の一覧: npm run tw -- reference
# AI に頼むときは MCP サーバー（npm run mcp）か CLI（npm run tw）を使います。
#
# 色は "#RRGGBB" か、テーマの色の名前 accent（朱）/ gold（金）/ ink（墨）/ ink-2 / paper（白）。
# ギフト名は TikTok の英語名・日本語名・ID のどれでも書けます。画面には TikTok の日本語名を出します。

theme:
  mode: dark # dark / light
  accent: "#FF4F1F" # 差し色（朱）
  gold: "#FFC53D" # コイン・達成の色

# ギフト通知 … /widgets/gift-alert.html（default 以外は ?id=名前）
alerts:
  default:
    events: [gift, follow]
    minCoins: 1
    bigCoins: 100
    position: top
    align: left
    # rules: 条件ごとに見た目を変える。上から順に、最初に合ったものを使う
    #   常連さんの色を変える例: - { users: [your_friend_id], color: "#3FA9F5" }
    rules:
      # 高額ギフトは長めに、文も変える
      - gifts: [Lion, Universe]
        big: true
        duration: 8
        text: 本当にありがとうございます！

# コメント欄 … /widgets/chat.html（default 以外は ?id=名前）
# この配信でギフトを送った人のコメントは、金の縁と送ったコインの合計で目立たせる。
# 合計が gifterCoins 以上で金の帯 → bigGifterCoins 以上で金の縁 → topGifterCoins 以上で金の面。
chats:
  default:
    style: telop # telop テロップ風（下から積み上がる）/ bubble 吹き出し風
    maxItems: 8
    lifetime: 60 # この秒数で古いものを消す（0 で消さない）
    bigGifterCoins: 1000
    topGifterCoins: 10000
    hideWords: [] # 出さない言葉（NG ワード）。例: [宣伝, 荒らし]
    hideUsers: [] # 出さないユーザーの ID（ボットなど）
    hideCommands: true # 「!」で始まるコメント（ボットへのコマンド）を出さない
    tts: false # 読み上げ（パソコンの日本語の声）。ギフトした人だけは ttsGiftersOnly: true

# ギフト瓶 … /widgets/gift-jar.html（default 以外は ?id=名前）
jars:
  default:
    shape: jar # jar 保存瓶 / heart ハート / potion エリクサー
    title: ギフト瓶
  elixir:
    shape: potion
    title: エリクサー
    liquidColor: accent

# 目標バー … /widgets/goal.html
goals:
  default:
    title: フォロー目標
    metric: follows # follows / likes / diamonds / gifts / shares / comments / viewers
    goal: 100

# いいね・視聴者数 … /widgets/counter.html
counters:
  default:
    show: [likes, viewers]

# WIN数 … /widgets/wins.html（default 以外は ?id=名前）
# 妨害マイクラなどのクリア回数。クリアしたらダッシュボード・モニターのボタンか
# URL（Stream Deck など）で +1: http://127.0.0.1:3939/api/wins/default/win
# リセットはボタンか http://127.0.0.1:3939/api/wins/default/reset
# 一度に大きく減ると 大妨害（-10〜）→ 超妨害（-100〜）→ 壊滅（-1000〜）と派手になる（境目は lossPreset で選ぶ）。
# 連続妨害（15 秒以内に続けて減る）でも段階が上がる（×3 で大妨害、×5 で超妨害、×8 で壊滅）。強さの倍率は power。
# 増えたときも 大（+10〜・金）→ 超（+100〜・虹）→ 最大（+1000〜・暗転からの虹と花火）。境目は gainPreset。目標達成はいちばん派手。
# 全画面の演出は /widgets/wins-fx.html を配信画面いっぱいに重ねる。
# 数は data/wins.json に残るので、配信をまたいで続けられる。
wins:
  default:
    title: WIN
    goal: 10 # 「/ 10」と出す（0 で出さない）
    lossPreset: large # 演出の段階の境目 large -10/-100/-1000・medium -3/-10/-30・small -1/-3/-5（-1 から派手に）
    # ギフトで増減（上から順に最初に合ったもの。add は個数分、set はその数にする、reset: true で 0 に）
    rules:
      - {gifts: [Lion], add: -1, text: 妨害成功} # ライオンで WIN -1
      - {gifts: [Universe], reset: true} # ユニバースで 0 にリセット
      - {gifts: [GG], add: 1, text: 応援} # GG で WIN +1

# 延長タイマー（サブアソン）… /widgets/timer.html（default 以外は ?id=名前）
# 配信の残り時間。ギフト・フォロー・いいねで時間が延びる。ダッシュボード・モニターのボタンか URL でスタート:
# http://127.0.0.1:3939/api/timer/default/start ／ 一時停止 …/pause ／ 止める・動かすを1つで …/toggle
# 足す …/add?seconds=60（-60 で引く。?minutes=5 でも可）／ 初めの時間に戻す …/reset
# 状態は data/timers.json に残るので、OBS やサーバーを再起動しても続きから。
timers:
  default:
    startMinutes: 60 # 初めの時間（分）
    maxHours: 12 # 延びても合計 12 時間まで（0 で上限なし）
    coinSeconds: 10 # 1 コインで 10 秒
    followSeconds: 30 # フォローで 30 秒
    likeEvery: 100 # いいね 100 回ごとに
    likeSeconds: 10 # 10 秒
    # 指定のギフトで延ばす（上から順に最初に合ったもの。合ったら coinSeconds の計算はしない）
    rules:
      - {gifts: [Galaxy], minutes: 10} # ギャラクシーで 10 分
      - {gifts: [Finger Heart], minutes: 1} # フィンガーハートは 1 個 1 分（マイナスにすると減る）

# ボス討伐 … /widgets/boss.html（default 以外は ?id=名前）
# ギフトのコインがダメージになり、みんなでボスの HP を削る。HP が 0 で「討伐!」、少し待つと次のボス。
# HP を戻す（Stream Deck など）: http://127.0.0.1:3939/api/boss/default/heal
# HP は data/boss.json に残るので、OBS を読み込み直しても続きから出る。
bosses:
  default:
    name: 魔王
    hp: 10000 # 1体目の最大 HP（1 コイン = 1 ダメージ）
    hpScale: 1.5 # 倒すたびに次のボスの HP を 1.5 倍
    nextNames: [闇の騎士, 冥王] # 2体目からの名前
    damageFrom: [coins] # likes も入れると、いいねでも削れる
    image: "" # 例: media/boss.png（空なら図形の鬼）
    roulette: "" # 討伐で回すルーレットの名前（例: reward）
    commands: [] # 討伐で Minecraft に送るコマンド（例: ["say {user} が {boss} を討伐！"]）

# 通常カットイン … /widgets/cutin.html（配信画面いっぱいに重ねる。default 以外は ?id=名前）
# 筆の帯と文字だけ。ギフトのコインで 青 → 緑 → 赤 → 金 → 虹 と格上げ。虹は画面が止まってから入る。
cutins:
  default:
    textWeight: normal # normal 普通 / bold 太字
    minCoins: 100
    greenCoins: 300
    redCoins: 1000
    goldCoins: 5000
    rainbowCoins: 20000

# 画像付きカットイン … /widgets/image-cutin.html（default 以外は ?id=名前）
# imageStyle: stripe 縞・標準 / invert 縞・反転 / thick 縞・枠太。空なら layout の帯
# layout: inside 帯の中いっぱいに写真（縁が木炭のかすれ線）/ side 色の帯の横に写真が大きく乗る
# crop は切り抜きの位置だけ。元の画像ファイルは変えない
imageCutins:
  default:
    photo: "" # 例: media/my-photo.jpg（inside で空なら段階の色で埋める）
    imageStyle: "" # stripe / invert / thick。空なら今までの帯
    crop: {x: 0.5, y: 0.5, scale: 1}
    layout: inside
    minCoins: 1000 # 画像付きは高額ギフトだけにする例

# ルーレット … /widgets/roulette.html（全部）または ?ids=名前,名前
# 届いたギフトに合うルーレットに切り替わって回ります。
roulettes:
  punishment:
    name: 罰ゲーム
    style: wheel # wheel 丸 / strip 横スライド
    gifts: [Rose]
    items:
      - ハズレ
      - {label: 歌う, weight: 2, image: media/samples/mic.svg}
      - {label: 激辛チャレンジ, image: media/samples/chili.svg}
      - {label: 隕石が降る, color: ink-2, superstreamGift: 6001}
      - 一発ギャグ
      - {label: 変顔, weight: 2}
  reward:
    name: ご褒美
    style: strip
    gifts: [Doughnut]
    minCoins: 100 # 100 コイン以上のギフトでも回る
    items:
      - {label: 名前を呼ぶ, weight: 3}
      - {label: リクエスト曲, image: media/samples/note.svg}
      - {label: プレゼント, image: media/samples/gift.svg, color: gold}
      - {label: もう一回, color: ink-2}
      - {label: RUSH, color: gold, rush: true} # 当たったら RUSH 突入

# RUSH（確変）モード … /widgets/rush.html（配信画面いっぱいに重ねる）
# 突入すると左右に「RUSH中」の帯と虹色の光のシャワー。RUSH 中のギフトで時間が延び、合計が数え上がる。
rush:
  enabled: true
  gifts: [Lion] # このギフトで突入
  enterCoins: 20000 # この合計コイン以上のギフトでも突入（0 で無効）
  duration: 60 # 秒
  extendMinCoins: 100 # RUSH 中、このコイン以上のギフトで
  extendSeconds: 5 # この秒数だけ延びる
  maxSeconds: 300 # 延びても最長この秒数まで

# ランキング … /widgets/ranking.html（default 以外は ?id=名前）
rankings:
  default:
    title: トップギフター
    metric: coins # coins / gifts / likes
    limit: 5
  likes:
    title: いいねランキング
    metric: likes
    limit: 3

# Minecraft 連携（RCON）… SuperStream と組み合わせて使えます
# server.properties で enable-rcon=true / rcon.port / rcon.password を設定してください。
# commands の {user} {gift} {count} {coins} {item} {roulette} は置き換わります。
# superstreamGift: そのギフト ID に SuperStream で設定した演出を起こす（ss test profile）
# superstreamAction: SuperStream の演出を1つ起こす（ss test action。例 lightning / meteorite）
minecraft:
  enabled: false
  host: 127.0.0.1
  port: 25575
  password: ""
  superstreamProfile: default_profile
  # SuperStream のプロフィールの場所（書くと、設定済みの演出をダッシュボードや AI で一覧できる）
  superstreamFile: ""
  # true: 届いたギフトをそのまま SuperStream に渡す（SuperStream 側で /ss profile start していないとき用）
  forwardGifts: false
  rules:
    - name: フォローで雷
      events: [follow]
      superstreamAction: lightning
      commands: ["say {user} さん、フォローありがとう！"]
    - name: 1000 コイン以上で隕石
      minCoins: 1000
      superstreamGift: 6001
