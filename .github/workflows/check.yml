name: check
# PR と next への push で確認する。GitHub のランナーを使う(公開リポジトリに自宅サーバーのランナーをつながない)
on:
  pull_request:
  push:
    branches: [next]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run check:ui
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: |
            artifacts/candidates
            artifacts/test-results
          if-no-files-found: ignore
          retention-days: 14
