# Cloudflare に公開する（main か作業ブランチに push したとき、または Actions の画面から手で）
# 先に GitHub の Settings → Secrets and variables → Actions に次を入れておく:
#   CLOUDFLARE_API_TOKEN … Cloudflare の API トークン（「Cloudflare Workers を編集する」のテンプレートで作る）
#   TW_ADMIN_TOKEN       … 管理画面 /admin/ の合言葉（自分で決めた長めの文字）
#   CLOUDFLARE_ACCOUNT_ID … （なくてもよい。アカウントが複数あるときだけ）
#   TIKTOK_SIGN_API_KEY  … （なくてもよい。Euler Stream の API キー）
name: Cloudflare に公開

on:
  push:
    branches: [main, claude/tiktok-widgets-2qpqbk]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 準備ができているか確かめる
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TW_ADMIN_TOKEN: ${{ secrets.TW_ADMIN_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$TW_ADMIN_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN と TW_ADMIN_TOKEN を GitHub の Secrets に入れると、Cloudflare に公開されます（今回は飛ばしました）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: テスト
        if: steps.check.outputs.ready == 'true'
        run: npm ci && npm test

      - name: Cloudflare に公開
        if: steps.check.outputs.ready == 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TW_ADMIN_TOKEN: ${{ secrets.TW_ADMIN_TOKEN }}
          TIKTOK_SIGN_API_KEY: ${{ secrets.TIKTOK_SIGN_API_KEY }}
        run: |
          npm ci
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          # 合言葉などは、ファイルに書いて一緒に送る（ログには出ない）
          umask 077
          node -e 'const e=process.env; const s={TW_ADMIN_TOKEN:e.TW_ADMIN_TOKEN}; if(e.TIKTOK_SIGN_API_KEY) s.TIKTOK_SIGN_API_KEY=e.TIKTOK_SIGN_API_KEY; require("fs").writeFileSync("secrets.json", JSON.stringify(s))'
          npx wrangler deploy --secrets-file secrets.json --containers-rollout immediate
          rm -f secrets.json
