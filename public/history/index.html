<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配信の統計</title>
<link rel="stylesheet" href="/dashboard/style.css">
<link rel="stylesheet" href="history.css">
</head>
<body>

<header class="topbar panel">
  <div class="brand">
    <div class="brand-title" id="brandTitle">配信の統計</div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">未接続</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="画面"></nav>
  <button class="icon-btn pressable" id="themeBtn" type="button" aria-label="テーマを切り替え"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
</header>

<main class="history">
  <p class="history-empty" id="historyEmpty" hidden>配信すると、ここに記録がたまります</p>
  <section class="panel section solid sessions-panel" id="sessionsPanel">
    <div class="section-head">
      <h2>配信</h2>
      <div class="segmented" id="sessionFilter" role="tablist">
        <button type="button" class="pressable" data-demo="0" aria-selected="true">本番</button>
        <button type="button" class="pressable" data-demo="1" aria-selected="false">デモも</button>
      </div>
    </div>
    <ol class="sessions" id="sessions"></ol>
  </section>

  <div class="detail" id="detail">
    <section class="panel summary">
      <div class="summary-head">
        <div>
          <h2 id="title">配信を選んでください</h2>
          <div class="hint" id="subtitle"></div>
        </div>
        <button class="text-btn danger pressable" id="deleteBtn" type="button" hidden>この記録を消す</button>
      </div>
      <div class="summary-body">
        <div class="hero-main">
          <div class="kpi-label">コイン</div>
          <div class="hero-value" id="heroCoins">–</div>
          <div class="delta" id="heroDelta"></div>
        </div>
        <div class="stat-grid" id="stats"></div>
      </div>
    </section>

    <section class="panel section solid">
      <div class="section-head"><h2>コイン（1分ごと）</h2><span class="hint" id="coinsNote"></span></div>
      <div id="coinsChart"></div>
    </section>

    <div class="two">
      <section class="panel section solid">
        <h2>視聴者の推移</h2>
        <div id="viewersChart"></div>
      </section>
      <section class="panel section solid">
        <h2>いいね（1分ごと）</h2>
        <div id="likesChart"></div>
      </section>
    </div>

    <div class="two">
      <section class="panel section solid">
        <h2>トップギフター</h2>
        <table class="table" id="gifters"></table>
      </section>
      <section class="panel section solid">
        <h2>ギフトの内訳</h2>
        <table class="table" id="giftTypes"></table>
      </section>
    </div>

    <section class="panel section solid" id="roulettePanel">
      <h2>ルーレットの結果</h2>
      <div class="roulette-results" id="rouletteResults"></div>
    </section>

    <section class="panel section solid">
      <details class="more">
        <summary>1分ごとの数字を表で見る</summary>
        <div class="table-scroll"><table class="table" id="timelineTable"></table></div>
      </details>
    </section>
  </div>
</main>

<script type="module" src="history.js"></script>
</body>
</html>
