<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok LIVE ウィジェット</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar panel">
  <div class="brand">
    <div class="brand-title">TikTok LIVE ウィジェット</div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">未接続</span></div>
  </div>
  <button class="icon-btn pressable" id="themeBtn" type="button" aria-label="テーマを切り替え"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
</header>

<main class="layout">
  <section class="panel kpis" id="kpis" aria-label="集計"></section>

  <div class="col">
    <section class="panel section">
      <h2>接続</h2>
      <form id="connectForm" class="stack">
        <label class="field">
          <span class="field-label">TikTok のユーザー名</span>
          <span class="input-wrap"><span class="prefix">@</span><input id="username" name="username" autocomplete="off" placeholder="username" required></span>
        </label>
        <details class="more">
          <summary>詳細設定</summary>
          <label class="field">
            <span class="field-label">署名サーバーの API キー（任意）</span>
            <input id="signApiKey" type="password" autocomplete="off" placeholder="Euler Stream の API キー">
            <span class="hint">つながりにくいときに設定します。サーバー側の環境変数 TIKTOK_SIGN_API_KEY でも指定できます。</span>
          </label>
        </details>
        <div class="row">
          <button class="btn primary pressable" id="connectBtn" type="submit">接続</button>
          <button class="btn pressable" id="demoBtn" data-icon="play" type="button">デモを流す</button>
          <button class="btn pressable" id="disconnectBtn" type="button" hidden>切断</button>
        </div>
        <p class="message" id="message"></p>
      </form>
    </section>

    <section class="panel section">
      <h2>テスト送信</h2>
      <div class="stack">
        <div class="row">
          <select id="giftSelect" class="grow" aria-label="ギフト"></select>
          <input id="giftCount" type="number" min="1" max="999" value="1" class="count-input" aria-label="個数">
          <button class="btn primary pressable" data-sim="gift" data-icon="gift" type="button">送る</button>
        </div>
        <div class="row wrap">
          <button class="chip pressable" data-sim="like" data-icon="heart" type="button">いいね ×20</button>
          <button class="chip pressable" data-sim="follow" data-icon="user-plus" type="button">フォロー</button>
          <button class="chip pressable" data-sim="share" data-icon="repeat-2" type="button">シェア</button>
          <button class="chip pressable" data-sim="chat" data-icon="message-circle" type="button">コメント</button>
          <button class="chip pressable" data-sim="viewers" data-icon="eye" type="button">視聴者数</button>
        </div>
        <button class="text-btn pressable" id="resetBtn" type="button">集計をリセット</button>
      </div>
    </section>

    <section class="panel section solid">
      <h2>最近のイベント</h2>
      <ol class="log" id="log"></ol>
    </section>
  </div>

  <section class="panel section widgets">
    <div class="widgets-head">
      <h2>ウィジェット</h2>
      <div class="segmented" id="tabs" role="tablist"></div>
    </div>
    <p class="desc" id="widgetDesc"></p>

    <div class="widget-body">
      <form class="settings" id="settings"></form>

      <div class="preview-col">
        <div class="url-row">
          <input id="widgetUrl" readonly aria-label="ウィジェットの URL">
          <button class="btn primary pressable" id="copyBtn" data-icon="copy" type="button"><span>コピー</span></button>
        </div>
        <p class="hint" id="sizeHint"></p>
        <div class="row wrap" id="actions"></div>
        <div class="preview" id="preview"><iframe id="frame" title="プレビュー"></iframe></div>
      </div>
    </div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
