<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理画面 · TikTok LIVE ウィジェット</title>
<link rel="stylesheet" href="/dashboard/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="topbar panel">
  <div class="brand">
    <div class="brand-title">管理画面</div>
    <span class="hint">契約している配信者と、豪華な演出のオン/オフ</span>
  </div>
  <button class="chip pressable" id="logoutBtn" type="button" hidden>合言葉を入れ直す</button>
  <button class="icon-btn pressable" id="themeBtn" type="button" aria-label="テーマを切り替え"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
</header>

<main class="admin">
  <!-- 合言葉 -->
  <section class="panel section" id="loginPanel" hidden>
    <h2>合言葉を入れてください</h2>
    <form id="loginForm" class="stack">
      <label class="field">
        <span class="field-label">管理画面の合言葉</span>
        <input id="tokenInput" type="password" autocomplete="off" required>
        <span class="hint">サーバーを起動したときに表示される場所（data/admin-token.txt）か、環境変数 TW_ADMIN_TOKEN に書いてあります。</span>
      </label>
      <div class="row"><button class="btn primary pressable" type="submit">開く</button></div>
    </form>
    <p class="form-message error" id="loginMessage"></p>
  </section>

  <div id="main" hidden>
    <!-- 全員まとめて -->
    <section class="panel section">
      <div class="section-head">
        <h2>豪華な演出（全員まとめて）</h2>
        <span class="hint">ここでオンにすると、配信者ごとの設定に関係なく全員が使えます</span>
      </div>
      <div class="grants" id="globalGrants"></div>
      <div class="row">
        <button class="chip pressable" id="everyoneOff" type="button">全員の個別のオンを消す</button>
        <span class="hint">配信者ごとに付けたオンを、全員分まとめてオフにします</span>
      </div>
    </section>

    <!-- 配信者を追加 -->
    <section class="panel section">
      <h2>配信者を追加</h2>
      <form id="createForm" class="row">
        <input id="newName" placeholder="配信者の名前（例: たろう）" autocomplete="off" required>
        <button class="btn primary pressable" type="submit">追加して URL を作る</button>
      </form>
      <p class="form-message" id="message"></p>
    </section>

    <!-- 配信者の一覧 -->
    <div class="tenants" id="tenants"></div>
  </div>
</main>

<script type="module" src="admin.js"></script>
</body>
</html>
