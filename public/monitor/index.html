<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配信モニター</title>
<link rel="stylesheet" href="/dashboard/style.css">
<link rel="stylesheet" href="monitor.css">
</head>
<body>

<header class="topbar panel">
  <div class="brand">
    <div class="brand-title">TikTok LIVE ウィジェット</div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">未接続</span></div>
  </div>
  <nav class="nav" id="nav" aria-label="画面"></nav>
  <button class="icon-btn pressable" id="themeBtn" type="button" aria-label="テーマを切り替え"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
</header>

<main class="monitor">
  <!-- この配信の数字。コインだけ大きく -->
  <section class="panel hero" aria-label="この配信">
    <div class="hero-main">
      <div class="kpi-label"><span data-icon="coins"></span>この配信のコイン</div>
      <div class="hero-value" id="coins">0</div>
      <div class="hero-sub" id="elapsed">配信していません</div>
    </div>
    <div class="hero-kpis" id="kpis"></div>
    <div class="hero-chart">
      <div class="kpi-label">1分ごとのコイン（直近30分）</div>
      <div id="spark"></div>
    </div>
  </section>

  <section class="panel section solid feed-panel">
    <div class="section-head">
      <h2>ライブ</h2>
      <div class="segmented" id="feedFilter" role="tablist">
        <button type="button" class="pressable" data-filter="all" aria-selected="true">すべて</button>
        <button type="button" class="pressable" data-filter="gift">ギフト</button>
        <button type="button" class="pressable" data-filter="chat">コメント</button>
        <button type="button" class="pressable" data-filter="follow">フォロー</button>
      </div>
    </div>
    <ol class="feed" id="feed"></ol>
  </section>

  <div class="side">
    <section class="panel section" id="winsSection" hidden>
      <h2>WIN数</h2>
      <div class="win-list" id="winsList"></div>
    </section>

    <section class="panel section" id="rushSection">
      <div class="section-head">
        <h2>RUSH</h2>
        <span class="hint" id="rushText">待機中</span>
      </div>
      <div class="roulette-buttons" id="rushButtons"></div>
    </section>

    <section class="panel section">
      <div class="section-head">
        <h2>ルーレット</h2>
        <span class="hint" id="rouletteQueue"></span>
      </div>
      <div class="roulette-buttons" id="roulettes"></div>
      <ol class="results" id="results"></ol>
    </section>

    <section class="panel section">
      <h2>目標</h2>
      <div class="goals" id="goals"></div>
    </section>

    <section class="panel section">
      <div class="section-head">
        <h2>トップギフター</h2>
        <span class="hint">この配信</span>
      </div>
      <ol class="ranking" id="ranking"></ol>
    </section>

    <section class="panel section" id="mcSection">
      <div class="section-head">
        <h2>Minecraft</h2>
        <div class="status" id="mcStatus"><span class="dot"></span><span></span></div>
      </div>
      <ol class="log mc-log" id="mcLog"></ol>
    </section>
  </div>
</main>

<script type="module" src="monitor.js"></script>
</body>
</html>
