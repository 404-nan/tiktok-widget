<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コメント投票</title>
<style>
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
  body { color: #F6F5F1; font-family: "Zen Kaku Gothic New", "Yu Gothic", Meiryo, sans-serif; }
  #vote { box-sizing: border-box; width: min(96vw, 720px); min-height: 320px; margin: 2vh auto; padding: 24px 28px; background: #111113; border: 4px solid #F6F5F1; }
  #vote.idle { display: none; }
  #head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; border-bottom: 3px solid #F6F5F1; padding-bottom: 12px; }
  #title { margin: 0; font-size: clamp(24px, 5vw, 46px); letter-spacing: .08em; }
  #timer { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: clamp(34px, 7vw, 64px); line-height: 1; }
  #state { min-height: 1.4em; margin: 12px 0 8px; color: #FFC53D; font-size: 18px; font-weight: 800; letter-spacing: .12em; }
  #rows { display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: 42px minmax(90px, 1fr) minmax(160px, 3fr) 92px; gap: 12px; align-items: center; min-height: 42px; }
  .number { color: #FFC53D; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 30px; text-align: center; }
  .label { overflow-wrap: anywhere; font-size: 20px; font-weight: 700; }
  .bar { height: 22px; overflow: hidden; background: #25262B; }
  .fill { height: 100%; width: 0; background: #F6F5F1; transition: width .25s ease; }
  #vote.closed .fill, #vote.revealing .fill { transition: none; }
  .row.voted { animation: vote-flash .45s ease-out; }
  .row.voted .number, .row.voted .label, .row.voted .count { filter: brightness(1.7); }
  .row.leading .fill { background: #FF4F1F; }
  .count { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: 24px; text-align: right; white-space: nowrap; }
  #names { min-height: 1.4em; margin: 16px 0 0; color: #C9C9D1; font-size: 16px; text-align: right; }
  #vote.closed #state { background: #FF4F1F; color: #111113; padding: 5px 10px; }
  #vote.revealing #rows { opacity: .55; }
  #vote.result .row.winner .number, #vote.result .row.winner .label, #vote.result .row.winner .count { color: #FFC53D; }
  #vote.result .row.winner .fill { background: #FFC53D; }
  #vote.result .row.loser { opacity: .38; }
  #vote.result.hit { animation: hit .18s linear 2; }
  @keyframes hit { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(7px); } }
  @keyframes vote-flash { 0% { filter: brightness(1.8); } 100% { filter: brightness(1); } }
  @media (max-width: 520px) {
    #vote { padding: 18px; }
    .row { grid-template-columns: 30px minmax(70px, 1fr) minmax(70px, 2fr) 72px; gap: 6px; }
    .label { font-size: 16px; }
    .count { font-size: 20px; }
  }
</style>
</head>
<body>
<main id="vote" class="idle" aria-live="polite">
  <div id="head"><h1 id="title">どれにする?</h1><div id="timer"></div></div>
  <div id="state"></div>
  <div id="rows"></div>
  <p id="names"></p>
</main>
<script src="vote.js"></script>
</body>
</html>
