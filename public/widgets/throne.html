<!-- サーバーが決めた王座とVSを表示する公開ウィジェット（外部素材なし・ES5）。 -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>動く王座</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Yu Gothic",Meiryo,sans-serif;color:#F6F5F1}
#crown{position:fixed;top:4vh;left:4vw;min-width:250px;padding:14px 18px;background:#111113;border-left:8px solid #FFC53D;border-radius:6px;font-size:20px;font-weight:700}
#crown small{display:block;font-size:14px;font-weight:400;margin-top:4px;color:#C9C9D1}
#versus{position:fixed;left:50%;top:50%;width:min(86vw,760px);transform:translate(-50%,-50%);display:none;background:#111113;border:8px solid #2ECC71;padding:28px;box-sizing:border-box;text-align:center}
#versus.show{display:block;animation:in .6s ease-out both}
#label{font-size:42px;font-weight:900;letter-spacing:.08em;color:#2ECC71}
#players{display:flex;justify-content:space-around;align-items:center;gap:20px;margin-top:20px}
.player{width:42%;font-size:28px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:0}.player img{display:block;width:88px;height:88px;border-radius:50%;object-fit:cover;margin:0 auto 10px}.vs{font-size:32px;color:#F6F5F1}.entered .player{opacity:1}.moving{animation:move 1.2s ease-in-out both}
@keyframes in{from{opacity:0;transform:translate(-50%,-50%) scale(.85)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes move{0%{transform:translateX(0)}50%{transform:translateX(120px)}100%{transform:translateX(0)}}
</style></head><body>
<div id="crown">王座: <span id="king">-</span><small id="reign">在位 0 秒</small></div>
<div id="versus"><div id="label">VS</div><div id="players"><div class="player"><img id="leftAvatar" alt=""><span id="leftName"></span></div><div class="vs">VS</div><div class="player"><img id="rightAvatar" alt=""><span id="rightName"></span></div></div><div id="difference"></div></div>
<script>
/* 王座の集計と勝敗はサーバー状態を使い、再接続しても画面を続きから表示する（ES5）。 */
(function(){
  var base='', m=location.pathname.match(/^\/t\/[^/]+/); if(m) base=m[0];
  var crown=document.getElementById('crown'), king=document.getElementById('king'), reign=document.getElementById('reign'), box=document.getElementById('versus');
  var leftName=document.getElementById('leftName'), rightName=document.getElementById('rightName'), leftAvatar=document.getElementById('leftAvatar'), rightAvatar=document.getElementById('rightAvatar'), difference=document.getElementById('difference'), audio=null;
  function name(row){return row&&row.user&&row.user.name?String(row.user.name):'新しい王';}
  function sound(){var C=window.AudioContext||window.webkitAudioContext,g,o;if(!C)return;try{audio=audio||new C();g=audio.createOscillator();o=audio.createGain();g.frequency.value=220;o.gain.value=.06;g.connect(o);o.connect(audio.destination);g.start();g.stop(audio.currentTime+.12);}catch(e){}}
  function person(row,n){n.textContent=name(row);}
  function avatar(row,img){img.style.display='none';img.removeAttribute('src');if(row&&row.user&&(row.user.avatar||row.user.avatarUrl)){img.src=row.user.avatar||row.user.avatarUrl;img.onload=function(){img.style.display='block';};}}
  function render(data){var l=data&&data.leader,v=data&&data.versus;if(l){king.textContent=name(l);reign.textContent='在位 '+Math.floor((l.reignMs||0)/1000)+' 秒';}else{king.textContent='-';reign.textContent='在位 0 秒';}if(!v){box.className='';return;}person(v.left,leftName);person(v.right,rightName);avatar(v.left,leftAvatar);avatar(v.right,rightAvatar);difference.textContent=v.difference==null?'':'差 '+v.difference;box.style.borderColor=v.result==='newKing'?'#FF4F1F':'#2ECC71';document.getElementById('label').textContent='VS';box.className='show';sound();setTimeout(function(){box.className='show entered';},250);setTimeout(function(){document.getElementById('label').textContent=v.result==='newKing'?'新しい王':(v.result==='defense'?'防衛':'VS');},900);if(v.result==='newKing'){crown.className='moving';setTimeout(function(){crown.className='';},1200);}setTimeout(function(){box.className='';},2800);}
  function read(){var x=new XMLHttpRequest();x.open('GET',base+'/api/throne',true);x.onreadystatechange=function(){if(x.readyState===4&&x.status===200){try{render(JSON.parse(x.responseText));}catch(e){}}};x.send(null);}
  function connect(){var p=location.protocol.indexOf('https')===0?'wss:':'ws:';var ws=new WebSocket(p+'//'+location.host+base+'/ws'+(/[?&]preview=1/.test(location.search)?'?preview=1':''));ws.onmessage=function(e){var d;try{d=JSON.parse(e.data);}catch(x){return;}if(d.type==='throne')render(d.state||d);};ws.onclose=function(){setTimeout(connect,1000);};}
  read();connect();
}());
</script></body></html>
