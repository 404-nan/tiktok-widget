<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>目標バー</title>
<link rel="stylesheet" href="lib/overlay.css">
<style>
  body { display: flex; align-items: center; padding: 24px 32px; }

  .panel {
    width: 100%;
    padding: 16px 24px 16px 20px;
    background: var(--surface);
    border-left: 6px solid var(--signal);
    border-radius: var(--r);
    box-shadow: var(--lift);
    transition: border-color .3s linear;
  }
  .done .panel { border-left-color: var(--gold); }

  .head { display: flex; align-items: flex-end; gap: 12px; }
  .title-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding-bottom: 4px; }
  .title { font-size: 18px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clear {
    flex: none;
    padding: 3px 10px 4px;
    border-radius: 2px;
    background: var(--gold);
    color: var(--ink);
    font-size: 13px;
    font-weight: 900;
    letter-spacing: .08em;
    clip-path: inset(0 100% 0 0);
    transition: clip-path .4s var(--ease-wipe);
  }
  .done .clear { clip-path: inset(0 0 0 0); }

  .count { display: flex; align-items: baseline; gap: 6px; line-height: 1; }
  .count .value { font-size: 44px; }
  .count .goal { font-size: 22px; color: var(--on-surface-dim); }

  .track { position: relative; height: 12px; margin-top: 12px; background: var(--ink-3); border-radius: 2px; overflow: hidden; }
  [data-theme=light] .track { background: var(--surface-2); }
  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 100%;
    background: var(--signal);
    transform-origin: left;
    transform: scaleX(0);
    transition: transform .9s var(--ease-out), background-color .3s linear;
  }
  .done .fill { background: var(--gold); }
  .ticks { position: absolute; inset: 0; display: flex; justify-content: space-evenly; pointer-events: none; }
  .ticks i { width: 2px; background: var(--surface); opacity: .55; }

  .foot { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--on-surface-dim); }
  .foot .pct { font-family: var(--font-num); font-weight: 600; font-size: 15px; letter-spacing: .02em; }
</style>
</head>
<body>
<div class="panel" id="panel">
  <div class="head">
    <div class="title-wrap"><div class="title" id="title"></div><div class="clear">達成</div></div>
    <div class="count num"><span class="value" id="value"></span><span class="goal">/ <span id="goal"></span></span></div>
  </div>
  <div class="track"><div class="fill" id="fill"></div><div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="foot"><span id="remain"></span><span class="pct" id="pct"></span></div>
</div>
<script type="module">
  import { setupPage, params, connect, odometer, fmt, chime } from './lib/overlay.js';

  setupPage();
  const p = params({
    metric: 'follows',     // follows / likes / diamonds / gifts / shares / comments / viewers
    goal: 100,             // 目標値
    start: 0,              // 接続前に稼いだ分などを足しておく
    step: 0,               // 達成したら目標をこの数だけ引き上げる（0 なら引き上げない）
    title: 'フォロー目標',
    sound: true,
    volume: 0.3,
  });
  const UNITS = { follows: 'フォロー', likes: 'いいね', diamonds: 'コイン', gifts: 'ギフト', shares: 'シェア', comments: 'コメント', viewers: '人' };
  const unit = UNITS[p.metric] ?? '';

  const $ = (id) => document.getElementById(id);
  $('title').textContent = p.title;
  let goal = Math.max(1, p.goal);
  let current = 0;
  let celebrated = false;
  let raiseTimer = null;

  function render() {
    $('goal').textContent = fmt(goal);
    odometer($('value'), current);
    const ratio = Math.min(1, current / goal);
    $('fill').style.transform = `scaleX(${ratio})`;
    $('pct').textContent = `${Math.floor(ratio * 100)}%`;
    const done = current >= goal;
    $('remain').textContent = done ? '目標を達成しました' : `あと ${fmt(goal - current)} ${unit}`;
    document.body.classList.toggle('done', done);
    if (done && !celebrated) {
      celebrated = true;
      if (p.sound) chime('win', p.volume);
      if (p.step > 0) {
        clearTimeout(raiseTimer);
        raiseTimer = setTimeout(raise, 3500);
      }
    }
  }

  function raise() {
    while (goal <= current) goal += p.step;
    celebrated = false;
    render();
  }

  function update(state) {
    current = (state?.[p.metric] ?? 0) + p.start;
    render();
  }

  // ダッシュボードで「集計をリセット」したとき
  function reset(state) {
    goal = Math.max(1, p.goal);
    celebrated = false;
    clearTimeout(raiseTimer);
    update(state);
  }

  connect({
    // 読み込み直したとき、すでに達成済みなら音は鳴らさない
    hello(_status, state) {
      current = (state?.[p.metric] ?? 0) + p.start;
      if (p.step > 0) while (goal <= current) goal += p.step;
      celebrated = current >= goal;
      render();
    },
    state: reset,
    event: (_e, state) => update(state),
  });
</script>
</body>
</html>
