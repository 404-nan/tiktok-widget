<!-- コメントスライド: 決めたコメントが流れたら、決めた言葉を画面の右端から横にスライドして出す。表示だけの部品。 -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>コメントスライド</title>
<link rel="stylesheet" href="lib/overlay.css">
<link rel="stylesheet" href="/vendor/fonts/zen-kaku-gothic-new/700.css">
<style>
  /* 右寄せ。札が右の外から入り、少し出て、右の外へ帰る */
  body { display: flex; align-items: center; justify-content: flex-end; padding: 14px; overflow: hidden; }
  .slide {
    display: inline-flex; align-items: center;
    max-width: 100%;
    padding: 12px 24px;
    background: var(--surface); color: var(--on-surface);
    font-size: 28px; font-weight: 800; line-height: 1.3;
    border-left: 6px solid var(--band, var(--signal));
    border-radius: 3px var(--r) var(--r) 3px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, .32);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transform: translateX(115%); opacity: 0;
    transition: transform .55s var(--ease-out), opacity .3s linear;
  }
  .slide.in { transform: translateX(0); opacity: 1; }
  .slide.out { transform: translateX(115%); opacity: 0; transition: transform .5s ease-in, opacity .4s linear .12s; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
  import { setupWidget, connect, setSampleRenderer, resolveColor, isFor } from './lib/overlay.js';
  import { slideCombos, slideMatch, createSlideQueue, MAX_QUEUE } from './lib/comment-slide.js';

  // 設定は config.yaml の commentSlide.<id>（?id= がなければ default）
  const p = await setupWidget('commentSlide', { seconds: 4, color: 'accent' });
  const stage = document.getElementById('stage');
  stage.style.setProperty('--band', resolveColor(p.color));
  const combos = slideCombos(p);

  /** 1つを右から入れ、seconds 秒出して、右へ帰して消す */
  async function show(item) {
    const node = document.createElement('div');
    node.className = 'slide';
    node.textContent = item.text;
    stage.replaceChildren(node);
    void node.offsetWidth; // 入る前の位置を確定させてから動かす
    node.classList.add('in');
    await new Promise((r) => setTimeout(r, Math.max(1, p.seconds) * 1000));
    node.classList.add('out');
    await new Promise((r) => setTimeout(r, 600));
    node.remove();
  }

  // 1つずつ順に出す。同時に来た分は待ちに入れ、上限3を超えた分は捨てる
  const queue = createSlideQueue(show, MAX_QUEUE);

  setSampleRenderer((on) => {
    stage.replaceChildren();
    if (on) show({ text: '決めたコメントが来たら、ここに出ます' });
  });

  connect({
    event(e) {
      if (e.kind !== 'chat') return;
      const hit = slideMatch(e.text, combos);
      if (hit) queue.push(hit);
    },
    control(msg) {
      if (!isFor(msg, 'commentSlide') || msg.action !== 'reset') return;
      queue.clear();
      stage.replaceChildren();
    },
  });
</script>
</body>
</html>
