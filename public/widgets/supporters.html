<!-- 最近のサポーターを表示する OBS 用ページ。サーバーの一覧から再開する。 -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>最近のサポーター</title>
<link rel="stylesheet" href="lib/overlay.css">
<link rel="stylesheet" href="/vendor/fonts/zen-kaku-gothic-new/700.css">
<style>
body { padding: 12px; }
.panel { background: var(--surface); color: var(--on-surface); padding: 14px; border-left: 5px solid var(--signal); }
h1 { margin: 0 0 10px; font-size: 18px; }
.card { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 0 8px 10px; border-top: 1px solid var(--rule); border-left: 4px solid transparent; animation: wipe .35s var(--ease-wipe); }
.card:first-of-type { border-left-color: var(--signal); }
.kind { color: var(--on-surface-dim); font-size: 12px; width: 44px; }
.name { flex: 1; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gift { color: var(--on-surface-dim); font-size: 13px; }
.coins { color: var(--gold); font-family: var(--font-num); font-weight: 700; }
@keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
</style>
</head>
<body><section class="panel" id="panel"><h1 id="title"></h1><div id="list"></div></section>
<script src="supporters.js"></script>
<script type="module">
import { setupWidget, connect, fmt } from './lib/overlay.js';
var p = await setupWidget('supporters', { title: '最近のサポーター', events: ['follow', 'gift'], minCoins: 1, limit: 5, avatars: true, lifetime: 0, color: 'accent' });
var items = [];
var title = document.getElementById('title');
var list = document.getElementById('list');
function allowed(item) { return p.events.indexOf(item.kind) >= 0 && (item.kind !== 'gift' || item.coins >= p.minCoins); }
function trim() { var now = Date.now(); items = items.filter(function (item) { return !p.lifetime || now - item.ts <= p.lifetime * 1000; }).filter(allowed).slice(0, p.limit); }
function render() { trim(); document.getElementById('panel').hidden = !p.title && !items.length; title.textContent = p.title; list.innerHTML = ''; items.forEach(function (item) { var row = document.createElement('div'); row.className = 'card'; var avatar = document.createElement('span'); avatar.className = 'avatar'; avatar.style.setProperty('--size', '28px'); avatar.textContent = (item.user.name || '?').slice(0, 1); if (p.avatars && item.user.avatar) { var img = new Image(28, 28); img.alt = ''; img.src = item.user.avatar; avatar.textContent = ''; avatar.appendChild(img); } var kind = item.kind === 'gift' ? 'ギフト' : item.kind === 'follow' ? 'フォロー' : 'シェア'; var name = document.createElement('span'); name.className = 'name'; name.textContent = item.user.name; var detail = document.createElement('span'); detail.className = 'gift'; detail.textContent = item.gift ? item.gift.nameJa || item.gift.name : ''; if (item.gift) detail.textContent += ' ×' + item.gift.count; var coins = document.createElement('span'); coins.className = 'coins'; coins.textContent = item.coins ? fmt(item.coins) + ' コイン' : ''; row.append(avatar, Object.assign(document.createElement('span'), { className: 'kind', textContent: kind }), name, detail, coins); list.appendChild(row); }); }
function add(item) { if (items.some(function (old) { return old.id === item.id; })) return; items.unshift(item); render(); }
fetch('/api/info-feed').then(function (r) { return r.json(); }).then(function (data) { items = data.items || []; render(); }).catch(function () { render(); });
setInterval(render, 1000);
connect({ event: add, state: function (state) { if (!state) return; }, reset: function () { items = []; render(); } });
</script>
</body>
</html>
