<!-- いいね応援ゲージ。配信画面の端に置く560×160の公開ウィジェット。 -->
<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>みんなで応援</title>
<style>
html,body{margin:0;background:transparent;color:#F6F5F1;font-family:Yu Gothic UI,Meiryo,sans-serif}#cheer{position:relative;width:560px;height:160px;background:#111113;overflow:hidden;padding:22px;box-sizing:border-box}.head{display:flex;justify-content:space-between;align-items:baseline}.title{font-size:24px;font-weight:700}.numbers{font-family:Arial Narrow,Arial,sans-serif;font-size:26px}.round{font-size:16px;margin-left:12px;color:#C9C9D1}.track{height:28px;background:#333338;margin-top:28px;overflow:hidden}.fill{height:100%;width:0;background:#FF4F1F;transition:width .35s ease}.fill.near{background:#FFC53D;animation:shake .35s infinite}.note{height:20px;color:#FFC53D;font-size:15px}.full{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#FFC53D;font-size:46px;font-weight:900;letter-spacing:.08em}.is-full .track{background:#070708}.confetti{position:absolute;inset:0;width:560px;height:160px;pointer-events:none}@keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
</style></head><body><main id="cheer"><div class="head"><div id="title" class="title">みんなで応援</div><div><span id="numbers" class="numbers">0 / 500</span><span id="round" class="round">0 周目</span></div></div><div class="track"><div id="fill" class="fill"></div></div><div id="note" class="note"></div><div id="full" class="full"></div><canvas id="confetti" class="confetti" width="560" height="160"></canvas></main><script src="cheer.js"></script></body></html>
