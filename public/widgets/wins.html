<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIN数</title>
<link rel="stylesheet" href="lib/overlay.css">
<style>
  /* WIN 数（ゲームクリア回数）。スコアボードの板に、見出し（WIN）と大きな数字。
     クリアで数字が跳ねて「+1」とハンコ、節目と目標達成は金で祝う。
     ギフトで減ると、ひびが走ってダメージの数字が飛び、送った人のハンコ。連続妨害・マイナス突入・最低記録でさらに派手に */
  body { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .wrap { position: relative; width: 100%; }

  .plate {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    height: 132px;
    background: var(--surface);
    color: var(--on-surface);
    border-radius: var(--r);
    box-shadow: var(--lift);
    overflow: hidden;
  }
  .head {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 40px 0 24px;
    background: var(--signal);
    color: var(--on-signal, #fff);
    clip-path: polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%);
    transition: background-color .3s linear;
  }
  .title { font-family: var(--font-num); font-weight: 800; font-style: italic; font-size: 48px; line-height: .9; letter-spacing: .01em; white-space: nowrap; }

  .main { display: flex; align-items: center; gap: 24px; padding: 0 28px 0 12px; min-width: 0; }
  .count { display: flex; align-items: baseline; gap: 10px; line-height: 1; flex: none; }
  .value.minus { color: #FF4F1F; }
  .value { font-size: 96px; font-weight: 700; transform-origin: 50% 70%; }
  .goal { font-family: var(--font-num); font-weight: 600; font-size: 34px; color: var(--on-surface-dim); white-space: nowrap; }
  .meta { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 0; }
  .meta span { font-size: 16px; font-weight: 700; color: var(--on-surface-dim); white-space: nowrap; }
  .meta b { font-family: var(--font-num); font-weight: 700; font-size: 28px; color: var(--on-surface); margin: 0 .12em; }

  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--rule); }
  .bar i { display: block; height: 100%; width: 100%; background: var(--signal); transform-origin: left; transform: scaleX(0); transition: transform .8s var(--ease-out), background-color .3s linear; }

  /* 目標を達成したら金 */
  .done .head, .done .bar i { background: var(--gold); color: var(--ink); }
  .done .goal { color: var(--gold); }

  /* 光がさっと走る */
  .glint { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .5) 50%, transparent 65%); transform: translateX(-100%); }
  .hit .glint { animation: glint .6s var(--ease-out); }
  @keyframes glint { to { transform: translateX(100%); } }
  .hit .value { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { 0% { transform: scale(1.45); } 100% { transform: none; } }
  .hit .head { animation: flashHead .5s ease-out; }
  @keyframes flashHead { 0% { filter: brightness(1.8); } 100% { filter: none; } }

  .plus {
    position: absolute;
    left: var(--plus-x, 50%);
    top: 0;
    font-family: var(--font-num);
    font-weight: 800;
    font-style: italic;
    font-size: 40px;
    color: var(--gold);
    text-shadow: 0 2px 0 rgba(0, 0, 0, .5);
    opacity: 0;
    pointer-events: none;
  }
  .plus.go { animation: plus 1.1s var(--ease-out); }
  @keyframes plus { 0% { opacity: 0; transform: translateY(20px) scale(.6); } 15% { opacity: 1; transform: translateY(0) scale(1.1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-36px); } }

  /* ハンコ: WIN! / WIN -1 / 10 WIN! / CLEAR */
  .stamp {
    position: absolute;
    left: 50%;
    top: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 22px 8px;
    background: var(--signal);
    color: #fff;
    border: 3px solid currentColor;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .4);
    transform: translate(-50%, -50%) rotate(-6deg) scale(1.6);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  .stamp b { font-family: var(--font-num); font-weight: 800; font-style: italic; font-size: 64px; line-height: .95; letter-spacing: .02em; }
  .stamp small { font-size: 15px; font-weight: 900; }
  .stamp small:empty { display: none; }
  .stamp.lose { background: var(--ink); color: #FF4F1F; }
  .stamp.lose, .stamp.danger { left: 44%; }
  .stamp.gold { background: var(--gold); color: var(--ink); }
  .stamp.go { opacity: 1; transform: translate(-50%, -50%) rotate(-6deg); transition: transform .16s cubic-bezier(.5, 0, .9, .6), opacity .05s linear; }
  .stamp.out { opacity: 0; transform: translate(-50%, -50%) rotate(-6deg) scale(1.08); transition: opacity .3s linear, transform .3s ease-out; }

  /* --- マイナスの演出: 妨害した人が「効いた！」と感じるように --- */
  /* マイナス中: 見出しが危険の縞になって流れ、板の縁が赤く脈打つ */
  .neg .head {
    background: repeating-linear-gradient(-45deg, #FF2A2A 0 14px, #8C0A0A 14px 28px);
    background-size: 40px 40px;
    color: #fff;
    animation: hazard 1s linear infinite;
  }
  .neg .title { text-shadow: 0 2px 0 rgba(0, 0, 0, .6); }
  @keyframes hazard { to { background-position: 40px 0; } }
  .neg .plate { animation: alarm 1.2s ease-in-out infinite; }
  @keyframes alarm { 0%, 100% { box-shadow: var(--lift), inset 0 0 0 2px rgba(255, 42, 42, .25); } 50% { box-shadow: var(--lift), inset 0 0 0 3px rgba(255, 42, 42, .9); } }
  .neg .bar i { background: #FF2A2A; }

  /* 超妨害以上: 板が沈み込む / 壊滅: 一瞬暗転して止まる */
  .slam { animation: slam .5s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes slam { 0% { transform: translateY(14px) rotate(-1.5deg) scale(.97); } 100% { transform: none; } }
  .plate::after { content: ""; position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .25s linear; }
  .plate.blackout::after { opacity: .9; }

  /* 当たった瞬間の赤い閃光 */
  .redflash { position: absolute; inset: 0; background: #FF2A2A; mix-blend-mode: screen; opacity: 0; pointer-events: none; }
  .redflash.go { animation: redflash .45s ease-out; }
  @keyframes redflash { 0% { opacity: .75; } 100% { opacity: 0; } }

  /* ひび: 当たった所から走る */
  .cracks { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .cracks path { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .cracks .shadow { stroke: rgba(0, 0, 0, .7); stroke-width: 5; }
  .cracks .line { stroke: rgba(255, 255, 255, .92); stroke-width: 1.8; }
  .cracks.go path { stroke-dashoffset: 0; transition: stroke-dashoffset .14s ease-out; }
  .cracks.fade { opacity: 0; transition: opacity 1.2s ease-in .6s; }

  /* ダメージの数字: 飛び出して落ちる */
  .dmg {
    position: absolute;
    font-family: var(--font-num);
    font-weight: 800;
    font-style: italic;
    font-size: var(--dmg-size, 72px);
    line-height: 1;
    color: #FF2A2A;
    -webkit-text-stroke: 3px #fff;
    paint-order: stroke fill;
    text-shadow: 0 4px 0 rgba(0, 0, 0, .55);
    pointer-events: none;
    white-space: nowrap;
    animation: dmg 1.3s cubic-bezier(.3, 0, .7, 1) forwards;
  }
  @keyframes dmg {
    0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
    12% { transform: translate(calc(-50% + var(--dx) * .3), calc(-50% - 46px)) scale(1.25) rotate(var(--rot)); opacity: 1; }
    30% { transform: translate(calc(-50% + var(--dx) * .5), calc(-50% - 58px)) scale(1) rotate(var(--rot)); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + 90px)) scale(.9) rotate(calc(var(--rot) * 3)); opacity: 0; }
  }

  /* ハンコ: 送った人のアイコン、連続妨害でだんだん大きく */
  .stamp { --boost: 1; }
  .stamp.go { transform: translate(-50%, -50%) rotate(-6deg) scale(var(--boost)); }
  .stamp .who { display: flex; align-items: center; gap: 6px; }
  .stamp .who:empty { display: none; }
  .stamp .av { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: #333; flex: none; display: grid; place-items: center; font-size: 13px; font-style: normal; color: #fff; overflow: hidden; }
  .stamp .combo { font-family: var(--font-num); font-weight: 800; font-style: italic; font-size: 20px; color: #FFC53D; }
  .stamp .combo:empty { display: none; }
  /* マイナス突入: 黒地に赤、縁は危険の縞 */
  .stamp.danger {
    background: #111113;
    color: #FF2A2A;
    border: 6px solid transparent;
    border-image: repeating-linear-gradient(-45deg, #FFC53D 0 10px, #111113 10px 20px) 6;
  }
  .stamp.jp b { font-family: "Zen Kaku Gothic New", var(--font); font-weight: 900; font-style: normal; font-size: 54px; letter-spacing: .02em; }

  /* big: 画面の端に置く、大きな数字の形 */
  .style-big .plate { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: 320px; }
  .style-big .head { flex-direction: row; align-items: baseline; justify-content: center; gap: 12px; padding: 14px 20px 18px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), 0 100%); }
  .style-big .title { font-size: 52px; }
  .style-big .main { flex-direction: column; justify-content: center; gap: 8px; padding: 0 20px 18px; }
  .style-big .value { font-size: 168px; }
  .style-big .goal { font-size: 44px; }
  .style-big .meta { margin: 0; flex-direction: row; align-items: baseline; gap: 16px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="plate" id="plate">
    <div class="head"><span class="title" id="title"></span></div>
    <div class="main">
      <div class="count"><span class="value num" id="value"></span><span class="goal" id="goal"></span></div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="bar" id="barWrap"><i id="bar"></i></div>
    <div class="glint"></div>
    <div class="redflash" id="redflash"></div>
    <svg class="cracks" id="cracks"></svg>
  </div>
  <div class="plus" id="plus">+1</div>
  <div class="stamp" id="stamp"><b></b><span class="combo"></span><small class="who"></small></div>
</div>
<script type="module">
  import { setupWidget, connect, odometer, fmt, resolveColor, readableOn, sleep } from './lib/overlay.js';

  // 設定は config.yaml の wins.<id>（?id= がなければ default）。数はサーバー（/api/wins）が持つ
  const p = await setupWidget('wins', {
    title: 'WIN', goal: 0, winText: 'WIN!', milestone: 5, style: 'plate', color: 'accent', sound: true, volume: 0.4,
    bigLossText: '大妨害', hugeLossText: '超妨害', ruinLossText: '壊滅', power: 1,
  });
  // 演出の段階（0 通常 / 1 大妨害 / 2 超妨害 / 3 壊滅）はサーバーが決めて送ってくる（event.tier）
  const TIER_TEXT = ['', p.bigLossText, p.hugeLossText, p.ruinLossText];
  const id = new URLSearchParams(location.search).get('id') || 'default';
  const $ = (x) => document.getElementById(x);
  const rnd = (a, b) => a + Math.random() * (b - a);
  document.body.classList.add(`style-${p.style}`);
  document.body.style.setProperty('--signal', resolveColor(p.color));
  document.body.style.setProperty('--on-signal', readableOn(p.color));
  $('title').textContent = p.title;

  function render(c, { roll = true } = {}) {
    const n = c.wins;
    if (roll) odometer($('value'), n);
    $('value').classList.toggle('minus', n < 0);
    document.body.classList.toggle('neg', n < 0);
    $('goal').textContent = p.goal > 0 ? `/ ${fmt(p.goal)}` : '';
    $('barWrap').hidden = !(p.goal > 0);
    $('bar').style.transform = `scaleX(${p.goal > 0 ? Math.max(0, Math.min(1, n / p.goal)) : 0})`;
    const done = p.goal > 0 && n >= p.goal;
    document.body.classList.toggle('done', done);
    const meta = [];
    if (p.goal > 0) meta.push(done ? '<span>目標達成</span>' : `<span>あと<b>${fmt(p.goal - n)}</b></span>`);
    if (c.low < 0) meta.push(`<span>最低<b>${fmt(c.low)}</b></span>`);
    $('meta').innerHTML = meta.join('');
  }

  // --- 効果音（音源なしで合成） ---
  let ac;
  const audio = () => (ac ??= new AudioContext());
  function tones(notes, { type = 'sine', gap = 0.08, len = 0.32, vol = 1, at = 0 } = {}) {
    if (!p.sound) return;
    try {
      const a = audio(), t0 = a.currentTime + at;
      notes.forEach((f, i) => {
        const o = a.createOscillator(), g = a.createGain(), t = t0 + i * gap;
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(p.volume * 0.5 * vol, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(g).connect(a.destination);
        o.start(t);
        o.stop(t + len + 0.05);
      });
    } catch {}
  }
  function noise(seconds, { type = 'lowpass', freq = 1200, vol = 0.5, at = 0 } = {}) {
    if (!p.sound) return;
    try {
      const a = audio(), t = a.currentTime + at;
      const buf = a.createBuffer(1, a.sampleRate * seconds, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
      const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      src.buffer = buf;
      f.type = type;
      f.frequency.value = freq;
      g.gain.value = p.volume * vol;
      src.connect(f).connect(g).connect(a.destination);
      src.start(t);
    } catch {}
  }
  // ドゴン: 低い音が落ちる。強いほど低く長く
  function boom(level, at = 0) {
    if (!p.sound) return;
    try {
      const a = audio(), t = a.currentTime + at;
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150 - level * 8, t);
      o.frequency.exponentialRampToValueAtTime(32, t + 0.35 + level * 0.05);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(p.volume * 1.1, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5 + level * 0.06);
      o.connect(g).connect(a.destination);
      o.start(t);
      o.stop(t + 0.8 + level * 0.06);
    } catch {}
  }
  const SOUND = {
    up: () => tones([784, 1047, 1568], { type: 'triangle' }),
    big: () => {
      tones([523, 659, 784, 1047, 1319, 1568, 2093], { type: 'triangle', gap: 0.06, len: 0.4 });
      tones([1047, 1319, 1568, 2093], { gap: 0, len: 1.2, vol: 0.5, at: 0.42 });
    },
    // 妨害が当たった: ドゴン＋ガラスが割れる音。連続するほど低く重く
    hit(level) {
      boom(level);
      noise(0.35, { type: 'lowpass', freq: 1800, vol: 0.6 });
      noise(0.25, { type: 'highpass', freq: 5200, vol: 0.35, at: 0.03 });
      tones([220 - level * 10, 160 - level * 8], { type: 'sawtooth', gap: 0.12, len: 0.28, vol: 0.35, at: 0.05 });
    },
    // マイナス突入: サイレン → ドゴン
    siren() {
      for (let i = 0; i < 4; i++) tones([880, 660], { type: 'square', gap: 0.16, len: 0.15, vol: 0.28, at: i * 0.32 });
      boom(6, 0.02);
      noise(0.5, { type: 'lowpass', freq: 1400, vol: 0.7 });
    },
  };

  // --- 演出 ---
  const restart = (el, cls) => {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  };

  let stampTimer = null;
  function stamp(text, cls, { who = null, line = '', combo = '', boost = 1, hold = 1600 } = {}) {
    const el = $('stamp');
    el.className = `stamp ${cls}${/[^\x00-\x7F]/.test(text) ? ' jp' : ''}`;
    el.style.setProperty('--boost', String(boost));
    el.querySelector('b').textContent = text;
    el.querySelector('.combo').textContent = combo;
    // 送った人のアイコンと名前（妨害した人が主役）
    const sub = el.querySelector('.who');
    sub.replaceChildren();
    if (who?.user) {
      const av = who.user.avatar ? Object.assign(new Image(), { src: who.user.avatar, referrerPolicy: 'no-referrer', className: 'av', alt: '' }) : Object.assign(document.createElement('i'), { className: 'av', textContent: (who.user.name ?? '?').slice(0, 1) });
      sub.append(av);
    }
    if (line) sub.append(line);
    void el.offsetWidth;
    el.classList.add('go');
    clearTimeout(stampTimer);
    stampTimer = setTimeout(() => {
      el.classList.add('out');
      el.classList.remove('go');
    }, hold);
  }

  function valueCenter() {
    const v = $('value').getBoundingClientRect();
    const w = $('wrap').getBoundingClientRect();
    return { x: v.left - w.left + v.width / 2, y: v.top - w.top + v.height / 2, v, w };
  }

  function pop(text) {
    const { v, w } = valueCenter();
    const el = $('plus');
    el.textContent = text;
    el.style.setProperty('--plus-x', `${v.right - w.left + 4}px`);
    el.style.top = `${v.top - w.top - 10}px`;
    restart(el, 'go');
  }

  // ダメージの数字（減った分）。大きく減るほど大きい。ハンコと重ならないよう板の右端から飛ぶ
  function damage(delta, tier = 0) {
    const plate = $('plate').getBoundingClientRect();
    const w = $('wrap').getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'dmg';
    el.textContent = `${delta}`;
    el.style.left = `${plate.right - w.left - rnd(40, 70)}px`;
    el.style.top = `${plate.top - w.top + plate.height * 0.42}px`;
    el.style.setProperty('--dmg-size', `${Math.min(150, (60 + tier * 16 + Math.min(8, Math.abs(delta)) * 4) * p.power)}px`);
    el.style.setProperty('--dx', `${rnd(-30, 20)}px`);
    el.style.setProperty('--rot', `${rnd(-8, 12)}deg`);
    $('wrap').append(el);
    setTimeout(() => el.remove(), 1400);
  }

  // ひび: 数字のあたりから、強さに応じた本数が走る
  function cracks(level) {
    const svg = $('cracks');
    const plate = $('plate').getBoundingClientRect();
    const v = $('value').getBoundingClientRect();
    const ox = v.left - plate.left + v.width * 0.5, oy = v.top - plate.top + v.height * 0.55;
    const ns = 'http://www.w3.org/2000/svg';
    svg.replaceChildren();
    svg.classList.remove('go', 'fade');
    const branches = Math.min(26, 5 + level * 2);
    for (let i = 0; i < branches; i++) {
      let a = (i / branches) * Math.PI * 2 + rnd(-0.3, 0.3);
      let x = ox, y = oy;
      let d = `M ${x.toFixed(1)} ${y.toFixed(1)}`;
      const steps = 3 + Math.floor(rnd(0, 3 + level));
      for (let k = 0; k < steps; k++) {
        a += rnd(-0.6, 0.6);
        const len = rnd(14, 34) + level * 4;
        x += Math.cos(a) * len;
        y += Math.sin(a) * len * 0.7;
        d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
      }
      for (const cls of ['shadow', 'line']) {
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', d);
        path.setAttribute('class', cls);
        path.setAttribute('pathLength', '1');
        svg.append(path);
      }
    }
    void svg.getBoundingClientRect();
    svg.classList.add('go');
    requestAnimationFrame(() => svg.classList.add('fade'));
  }

  // 揺れ: 強さと長さを指定できる
  async function shake(amp, seconds) {
    const el = $('wrap');
    const end = performance.now() + seconds * 1000;
    while (performance.now() < end) {
      const k = (end - performance.now()) / (seconds * 1000);
      el.style.transform = `translate(${rnd(-amp, amp) * k}px, ${rnd(-amp, amp) * 0.5 * k}px) rotate(${rnd(-1, 1) * k}deg)`;
      await sleep(28);
    }
    el.style.transform = '';
  }

  // 大きく減ったとき: 数字がドゥルルルと一気に減っていく（はじめゆっくり、だんだん速く）
  async function drain(from, to, seconds) {
    const el = $('value');
    delete el.dataset.text;
    el.replaceChildren();
    el.classList.toggle('minus', from < 0);
    const start = performance.now();
    let shown = from;
    let lastTick = 0;
    await new Promise((done) => {
      const step = (now) => {
        const t = Math.min(1, (now - start) / (seconds * 1000));
        const v = Math.round(from + (to - from) * t * t);
        if (v !== shown) {
          shown = v;
          el.textContent = fmt(v);
          el.classList.toggle('minus', v < 0);
          if (now - lastTick > 38) {
            lastTick = now;
            tones([1400 - 1000 * t], { type: 'square', len: 0.03, vol: 0.18 });
          }
        }
        if (t < 1) requestAnimationFrame(step);
        else done();
      };
      requestAnimationFrame(step);
    });
    delete el.dataset.text;
    odometer(el, to);
  }

  const signed = (n) => (n > 0 ? `+${n}` : `${n}`);


  async function onChange({ counter: c, prev, event }) {
    const { kind, delta, by } = event ?? {};
    const n = c.wins;
    const giftLine = by ? `${by.gift}${by.count > 1 ? ` ×${by.count}` : ''} by ${by.user?.name ?? ''}` : '';
    // 1つ戻す・手で数を入れ直す・リセットは、静かに数字だけ変える
    const quiet = kind === 'undo' || (!by && (kind === 'set' || kind === 'reset'));
    if (!delta || quiet) return render(c);

    if (delta > 0) {
      render(c);
      restart($('plate'), 'hit');
      pop(signed(delta));
      const reached = p.goal > 0 && n >= p.goal && prev.wins < p.goal;
      // マイナスから 0 に戻ったときは祝わない
      const mile = p.milestone > 0 && n > 0 && Math.floor(n / p.milestone) > Math.floor(Math.max(0, prev.wins) / p.milestone);
      const escaped = prev.wins < 0 && n >= 0;
      if (reached) {
        stamp('CLEAR', 'gold', { line: `目標 ${fmt(p.goal)} WIN 達成` });
        SOUND.big();
      } else if (escaped) {
        stamp('マイナス脱出!', 'gold', { who: by, line: [by?.text, giftLine].filter(Boolean).join('　') });
        SOUND.big();
      } else if (mile) {
        stamp(`${fmt(Math.floor(n / p.milestone) * p.milestone)} WIN!`, 'gold', { who: by, line: giftLine });
        SOUND.big();
      } else {
        stamp(by ? `WIN ${signed(delta)}` : p.winText, by ? 'gold' : '', { who: by, line: [by?.text, giftLine].filter(Boolean).join('　') });
        SOUND.up();
      }
      return;
    }

    // --- 減った: ここがいちばん気持ちよく ---
    // 連続妨害の数と段階はサーバーが決める（減り方と連続妨害の多いほう。境目は設定の lossPreset）
    const combo = event.combo ?? 1;
    const tier = event.tier ?? 0;
    const entered = prev.wins >= 0 && n < 0; // マイナス突入
    const record = n < 0 && c.low < prev.low && !entered; // 最低記録更新
    const level = Math.round(Math.min(16, Math.min(8, Math.abs(delta)) + combo - 1 + tier * 3) * Math.min(1.6, p.power));
    const line = [by?.text, giftLine, record ? '最低記録更新' : ''].filter(Boolean).join('　');
    const label = [TIER_TEXT[tier], combo >= 2 ? `連続妨害 ×${combo}` : ''].filter(Boolean).join('　');
    const boost = Math.min(1.6, 1 + (combo - 1) * 0.08 + Math.min(10, Math.abs(delta)) * 0.02 + tier * 0.1);

    // 壊滅: 一瞬止まって暗くなってから叩きつける
    if (tier >= 3) {
      render(c, { roll: false });
      $('plate').classList.add('blackout');
      await sleep(900);
      $('plate').classList.remove('blackout');
    }
    restart($('redflash'), 'go');
    cracks(level);
    damage(delta, tier);
    if (tier >= 2) restart($('plate'), 'slam');
    const text = kind === 'set' || kind === 'reset' ? `WIN ${fmt(n)}` : `WIN ${signed(delta)}`;
    // 大きく減ったときは、ハンコを早めにどかして数字が減っていくところを見せる
    const hold = tier >= 1 && Math.abs(delta) >= 5 ? 1100 : 1600;
    if (entered && tier === 0) {
      stamp('マイナス突入', 'danger', { who: by, line, combo: label, boost: Math.max(boost, 1.1), hold: 2200 });
      SOUND.siren();
      shake((16 + level * 2) * p.power, 0.9);
    } else {
      stamp(entered ? 'マイナス突入' : text, tier >= 2 || entered ? 'danger' : 'lose', { who: by, line: entered ? [text, line].filter(Boolean).join('　') : line, combo: label, boost, hold });
      if (entered || tier >= 2) SOUND.siren();
      SOUND.hit(Math.min(8, level));
      shake((8 + level * 2) * p.power, 0.45 + tier * 0.35 + level * 0.03);
    }
    // ハンコとひびを見せてから数字を落とす。大きく減ったときはドゥルルルと減っていく
    render(c, { roll: false });
    await sleep(tier >= 1 && Math.abs(delta) >= 5 ? 1300 : entered ? 700 : 450);
    // ドゥルルルと減っていくのは、ある程度まとめて減ったときだけ
    if (tier >= 1 && Math.abs(delta) >= 5) await drain(prev.wins, n, [0, 1, 1.8, 2.6][tier]);
    render(c);
  }

  async function sync() {
    try {
      const all = await (await fetch('/api/wins')).json();
      render(all[id] ?? { wins: 0, low: 0 });
    } catch {}
  }

  await sync();
  connect({
    hello: sync,
    wins(msg) {
      if (msg.id === id) onChange(msg);
    },
  });
</script>
</body>
</html>
