<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボス討伐</title>
<link rel="stylesheet" href="lib/overlay.css">
<link rel="stylesheet" href="/vendor/fonts/dela-gothic-one/400.css">
<style>
  /* ボス討伐 HP バー。スコアボードの板に、ボスの顔・名前・HP。
     ダメージで HP が削れ、白い残像がゆっくり追いかける（格闘ゲームの体力ゲージ）。数字が飛び、ボスが揺れ、大ダメージは板ごと揺れる。
     HP 0 で一瞬止まってから「討伐!」を叩きつけ、金の光と、とどめを刺した人のアイコン。少し待つと次のボスが出てくる */
  body { display: flex; align-items: flex-end; padding: 24px; }
  .wrap { position: relative; width: 100%; }

  .plate {
    position: relative;
    display: grid;
    grid-template-columns: 176px minmax(0, 1fr);
    min-height: 156px;
    height: auto;
    background: var(--surface);
    color: var(--on-surface);
    border-radius: var(--r);
    box-shadow: var(--lift);
    overflow: hidden;
  }

  /* --- ボスの顔 --- */
  .face {
    position: relative;
    background: var(--ink-2);
    clip-path: polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%);
    overflow: hidden;
  }
  .face .art { position: absolute; inset: 0; transform-origin: 50% 80%; }
  .face img, .face svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .face svg { padding: 8px 18px 0 4px; }
  .face img.king { object-fit: cover; object-position: 50% 15%; transform: scale(1.08); }
  .pflash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .pflash.go { animation: pflash .22s steps(2) 1; }
  @keyframes pflash { 0% { opacity: .9; } 100% { opacity: 0; } }
  .hurt .art { animation: hurt .34s linear; }
  @keyframes hurt {
    0% { transform: translate(0, 0); filter: brightness(2.2); }
    15% { transform: translate(-7px, 2px) rotate(-2deg); filter: none; }
    30% { transform: translate(6px, -2px) rotate(1.5deg); }
    45% { transform: translate(-4px, 1px); }
    60% { transform: translate(3px, 0) rotate(.5deg); }
    80% { transform: translate(-1px, 0); }
    100% { transform: none; }
  }
  /* 斬撃: 顔を斜めに横切る白い線 */
  .slash { position: absolute; left: -10%; top: 50%; width: 120%; height: 6px; background: #fff; transform: rotate(-28deg) scaleX(0); transform-origin: 0 50%; opacity: 0; pointer-events: none; }
  .slash.b { transform: rotate(24deg) scaleX(0); transform-origin: 100% 50%; }
  .slash.go { animation: slash .3s cubic-bezier(.2, .9, .3, 1) forwards; }
  .slash.b.go { animation-name: slashB; }
  @keyframes slash { 0% { opacity: 1; transform: rotate(-28deg) scaleX(0); } 45% { opacity: 1; transform: rotate(-28deg) scaleX(1); } 100% { opacity: 0; transform: rotate(-28deg) scaleX(1); height: 1px; } }
  @keyframes slashB { 0% { opacity: 1; transform: rotate(24deg) scaleX(0); } 45% { opacity: 1; transform: rotate(24deg) scaleX(1); } 100% { opacity: 0; transform: rotate(24deg) scaleX(1); height: 1px; } }
  /* 倒れたボス: 色が抜けて傾き、小さな「討伐」の判 */
  .defeated .art { filter: grayscale(1) brightness(.45); transform: translateY(10px) rotate(-6deg); transition: filter .6s linear, transform .8s cubic-bezier(.5, 0, .7, .4); }
  .seal {
    position: absolute;
    right: 26px;
    bottom: 12px;
    padding: 2px 8px 4px;
    border: 3px solid var(--gold);
    color: var(--gold);
    font-family: "Dela Gothic One", var(--font);
    font-size: 20px;
    line-height: 1;
    transform: rotate(-12deg) scale(1.8);
    opacity: 0;
    pointer-events: none;
  }
  .defeated .seal { opacity: 1; transform: rotate(-12deg); transition: opacity .1s linear .2s, transform .18s cubic-bezier(.5, 0, .9, .6) .2s; }

  /* --- 名前・HP --- */
  .main { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 26px 0 14px; min-width: 0; }
  .top { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .round {
    flex: none;
    padding: 3px 10px 4px;
    background: var(--signal);
    color: var(--on-signal, #fff);
    font-weight: 900;
    font-size: 15px;
    line-height: 1.2;
    white-space: nowrap;
  }
  .round b { font-family: var(--font-num); font-weight: 700; font-size: 20px; margin-right: 1px; }
  .name { flex: 1; min-width: 0; font-size: 30px; font-weight: 900; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em; }
  .hitter { flex: none; display: flex; align-items: center; gap: 8px; max-width: 170px; opacity: 0; transition: opacity .3s linear; }
  .hitter.on { opacity: 1; }
  .hitter .who { font-size: 14px; font-weight: 700; color: var(--on-surface-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hitter.pop .avatar { animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { 0% { transform: scale(1.5); } 100% { transform: none; } }
  .hitter .avatar { box-shadow: 0 0 0 2px var(--signal); }

  /* HP バー: 黒い溝に、白い残像と朱の HP。斜めに切った形 */
  .gauge { position: relative; height: 34px; background: #000; clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
  .gauge i { position: absolute; inset: 0; transform-origin: left; }
  .lag { background: var(--paper); transition: transform .9s cubic-bezier(.4, 0, .2, 1); }
  .fill { background: var(--signal); transition: transform .12s linear, background-color .2s linear; }
  .fill::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: rgba(255, 255, 255, .28); }
  .ticks { position: absolute; inset: 0; display: flex; justify-content: space-evenly; pointer-events: none; }
  .ticks b { width: 2px; background: rgba(0, 0, 0, .55); }
  .nums { display: flex; align-items: baseline; gap: 8px; line-height: 1; }
  .nums .hp { font-size: 38px; font-weight: 700; }
  .nums .max { font-family: var(--font-num); font-weight: 600; font-size: 22px; color: var(--on-surface-dim); }
  .nums .label { font-family: var(--font-num); font-weight: 700; font-style: italic; font-size: 20px; color: var(--signal); margin-right: 2px; }
  .gap { margin: 0; font-size: 14px; font-weight: 700; color: var(--on-surface-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gap[hidden] { display: none; }

  /* 残りが少ない: HP が赤く点滅（1秒に2回）、数字も赤 */
  .low .fill { animation: low .5s steps(1) infinite; }
  @keyframes low { 0% { background: #FF2A2A; } 50% { background: #7A0A0A; } }
  .low .nums .hp { color: #FF2A2A; }
  .low .nums .label { color: #FF2A2A; }

  /* 討伐の後: 次のボスまでの残り時間（金の細い線） */
  .countdown { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: transparent; }
  .countdown i { display: block; height: 100%; background: var(--gold); transform-origin: left; transform: scaleX(0); }
  .defeated .round { background: var(--gold); color: var(--ink); }
  .defeated .nums .hp { color: var(--on-surface-dim); }

  /* --- 演出 --- */
  .redflash { position: absolute; inset: 0; background: #FF2A2A; mix-blend-mode: screen; opacity: 0; pointer-events: none; }
  .redflash.go { animation: flash .4s ease-out; }
  .greenflash { position: absolute; inset: 0; background: #1FAE5B; opacity: 0; pointer-events: none; }
  .greenflash.go { animation: greenflash .5s ease-out; }
  @keyframes greenflash { 0% { opacity: .42; } 100% { opacity: 0; } }
  .goldflash { position: absolute; inset: 0; background: #FFD84A; mix-blend-mode: screen; opacity: 0; pointer-events: none; }
  .goldflash.go { animation: flash .7s ease-out; }
  .healword {
    position: absolute;
    right: 12px;
    top: 10px;
    z-index: 2;
    padding: 6px 14px;
    border-radius: 999px;
    background: #138A47;
    color: #fff;
    font-weight: 900;
    font-size: 20px;
    line-height: 1;
    box-shadow: 0 2px 0 #0B5A2D;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
  }
  .healword.go { animation: healword .9s cubic-bezier(.2, .9, .3, 1) forwards; }
  @keyframes healword {
    0% { opacity: 0; transform: translateY(8px) scale(1.2); }
    18% { opacity: 1; transform: translateY(0) scale(1); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-6px) scale(1); }
  }
  @keyframes flash { 0% { opacity: .8; } 100% { opacity: 0; } }
  /* 溜め: 板が暗くなって止まる */
  .plate::after { content: ""; position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .18s linear; }
  .plate.blackout::after { opacity: .82; }

  /* ダメージの数字: 顔のあたりから飛び出して落ちる */
  .dmg {
    position: absolute;
    font-family: var(--font-num);
    font-weight: 800;
    font-style: italic;
    font-size: var(--size, 40px);
    line-height: 1;
    color: #fff;
    -webkit-text-stroke: 3px #111113;
    paint-order: stroke fill;
    text-shadow: 0 3px 0 rgba(0, 0, 0, .5);
    pointer-events: none;
    white-space: nowrap;
    animation: dmg 1.1s cubic-bezier(.3, 0, .7, 1) forwards;
  }
  .dmg.t1 { color: #FF4F1F; -webkit-text-stroke: 4px #fff; }
  .dmg.t2 { color: #FFC53D; -webkit-text-stroke: 5px #111113; }
  .dmg.over { color: #FFC53D; -webkit-text-stroke: 3px #111113; opacity: .9; }
  .dmg.heal { color: #5CF59A; -webkit-text-stroke: 3px #0B3D20; }
  @keyframes dmg {
    0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
    12% { transform: translate(calc(-50% + var(--dx) * .3), calc(-50% - 40px)) scale(1.25) rotate(var(--rot)); opacity: 1; }
    35% { transform: translate(calc(-50% + var(--dx) * .5), calc(-50% - 50px)) scale(1) rotate(var(--rot)); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + 30px)) scale(.9) rotate(var(--rot)); opacity: 0; }
  }

  /* 討伐!: 叩きつける文字と、とどめを刺した人 */
  .ko { position: absolute; left: 54%; top: 50%; width: 0; height: 0; pointer-events: none; }
  .word {
    position: absolute;
    left: 0;
    top: 0;
    font-family: "Dela Gothic One", var(--font);
    font-size: 84px;
    line-height: 1;
    white-space: nowrap;
    transform: translate(-50%, -62%) rotate(-6deg) scale(2.6);
    opacity: 0;
  }
  .word span { display: block; }
  .word .back { color: #111113; -webkit-text-stroke: 16px #111113; text-shadow: 4px 7px 0 #111113, 8px 13px 0 rgba(0, 0, 0, .55); }
  .word .mid { position: absolute; inset: 0; color: #fff; -webkit-text-stroke: 6px #fff; }
  .word .front { position: absolute; inset: 0; color: #FFC53D; }
  .word.go { opacity: 1; transform: translate(-50%, -62%) rotate(-6deg); transition: transform .14s cubic-bezier(.5, 0, .9, .6), opacity .04s linear; }
  .word.out { opacity: 0; transform: translate(-50%, -62%) rotate(-6deg) scale(1.06); transition: opacity .35s linear, transform .35s ease-out; }
  .finisher {
    position: absolute;
    left: 0;
    top: 34px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 18px 6px 8px;
    background: #111113;
    border-left: 6px solid var(--gold);
    color: #F6F5F1;
    font-weight: 900;
    font-size: 17px;
    white-space: nowrap;
    transform: translateX(-50%) rotate(-6deg);
    clip-path: inset(0 100% 0 0);
  }
  .finisher small { font-size: 13px; color: var(--gold); letter-spacing: .1em; }
  .finisher .avatar { box-shadow: 0 0 0 2px var(--gold); }
  .finisher.go { clip-path: inset(0 0 0 0); transition: clip-path .32s var(--ease-wipe) .18s; }
  .finisher.out { clip-path: inset(0 0 0 100%); transition: clip-path .3s var(--ease-wipe); }

  /* 金のかけら: 討伐の瞬間に飛び散る */
  .spark {
    position: absolute;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    background: #FFC53D;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    pointer-events: none;
    animation: spark 1.1s cubic-bezier(.2, .8, .3, 1) forwards;
  }
  .spark.w { background: #fff; }
  @keyframes spark { 0% { transform: translate(0, 0) scale(0); opacity: 1; } 30% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(var(--s)) rotate(200deg); opacity: 0; } }

  /* 次のボスが出てくる: 顔が右からワイプで入り、何体目かが叩きつけられる */
  .enter .face .art { animation: enter .6s var(--ease-out); }
  @keyframes enter { 0% { clip-path: inset(0 0 0 100%); transform: translateX(30px) scale(1.15); filter: brightness(3); } 60% { filter: brightness(1.4); } 100% { clip-path: inset(0 0 0 0); transform: none; filter: none; } }
  .enter .round { animation: slam .45s cubic-bezier(.2, 1.6, .4, 1); }
  .enter .name { animation: rise .5s var(--ease-out); }
  @keyframes slam { 0% { transform: scale(2.2) rotate(-6deg); } 100% { transform: none; } }
  @keyframes rise { 0% { transform: translateY(100%); opacity: 0; clip-path: inset(0 0 100% 0); } 100% { transform: none; opacity: 1; clip-path: inset(0 0 0 0); } }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="plate" id="plate">
    <div class="face" id="face">
      <div class="art" id="art"></div>
      <i class="slash" id="slashA"></i><i class="slash b" id="slashB"></i>
      <div class="pflash" id="pflash"></div>
      <div class="seal">討伐</div>
    </div>
    <div class="main">
      <div class="top">
        <span class="round" id="round"></span>
        <span class="name" id="name"></span>
        <span class="hitter" id="hitter"></span>
      </div>
      <div class="gauge"><i class="lag" id="lag"></i><i class="fill" id="fill"></i><span class="ticks"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></span></div>
      <div class="nums"><span class="label" id="hpLabel">HP</span><span class="hp num" id="hp"></span><span class="max" id="max"></span></div>
      <p class="gap" id="gap" hidden></p>
    </div>
    <div class="countdown"><i id="countdown"></i></div>
    <div class="redflash" id="redflash"></div>
    <div class="greenflash" id="greenflash"></div>
    <div class="goldflash" id="goldflash"></div>
  </div>
  <div class="healword" id="healword">回復した！</div>
  <div class="ko">
    <div class="word" id="word"><span class="back"></span><span class="mid"></span><span class="front"></span></div>
    <div class="finisher" id="finisher"></div>
  </div>
</div>
<script type="module">
  import { setupWidget, connect, odometer, fmt, resolveColor, readableOn, mediaUrl, avatarNode, sleep } from './lib/overlay.js';

  // 設定は config.yaml の bosses.<id>（?id= がなければ default）。HP はサーバー（/api/boss）が持つ
  const p = await setupWidget('bosses', {
    name: '魔王', image: '', defeatText: '討伐!', lowHp: 20, power: 1, color: 'accent', sound: true, volume: 0.4,
  });
  let id = window.__twWidgetId || 'default';
  const $ = (x) => document.getElementById(x);
  const rnd = (a, b) => a + Math.random() * (b - a);
  document.body.style.setProperty('--signal', resolveColor(p.color));
  document.body.style.setProperty('--on-signal', readableOn(p.color));
  for (const el of $('word').children) el.textContent = p.defeatText;
  window.addEventListener('tw-config-change', async (event) => {
    if (event.detail.section !== 'bosses' || window.__twWidgetQueryId != null) return;
    id = event.detail.id;
    Object.assign(p, event.detail.config?.bosses?.[id] ?? {});
    for (const el of $('word').children) el.textContent = p.defeatText;
    const all = await (await fetch('/api/boss')).json();
    if (all[id]) onBoss({ boss: all[id], event: { kind: 'config' } });
  });

  // --- ボスの顔: 画像があれば画像、なければ日輪を背負った鬼の面。何体目かで 白鬼 → 赤鬼 → 黒鬼 と変わる ---
  const ONI_COLORS = [
    { sun: 'var(--signal)', face: '#F6F5F1', horn: '#F6F5F1', line: '#111113', eye: 'var(--signal)' },
    { sun: '#F6F5F1', face: 'var(--signal)', horn: '#F6F5F1', line: '#111113', eye: '#FFC53D' },
    { sun: 'var(--signal)', face: '#111113', horn: '#FFC53D', line: '#F6F5F1', eye: 'var(--signal)' },
  ];
  const oni = (round) => {
    const c = ONI_COLORS[(Math.max(1, round) - 1) % ONI_COLORS.length];
    return `<svg viewBox="0 0 160 160" aria-hidden="true">
    <circle cx="80" cy="86" r="60" fill="${c.sun}"/>
    <g stroke="#111113" stroke-width="3.5" stroke-linejoin="round">
      <path d="M54 64 C46 46 40 30 28 14 C50 22 62 38 68 56 Z" fill="${c.horn}"/>
      <path d="M106 64 C114 46 120 30 132 14 C110 22 98 38 92 56 Z" fill="${c.horn}"/>
      <path d="M44 74 C44 52 60 44 80 44 C100 44 116 52 116 74 L116 100 C116 126 98 144 80 144 C62 144 44 126 44 100 Z" fill="${c.face}"/>
    </g>
    <path d="M50 76 L76 88 L75 95 L50 84 Z M110 76 L84 88 L85 95 L110 84 Z" fill="${c.line}"/>
    <path d="M55 91 L74 99 L69 107 L57 103 Z M105 91 L86 99 L91 107 L103 103 Z" fill="${c.eye}" stroke="${c.line}" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M75 110 L80 115 L85 110" fill="none" stroke="${c.line}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M56 120 C68 128 92 128 104 120 L100 133 C90 139 70 139 60 133 Z" fill="${c.line === '#111113' ? '#111113' : '#000'}" stroke="${c.line}" stroke-width="2"/>
    <path d="M63 134 L67 121 L72 133 Z M88 133 L93 121 L97 134 Z" fill="#F6F5F1"/>
  </svg>`;
  };
  let faceRound = 0;
  function drawFace(round = 1) {
    const art = $('art');
    faceRound = round;
    if (p.image) {
      const img = new Image();
      img.alt = '';
      img.referrerPolicy = 'no-referrer';
      img.src = mediaUrl(p.image);
      img.onerror = () => (art.innerHTML = oni(round));
      art.replaceChildren(img);
    } else {
      // 冥王のアイコン（透過PNG・Codex で生成）。1体目 青 → 2体目 赤 → 3体目 金。読めなければ鬼の面
      const img = new Image();
      img.alt = '';
      img.className = 'king';
      img.src = `img/boss-${((Math.max(1, round) - 1) % 3) + 1}.png`;
      img.onerror = () => (art.innerHTML = oni(round));
      art.replaceChildren(img);
    }
  }

  // --- 表示 ---
  let shown = null; // 今出しているボスの状態
  let charging = false; // 次のボスの HP が満ちていく間（赤い点滅を出さない）
  let lagTimer = null;
  function setBar(hp, max, { instant = false } = {}) {
    const r = Math.max(0, Math.min(1, hp / max));
    const fill = $('fill'), lag = $('lag');
    if (instant) {
      for (const el of [fill, lag]) el.style.transition = 'none';
      fill.style.transform = lag.style.transform = `scaleX(${r})`;
      void fill.offsetWidth;
      for (const el of [fill, lag]) el.style.transition = '';
      return;
    }
    fill.style.transform = `scaleX(${r})`;
    // 白い残像: 少し待ってから、ゆっくり追いかける（回復のときはすぐ）
    clearTimeout(lagTimer);
    const cur = Number(lag.dataset.r ?? 1);
    if (r >= cur) lag.style.transform = `scaleX(${r})`;
    else lagTimer = setTimeout(() => (lag.style.transform = `scaleX(${r})`), 480);
    lag.dataset.r = String(r);
  }

  function render(b, { instant = false, roll = true } = {}) {
    shown = b;
    if (b.round !== faceRound) drawFace(b.round);
    $('round').innerHTML = `<b>${b.round}</b>体目`;
    $('name').textContent = b.name || p.name;
    const gapMode = b.mode === 'rank-gap';
    const waiting = gapMode && !(Number(b.rivalCoins) > 0);
    $('hpLabel').textContent = waiting ? '未開始' : gapMode ? '差' : 'HP';
    if (roll) odometer($('hp'), waiting ? 0 : b.hp);
    $('max').textContent = waiting ? '' : `/ ${fmt(b.maxHp)}`;
    const gap = $('gap');
    if (!gapMode) {
      gap.hidden = true;
      gap.textContent = '';
    } else if (waiting) {
      gap.hidden = false;
      gap.textContent = '相手のコインが未設定です';
    } else {
      gap.hidden = false;
      const who = b.rivalName ? `上の人 ${b.rivalName}` : '上の人';
      gap.textContent = `${who} ${fmt(b.rivalCoins)}コイン ・ 自分 ${fmt(b.ourCoins)}コイン`;
    }
    setBar(waiting ? 0 : b.hp, Math.max(1, waiting ? 1 : b.maxHp), { instant: instant || waiting });
    const low = !waiting && !charging && !b.defeated && p.lowHp > 0 && b.maxHp > 0 && b.hp / b.maxHp <= p.lowHp / 100;
    document.body.classList.toggle('low', low);
    document.body.classList.toggle('defeated', !waiting && Boolean(b.defeated));
    countdown(b);
  }

  // 最後に一撃を入れた人
  function showHitter(user, { bump = true } = {}) {
    const el = $('hitter');
    if (!user) return;
    el.replaceChildren(avatarNode(user, 40), Object.assign(document.createElement('span'), { className: 'who', textContent: user.name ?? '' }));
    el.classList.add('on');
    if (bump) restart(el, 'pop');
  }

  // 次のボスまでの残り時間
  let cdFrame = 0;
  function countdown(b) {
    cancelAnimationFrame(cdFrame);
    const bar = $('countdown');
    if (!b.defeated || !b.nextAt) {
      bar.style.transform = 'scaleX(0)';
      return;
    }
    const offset = Date.now() - (b.now ?? Date.now());
    const end = b.nextAt + offset;
    const span = Math.max(1000, end - (b.defeatedAt ? b.defeatedAt + offset : Date.now()));
    const step = () => {
      const left = Math.max(0, end - Date.now());
      bar.style.transform = `scaleX(${left / span})`;
      if (left > 0) cdFrame = requestAnimationFrame(step);
    };
    step();
  }

  // --- 効果音（音源なしで合成） ---
  let ac;
  const audio = () => (ac ??= new AudioContext());
  let lastSound = 0;
  function tones(notes, { type = 'sine', gap = 0.08, len = 0.32, vol = 1, at = 0 } = {}) {
    if (!p.sound) return;
    try {
      const a = audio(), t0 = a.currentTime + at;
      notes.forEach((f, i) => {
        const o = a.createOscillator(), g = a.createGain(), t = t0 + i * gap;
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(p.volume * 0.5 * vol, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + len);
        o.connect(g).connect(a.destination);
        o.start(t);
        o.stop(t + len + 0.05);
      });
    } catch {}
  }
  function noise(seconds, { type = 'lowpass', freq = 1200, vol = 0.5, at = 0 } = {}) {
    if (!p.sound) return;
    try {
      const a = audio(), t = a.currentTime + at;
      const buf = a.createBuffer(1, Math.ceil(a.sampleRate * seconds), a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
      const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      src.buffer = buf;
      f.type = type;
      f.frequency.value = freq;
      g.gain.value = p.volume * vol;
      src.connect(f).connect(g).connect(a.destination);
      src.start(t);
    } catch {}
  }
  // 低い音が落ちる（ドン・ドゴン）。強いほど低く長く
  function boom(level, at = 0) {
    if (!p.sound) return;
    try {
      const a = audio(), t = a.currentTime + at;
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(170 - level * 12, t);
      o.frequency.exponentialRampToValueAtTime(34, t + 0.18 + level * 0.12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(p.volume * (0.6 + level * 0.25), t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25 + level * 0.18);
      o.connect(g).connect(a.destination);
      o.start(t);
      o.stop(t + 0.6 + level * 0.2);
    } catch {}
  }
  // ためる音: 下から上へ駆け上がる（次のボスの HP が満ちる）
  function charge(seconds) {
    if (!p.sound) return;
    try {
      const a = audio(), t = a.currentTime;
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(110, t);
      o.frequency.exponentialRampToValueAtTime(880, t + seconds);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(p.volume * 0.12, t + 0.1);
      g.gain.setValueAtTime(p.volume * 0.12, t + seconds - 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + seconds);
      o.connect(g).connect(a.destination);
      o.start(t);
      o.stop(t + seconds + 0.05);
    } catch {}
  }
  const SOUND = {
    // 斬: 短いノイズと低い音。いいねで連打されても耳が痛くないよう、間をあける
    hit(tier) {
      const now = performance.now();
      if (tier === 0 && now - lastSound < 70) return;
      lastSound = now;
      noise(0.07 + tier * 0.05, { type: 'highpass', freq: 2600 - tier * 600, vol: 0.35 + tier * 0.15 });
      boom(tier);
      if (tier >= 2) noise(0.4, { type: 'lowpass', freq: 900, vol: 0.8, at: 0.02 });
    },
    // ピンチ: 残りが少なくなった
    pinch() {
      tones([988, 740, 988, 740], { type: 'square', gap: 0.12, len: 0.1, vol: 0.25 });
    },
    // 討伐: ドン → ファンファーレ
    defeat() {
      boom(4);
      noise(0.6, { type: 'lowpass', freq: 1500, vol: 0.9 });
      tones([523, 659, 784, 1047, 1319, 1568, 2093], { type: 'triangle', gap: 0.06, len: 0.4, at: 0.15 });
      tones([1047, 1319, 1568, 2093], { gap: 0, len: 1.8, vol: 0.45, at: 0.58 });
      tones([1047, 1319, 1568], { type: 'sawtooth', gap: 0, len: 1.4, vol: 0.12, at: 0.58 });
    },
    // 次のボス: ドン
    enter() {
      boom(3);
      tones([196, 147], { type: 'sawtooth', gap: 0.14, len: 0.4, vol: 0.3 });
    },
  };

  // --- 演出 ---
  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  async function shake(amp, seconds) {
    const el = $('wrap');
    const end = performance.now() + seconds * 1000;
    while (performance.now() < end) {
      const k = (end - performance.now()) / (seconds * 1000);
      el.style.transform = `translate(${rnd(-amp, amp) * k}px, ${rnd(-amp, amp) * 0.6 * k}px) rotate(${rnd(-0.8, 0.8) * k}deg)`;
      await sleep(28);
    }
    el.style.transform = '';
  }

  // ダメージの数字。大きいほど大きく、朱 → 金
  function damage(value, tier, { over = false, heal = false } = {}) {
    const wrap = $('wrap');
    const face = $('face').getBoundingClientRect();
    const w = wrap.getBoundingClientRect();
    const nums = wrap.querySelectorAll('.dmg');
    if (nums.length > 10) nums[0].remove();
    const el = document.createElement('div');
    el.className = `dmg t${tier}${over ? ' over' : ''}${heal ? ' heal' : ''}`;
    el.textContent = over || heal ? `+${fmt(value)}` : fmt(value);
    el.style.top = `${face.top - w.top + face.height * rnd(0.25, 0.5)}px`;
    const digits = Math.min(6, String(Math.round(value)).length);
    el.style.setProperty('--size', `${Math.min(110, (30 + digits * 3 + tier * 20) * p.power)}px`);
    el.style.setProperty('--dx', `${rnd(-40, 30)}px`);
    el.style.setProperty('--rot', `${rnd(-10, 6)}deg`);
    wrap.append(el);
    // 顔のあたりから。大きい数字でも枠からはみ出さないように
    const half = el.offsetWidth / 2 + 8;
    const x = face.left - w.left + face.width * rnd(0.35, 0.7);
    el.style.left = `${Math.max(half, Math.min(w.width - half, x))}px`;
    setTimeout(() => el.remove(), 1200);
  }

  function sparks(count) {
    const wrap = $('wrap');
    const plate = $('plate').getBoundingClientRect();
    const w = wrap.getBoundingClientRect();
    const x = plate.left - w.left + plate.width * 0.54, y = plate.top - w.top + plate.height * 0.45;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('i');
      el.className = `spark${i % 4 === 0 ? ' w' : ''}`;
      const a = rnd(0, Math.PI * 2), d = rnd(80, 340) * Math.min(1.6, p.power);
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.setProperty('--dx', `${Math.cos(a) * d}px`);
      el.style.setProperty('--dy', `${Math.sin(a) * d * 0.5}px`);
      el.style.setProperty('--s', String(rnd(0.5, 1.4)));
      el.style.animationDelay = `${rnd(0, 0.12)}s`;
      wrap.append(el);
      setTimeout(() => el.remove(), 1400);
    }
  }

  // ダメージを受けた
  function onHit(b, ev, prev) {
    const tier = ev.tier ?? 0;
    const wasLow = document.body.classList.contains('low');
    render(b);
    restart($('face'), 'hurt');
    restart($('pflash'), 'go');
    damage(ev.damage, tier);
    if (ev.by?.user) showHitter(ev.by.user);
    SOUND.hit(tier);
    if (tier >= 1) {
      restart($('slashA'), 'go');
      restart($('redflash'), 'go');
      shake((tier >= 2 ? 16 : 8) * p.power, tier >= 2 ? 0.6 : 0.35);
    }
    if (tier >= 2) setTimeout(() => restart($('slashB'), 'go'), 90);
    if (!wasLow && document.body.classList.contains('low')) SOUND.pinch();
  }

  // 回復: 緑に光って「回復した！」。数字があれば緑で出す
  function onHeal(b, ev) {
    render(b);
    restart($('greenflash'), 'go');
    const word = $('healword');
    word.classList.remove('go');
    void word.offsetWidth;
    word.classList.add('go');
    const n = Number(ev?.amount);
    if (n > 0) damage(n, 0, { heal: true });
    tones([523, 659, 784], { type: 'triangle', gap: 0.07, len: 0.18, vol: 0.35 });
  }

  // 討伐: HP が 0 になる → 一瞬止まって暗くなる → 「討伐!」を叩きつけ、金の光、とどめを刺した人
  async function onDefeat(b, ev) {
    render({ ...b, defeated: false }, { roll: true });
    document.body.classList.remove('low');
    restart($('face'), 'hurt');
    restart($('pflash'), 'go');
    restart($('slashA'), 'go');
    setTimeout(() => restart($('slashB'), 'go'), 90);
    damage(ev.damage, Math.max(1, ev.tier ?? 1));
    if (ev.by?.user) showHitter(ev.by.user);
    SOUND.hit(2);
    shake(18 * p.power, 0.5);
    await sleep(520);
    // 溜め: 暗転して無音
    $('plate').classList.add('blackout');
    await sleep(650);
    $('plate').classList.remove('blackout');
    // ドン
    render(b);
    restart($('goldflash'), 'go');
    const word = $('word');
    word.classList.remove('out', 'go');
    void word.offsetWidth;
    word.classList.add('go');
    const fin = $('finisher');
    fin.classList.remove('out', 'go');
    fin.replaceChildren();
    const who = b.finisher?.user ?? ev.by?.user;
    if (who) {
      fin.append(avatarNode(who, 34), Object.assign(document.createElement('small'), { textContent: 'とどめ' }), who.name ?? '');
      void fin.offsetWidth;
      fin.classList.add('go');
    }
    sparks(Math.round(36 * Math.min(1.6, p.power)));
    SOUND.defeat();
    shake(14 * p.power, 0.55);
    await sleep(2600);
    word.classList.add('out');
    word.classList.remove('go');
    fin.classList.add('out');
  }

  // 次のボスが出てくる: 顔がワイプで入り、HP が満ちていく
  async function onNext(b) {
    $('word').classList.remove('go');
    document.body.classList.remove('defeated');
    $('hitter').classList.remove('on');
    charging = true;
    render({ ...b, hp: 0 }, { instant: true, roll: false });
    restart(document.body, 'enter');
    SOUND.enter();
    await sleep(350);
    charge(1.1);
    // HP が 0 から満タンまで満ちる
    const start = performance.now();
    await new Promise((done) => {
      const step = (now) => {
        const t = Math.min(1, (now - start) / 1100);
        const e = 1 - (1 - t) ** 3;
        const hp = Math.round(b.hp * e);
        $('hp').textContent = fmt(hp);
        delete $('hp').dataset.text;
        setBar(hp, b.maxHp, { instant: true });
        if (t < 1) requestAnimationFrame(step);
        else done();
      };
      requestAnimationFrame(step);
    });
    $('hp').replaceChildren();
    charging = false;
    render(b, { instant: true });
    boom(2);
  }

  // メッセージは順番に（討伐の演出の途中で次のボスが来ても崩れないように）
  let chain = Promise.resolve();
  const busy = { on: false };
  function onBoss({ boss: b, prev, event: ev }) {
    const kind = ev?.kind;
    // ふつうのダメージは待たせずに出す（演出中なら状態だけ合わせる）
    if (kind === 'hit' && !busy.on) return onHit(b, ev, prev);
    if (kind === 'heal' && !busy.on) return onHeal(b, ev);
    if (kind === 'overkill') {
      damage(ev.damage, 0, { over: true });
      if (ev.by?.user) showHitter(ev.by.user);
      SOUND.hit(0);
      return;
    }
    chain = chain.then(async () => {
      busy.on = true;
      try {
        if (kind === 'hit') onHit(b, ev, prev);
        else if (kind === 'defeat') await onDefeat(b, ev);
        else if (kind === 'next') await onNext(b);
        else if (kind === 'heal') onHeal(b, ev);
        else if (kind === 'reset') {
          $('word').classList.remove('go');
          $('healword').classList.remove('go');
          $('hitter').classList.remove('on');
          render(b);
        } else render(b);
      } finally {
        busy.on = false;
      }
    });
  }

  async function sync() {
    try {
      const all = await (await fetch('/api/boss')).json();
      const b = all[id];
      if (!b) return;
      render(b, { instant: true });
      if (b.lastHit?.user) showHitter(b.lastHit.user, { bump: false });
    } catch {}
  }

  await sync();
  connect({
    hello: sync,
    boss(msg) {
      if (msg.id === id) onBoss(msg);
    },
  });
</script>
</body>
</html>
