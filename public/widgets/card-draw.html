<!-- カードめくり: 表で見せる → 裏返して混ぜる → 番号つきで並べる → ギフトを送った人が番号をコメント → そのカードがめくれて結果。段階はサーバー(src/card-draw.js)が決める -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>カードめくり</title>
<link rel="stylesheet" href="lib/overlay.css">
<link rel="stylesheet" href="/vendor/fonts/dela-gothic-one/400.css">
<link rel="stylesheet" href="/vendor/fonts/zen-kaku-gothic-new/700.css">
<style>
/* ライコネのウィジェットの色だけを使う: 墨(--ink)の板、朱(--signal)の印、当たりは金(--gold) */
body { display: grid; place-items: center; min-height: 100vh; margin: 0; }
.stage { position: relative; width: 1040px; height: 680px; display: none; }
body.on .stage { display: block; }
.banner { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); display: flex; align-items: center; gap: 18px; min-width: 560px; padding: 14px 18px 14px 24px; border-radius: var(--r); background: var(--ink); color: var(--paper); font-family: var(--font); font-weight: 700; font-size: 24px; box-shadow: var(--lift); }
.banner .msg { flex: 1; }
.banner b { color: var(--gold); }
.left { display: none; align-items: baseline; gap: 4px; padding-left: 18px; box-shadow: inset 1px 0 0 var(--rule); font-family: "Dela Gothic One", var(--font); color: var(--paper); }
.left .n { font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: right; }
.left .u { font-family: var(--font); font-size: 14px; color: var(--paper-dim); }
.stage[data-phase="pick"] .left { display: flex; }
.left.hurry .n { color: var(--signal); }
.table { position: absolute; left: 0; right: 0; top: 110px; bottom: 0; }
.card { position: absolute; width: 132px; height: 184px; perspective: 900px; transition: left .55s cubic-bezier(.32, .72, 0, 1), top .55s cubic-bezier(.32, .72, 0, 1), transform .55s cubic-bezier(.32, .72, 0, 1), opacity .4s; }
.inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.32, .72, 0, 1); }
.card.down .inner { transform: rotateY(180deg); }
.face, .back { position: absolute; inset: 0; border-radius: var(--r); backface-visibility: hidden; display: grid; place-items: center; box-shadow: var(--lift); }
.face { background: var(--paper); color: var(--ink); font-family: "Dela Gothic One", var(--font); font-size: 30px; writing-mode: vertical-rl; box-shadow: inset 0 0 0 4px var(--ink), var(--lift); }
.face.win { background: var(--gold); color: var(--ink); }
/* 裏: 墨の板に朱の細い縁と「ラ」の印。番号は表と同じ太い文字 */
.back { transform: rotateY(180deg); background: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-3), inset 0 0 0 7px var(--ink), inset 0 0 0 9px var(--signal), var(--lift); }
.mark { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 26px; height: 26px; border: 2px solid var(--signal); border-radius: 3px; color: var(--signal); font-family: var(--font); font-weight: 700; font-size: 14px; display: grid; place-items: center; }
.no { color: var(--paper); font-family: "Dela Gothic One", var(--font); font-size: 64px; line-height: 1; opacity: 0; transform: scale(.7); transition: opacity .3s, transform .3s; }
.stage[data-phase="pick"] .no, .stage[data-phase="reveal"] .no, .stage[data-phase="done"] .no { opacity: 1; transform: none; }
.card.chosen { z-index: 5; }
.stage[data-phase="reveal"] .card:not(.chosen), .stage[data-phase="done"] .card:not(.chosen) { opacity: .25; }
.result { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%) scale(.6); opacity: 0; padding: 10px 34px; border-radius: var(--r); font-family: "Dela Gothic One", var(--font); font-size: 56px; color: var(--paper); background: var(--ink); box-shadow: var(--lift); transition: transform .35s cubic-bezier(.2, 1.4, .4, 1), opacity .3s; }
.result.win { background: var(--gold); color: var(--ink); }
.result.show { transform: translateX(-50%); opacity: 1; }
.stage[data-phase="done"] { animation: fade var(--done, 1.2s) linear both; }
@keyframes fade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
@keyframes jiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg) translateY(-6px); } 75% { transform: rotate(6deg) translateY(4px); } }
.card.mixing { animation: jiggle .28s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .card, .inner, .result { transition-duration: .01s !important; } .card.mixing { animation: none; } }
</style>
</head>
<body>
<div class="stage" id="stage" data-phase="idle">
  <div class="banner"><span class="msg" id="banner"></span><span class="left" id="left"><span class="n" id="leftN"></span><span class="u">秒</span></span></div>
  <div class="table" id="table"></div>
  <div class="result" id="result"></div>
</div>
<script type="module">
import { BASE } from './lib/overlay.js';
const stage = document.getElementById('stage');
const table = document.getElementById('table');
const banner = document.getElementById('banner');
const resultEl = document.getElementById('result');
let seq = -1;
let cards = [];
let timer = null;

// 並べる場所: 枚数に合わせて1〜2段。真ん中にそろえる
function slots(n) {
  const perRow = n <= 6 ? n : Math.ceil(n / 2); // 7枚から2段にする(1段だと横にはみ出す)
  const rows = Math.ceil(n / perRow);
  const gap = 18, w = 132, h = 184, W = 1040, H = 570;
  return Array.from({ length: n }, (_, i) => {
    const row = Math.floor(i / perRow), col = i % perRow;
    const inRow = Math.min(perRow, n - row * perRow);
    const left = (W - (inRow * w + (inRow - 1) * gap)) / 2 + col * (w + gap);
    const top = (H - (rows * h + (rows - 1) * gap)) / 2 + row * (h + gap);
    return { left, top };
  });
}

function build(round) {
  table.replaceChildren();
  const pos = slots(round.count);
  cards = pos.map((p, i) => {
    const card = Object.assign(document.createElement('div'), { className: 'card down' });
    const inner = Object.assign(document.createElement('div'), { className: 'inner' });
    const face = Object.assign(document.createElement('div'), { className: 'face' });
    const back = Object.assign(document.createElement('div'), { className: 'back' });
    back.append(Object.assign(document.createElement('span'), { className: 'mark', textContent: 'ラ' }), Object.assign(document.createElement('span'), { className: 'no', textContent: String(i + 1) }));
    inner.append(face, back);
    card.append(inner);
    card.style.left = `${p.left}px`;
    card.style.top = `${p.top}px`;
    table.append(card);
    return { card, face };
  });
}

function setFaces(round) {
  cards.forEach(({ face }, i) => {
    const win = round.faces ? round.faces[i] : false;
    face.classList.toggle('win', win);
    face.textContent = win ? round.labels.win : round.labels.lose;
  });
}

function shuffle() {
  // 真ん中に集めて、混ぜて、また並べる(見た目だけ。結果はサーバーが決める)
  const center = { left: (1040 - 132) / 2, top: (570 - 184) / 2 };
  cards.forEach(({ card }) => { card.classList.add('down'); });
  setTimeout(() => cards.forEach(({ card }) => { card.style.left = `${center.left}px`; card.style.top = `${center.top}px`; card.classList.add('mixing'); }), 650);
  setTimeout(() => {
    const pos = slots(cards.length);
    cards.forEach(({ card }, i) => { card.classList.remove('mixing'); card.style.left = `${pos[i].left}px`; card.style.top = `${pos[i].top}px`; });
  }, 2200);
}

function show(msg) {
  const round = msg.round;
  stage.dataset.phase = msg.phase;
  document.body.classList.toggle('on', msg.phase !== 'idle' && !!round);
  clearInterval(timer);
  if (!round) return;
  if (msg.seq !== seq || !cards.length) { seq = msg.seq; build(round); resultEl.className = 'result'; }
  stage.style.setProperty('--done', `${(round.durations?.doneMs ?? 1200) / 1000}s`);
  const name = round.user?.name ?? '';
  const who = !name ? 'ギフトを送った人' : /(さん|ちゃん|くん|様|さま)$/.test(name) ? name : `${name}さん`;
  if (msg.phase === 'show') {
    setFaces(round);
    requestAnimationFrame(() => cards.forEach(({ card }, i) => setTimeout(() => card.classList.remove('down'), 80 * i)));
    banner.innerHTML = '';
    banner.append(`${who}のカードめくり！ `, Object.assign(document.createElement('b'), { textContent: `${round.labels.win} ${round.faces.filter(Boolean).length}枚` }), ` / ${round.count}枚`);
  } else if (msg.phase === 'shuffle') {
    banner.textContent = '混ぜています…';
    shuffle();
  } else if (msg.phase === 'pick') {
    cards.forEach(({ card }) => card.classList.add('down'));
    banner.innerHTML = '';
    banner.append(`${who}、`, Object.assign(document.createElement('b'), { textContent: `1〜${round.count}` }), ' の番号をコメントしてね');
    const left = document.getElementById('left');
    const leftN = document.getElementById('leftN');
    // 残り時間は数字で。5秒を切ったら朱にする
    const tick = () => { const sec = Math.max(0, Math.ceil((round.pickEndsAt - Date.now()) / 1000)); leftN.textContent = String(sec); left.classList.toggle('hurry', sec <= 5); };
    tick();
    timer = setInterval(tick, 250);
  } else if ((msg.phase === 'reveal' || msg.phase === 'done') && round.picked && round.result) {
    const chosen = cards[round.picked - 1];
    if (!chosen) return;
    banner.textContent = `${who}は ${round.picked} 番！`;
    chosen.card.classList.add('chosen');
    chosen.face.classList.toggle('win', round.result.win);
    chosen.face.textContent = round.result.label;
    chosen.card.style.left = `${(1040 - 132) / 2}px`;
    chosen.card.style.top = `${(570 - 184) / 2 - 20}px`;
    chosen.card.style.transform = 'scale(1.5)';
    setTimeout(() => chosen.card.classList.remove('down'), 600);
    setTimeout(() => { resultEl.textContent = round.result.win ? `${round.result.label}！` : `${round.result.label}…`; resultEl.className = `result show${round.result.win ? ' win' : ''}`; }, 1300);
  }
}

fetch(`${BASE}/api/card-draw`).then((r) => r.json()).then(show).catch(() => {});
// 段階の知らせ(type: cardDraw)は WebSocket で来る。切れたら1秒後につなぎ直す
function listen() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}${BASE}/ws${/[?&]preview=1/.test(location.search) ? '?preview=1' : ''}`);
  ws.onmessage = (m) => { try { const msg = JSON.parse(m.data); if (msg.type === 'cardDraw') show(msg); } catch {} };
  ws.onclose = () => setTimeout(listen, 1000);
}
listen();
</script>
</body>
</html>
