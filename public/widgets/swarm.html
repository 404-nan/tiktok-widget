<!doctype html>
<!-- ギフトの群予告を、OBS の全画面に軽く描画するウィジェット。 -->
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=1080, height=1920, initial-scale=1"><title>群予告</title><link rel="stylesheet" href="lib/overlay.css"><link rel="stylesheet" href="/vendor/fonts/dela-gothic-one/400.css"><style>
:root{--paper:#F6F5F1;--ink:#111113}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:"Zen Kaku Gothic New","Yu Gothic UI",Meiryo,sans-serif}body.preview{background:var(--ink)}body.light{background:var(--paper)}.idle{display:none;position:absolute;inset:0;place-items:center;color:var(--paper);font-size:30px}body.preview .idle{display:grid}#icons{position:absolute;inset:0;overflow:hidden}.gift{position:absolute;left:-120px;display:grid;place-items:center;width:58px;height:58px;border:3px solid var(--tone);border-radius:50%;background:var(--paper);color:var(--ink);font-weight:900;animation:cross var(--speed) linear forwards}.gift img{width:100%;height:100%;border-radius:50%;object-fit:cover}.title{position:absolute;inset:0;display:none;place-items:center;z-index:2;color:var(--tone);font-family:"Dela Gothic One",sans-serif;font-size:var(--size,130px);text-shadow:8px 8px var(--ink)}.title.show{display:grid;animation:slam 4s ease-out both}.users{position:absolute;left:50%;top:62%;transform:translateX(-50%);color:var(--paper);font-size:22px;font-weight:900;text-shadow:0 2px 4px var(--ink);z-index:3}@keyframes cross{from{transform:translateX(0) rotate(-12deg);opacity:0}8%{opacity:1}to{transform:translateX(125vw) rotate(20deg);opacity:0}}@keyframes slam{0%{transform:scale(.5) rotate(-5deg);opacity:0}12%{transform:scale(1.05) rotate(2deg);opacity:1}78%{opacity:1}100%{transform:scale(1) rotate(0);opacity:0}}
</style></head>
<body><p class="idle">群予告・待機</p><div id="icons"></div><div class="title" id="title">群</div><div class="users" id="users"></div><script src="swarm.js"></script></body>
</html>
