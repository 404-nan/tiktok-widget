<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギフト瓶</title>
<link rel="stylesheet" href="lib/overlay.css">
<style>
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* 瓶に貼ったラベルシール */
  .label {
    position: absolute;
    left: 50%;
    display: grid;
    justify-items: center;
    gap: 2px;
    padding: 14px 18px 12px;
    background: var(--paper);
    color: var(--ink);
    border-radius: 3px;
    box-shadow: 0 2px 0 rgba(17, 17, 19, .25);
    border-top: 6px solid var(--signal);
    transform: translate(-50%, -50%) rotate(-1.5deg);
    white-space: nowrap;
  }
  .label .title { font-size: 17px; font-weight: 900; letter-spacing: .04em; }
  .label .value { display: flex; align-items: center; gap: 6px; font-size: 40px; line-height: 1; }
  .label .value .icon { --size: 24px; color: var(--signal); }
  .label .unit { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: rgba(17, 17, 19, .55); }

  /* フラスコ用: 首から紐でぶら下げた札 */
  .label.tag {
    justify-items: start;
    padding: 12px 16px 10px 30px;
    border-top: 0;
    border-left: 6px solid var(--signal);
    border-radius: 2px 10px 10px 2px;
    transform: rotate(7deg);
    transform-origin: 0 0;
  }
  .label.tag::before {
    content: "";
    position: absolute;
    left: 10px;
    top: 14px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--ink);
  }
  .label.tag .title { font-size: 15px; }
  .label.tag .value { font-size: 34px; }
  .hidden { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label" id="label">
  <div class="title" id="title"></div>
  <div class="value num" id="valueRow"><span id="total"></span></div>
  <div class="unit">COINS</div>
</div>
<script src="/vendor/matter.min.js"></script>
<script type="module">
  import { setupWidget, connect, isFor, loadImage, iconImage, odometer, icon, tier, giftNamed, resolveColor } from './lib/overlay.js';
  import { buildVessel, inside } from './lib/vessels.js';

  // 設定は config.yaml の jars.<id>（?id= がなければ default）。URL パラメータでも上書きできる
  const p = await setupWidget('jars', {
    shape: 'jar', title: 'ギフト瓶', label: true, gifts: [], minCoins: 1, maxItems: 300, perGift: 30, keep: true,
    sizeMin: 1, sizeMax: 1, liquid: 'auto', liquidColor: 'accent', glassColor: 'paper',
  });
  const jarId = new URLSearchParams(location.search).get('id') || 'default';

  const { Engine, Bodies, Body, Composite, Sleeping } = Matter;
  const STORAGE_KEY = `tiktok-widget:gift-jar:v1:${jarId}:${p.shape}`;
  // 'on' / 'off' / 'auto'（URL では 1 / 0 も可）
  const showLiquid = p.liquid === 'auto' ? p.shape === 'potion' : ['on', '1', 'true'].includes(String(p.liquid));
  const LIQUID = resolveColor(p.liquidColor);
  // ガラスの色（不透明度を変えて使う）
  const glassRgb = (() => {
    const probe = document.createElement('canvas').getContext('2d');
    probe.fillStyle = resolveColor(p.glassColor);
    const hex = probe.fillStyle; // ブラウザが #rrggbb にそろえてくれる
    return /^#/.test(hex) ? [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)).join(', ') : '246, 245, 241';
  })();
  const glass = (a) => `rgba(${glassRgb}, ${a})`;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const engine = Engine.create({ enableSleeping: true });
  engine.gravity.y = 1.1;

  document.getElementById('title').textContent = p.title;
  const labelEl = document.getElementById('label');
  labelEl.classList.toggle('hidden', !p.label);
  document.getElementById('valueRow').prepend(icon('coins'));
  const totalEl = document.getElementById('total');
  odometer(totalEl, 0);

  const css = getComputedStyle(document.documentElement);
  const C = (name) => css.getPropertyValue(name).trim();
  const INK = C('--ink'), PAPER = C('--paper'), SIGNAL = C('--signal'), GOLD = C('--gold');
  // 画像のないギフト（デモ）は価格帯ごとの色のトークンで描く。[塗り, 線・アイコン]
  const TOKEN = { low: [PAPER, INK], mid: [GOLD, INK], high: [SIGNAL, PAPER], top: [INK, GOLD] };

  let W = 0, H = 0;
  let jar = null;          // 瓶の形（描画用の点列など）
  let walls = [];
  const items = [];        // { body, gift, img, r }
  let total = 0;

  // --- 入れ物の形 ---
  function buildJar() {
    const dpr = devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    jar = buildVessel(p.shape, W, H);
    const { label } = jar;
    labelEl.classList.toggle('tag', label.kind === 'tag');
    labelEl.style.left = `${label.x}px`;
    labelEl.style.top = `${label.y}px`;
    // 札の穴の位置（紐を描くのに使う）
    if (label.kind === 'tag') {
      const r = labelEl.getBoundingClientRect();
      jar.hole = { x: r.left + 15, y: r.top + 19 };
    }

    Composite.remove(engine.world, walls);
    const thick = 24;
    const pts = jar.pts;
    walls = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x1, y1] = pts[i];
      const [x2, y2] = pts[i + 1];
      const len = Math.hypot(x2 - x1, y2 - y1);
      const angle = Math.atan2(y2 - y1, x2 - x1);
      // 壁の内側の面が線の位置に来るよう、外向きの法線 (-sin, cos) の方へずらす
      const ox = -Math.sin(angle) * (thick / 2);
      const oy = Math.cos(angle) * (thick / 2);
      // つなぎ目に隙間ができないよう少し長くする。ただし口の両端は伸ばさない（口が狭くなる）
      const ends = i === 0 || i === pts.length - 2;
      walls.push(
        Bodies.rectangle((x1 + x2) / 2 + ox, (y1 + y2) / 2 + oy, len + (ends ? 0 : thick * 0.6), thick, {
          isStatic: true,
          angle,
          friction: 0.4,
        }),
      );
    }
    Composite.add(engine.world, walls);
  }

  // --- 玉 ---
  function radiusFor(diamonds) {
    const base = jar.size;
    const t = Math.min(1, Math.log10(Math.max(1, diamonds)) / Math.log10(30000));
    const r = base * (0.042 * p.sizeMin + (0.12 * p.sizeMax - 0.042 * p.sizeMin) * t);
    return Math.min(r, jar.maxRadius); // 口を通れる大きさまで
  }

  async function drop(gift, { fast = false } = {}) {
    const r = radiusFor(gift.diamonds);
    const { open, bounds } = jar;
    let x = (open.l + open.r) / 2 + (Math.random() - 0.5) * Math.max(0, open.r - open.l - r * 2) * 0.8;
    let y = Math.max(r, open.y - r * 2);
    if (fast) {
      // 読み込み直したときは、入れ物の中に直接置く
      for (let i = 0; i < 30; i++) {
        const tx = bounds.left + r + Math.random() * (bounds.right - bounds.left - r * 2);
        const ty = bounds.top + (bounds.bottom - bounds.top) * (0.35 + Math.random() * 0.55);
        if (inside(jar.pts, tx, ty)) {
          x = tx;
          y = ty;
          break;
        }
      }
    }
    const body = Bodies.circle(x, y, r, {
      restitution: 0.25,
      friction: 0.2,
      frictionAir: 0.01,
      density: 0.001 * (1 + Math.log10(Math.max(1, gift.diamonds))),
    });
    Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.3);
    Composite.add(engine.world, body);
    const item = { body, gift, r, img: null };
    items.push(item);
    total += gift.diamonds;
    odometer(totalEl, total);
    if (gift.image) {
      loadImage(gift.image).then((img) => (item.img = img));
    } else {
      const [, fg] = TOKEN[tier(gift.diamonds)];
      iconImage(gift.icon || 'gift', fg, 2.5).then((img) => (item.icon = img));
    }

    while (items.length > p.maxItems) removeItem(items[0]);
    save();
  }

  function removeItem(item) {
    Composite.remove(engine.world, item.body);
    items.splice(items.indexOf(item), 1);
    total -= item.gift.diamonds;
    odometer(totalEl, Math.max(0, total));
  }

  function reset() {
    for (const it of [...items]) removeItem(it);
    total = 0;
    odometer(totalEl, 0);
    save();
  }

  function shake() {
    for (const it of items) {
      Sleeping.set(it.body, false);
      Body.setVelocity(it.body, { x: (Math.random() - 0.5) * 8, y: -6 - Math.random() * 8 });
    }
  }

  // --- 保存（OBS を読み込み直しても中身が残るように） ---
  let saveTimer = null;
  function save() {
    if (!p.keep) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        const data = items.map(({ gift }) => ({ n: gift.nameJa || gift.name, i: gift.image, c: gift.icon, d: gift.diamonds }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch {}
    }, 500);
  }

  function restore() {
    if (!p.keep) return;
    let data = [];
    try {
      data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch {}
    data.slice(-p.maxItems).forEach((g, i) => {
      setTimeout(() => drop({ name: g.n, image: g.i, icon: g.c, diamonds: g.d }, { fast: true }), i * 12);
    });
  }

  // --- 描画ループ ---
  function jarPath() {
    ctx.beginPath();
    jar.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  }

  const GLASS = glass(0.85);

  function drawJarBack() {
    jarPath();
    ctx.closePath();
    ctx.fillStyle = glass(0.08);
    ctx.fill();
  }

  // 中の液体。たまったギフトの数に応じて水位が上がり、水面はゆっくり揺れる
  let level = 0;
  const bubbles = Array.from({ length: 7 }, () => ({ x: Math.random(), y: Math.random(), r: 2 + Math.random() * 3, v: 0.03 + Math.random() * 0.04 }));
  function drawLiquid(now, dt) {
    if (!showLiquid) return;
    const top = jar.liquid?.top ?? jar.bounds.top + (jar.bounds.bottom - jar.bounds.top) * 0.12;
    const bottom = jar.bounds.bottom;
    const target = 0.12 + 0.8 * Math.min(1, items.length / p.maxItems);
    level += (target - level) * Math.min(1, dt * 2);
    const surface = bottom - (bottom - top) * level;

    ctx.save();
    jarPath();
    ctx.closePath();
    ctx.clip();
    ctx.beginPath();
    const { left, right } = jar.bounds;
    ctx.moveTo(left - 10, bottom + 10);
    for (let x = left - 10; x <= right + 10; x += 8) {
      ctx.lineTo(x, surface + Math.sin(x / 26 + now / 700) * 3.5 + Math.sin(x / 11 - now / 450) * 1.5);
    }
    ctx.lineTo(right + 10, bottom + 10);
    ctx.closePath();
    ctx.globalAlpha = 0.62;
    ctx.fillStyle = LIQUID;
    ctx.fill();

    // 泡
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = PAPER;
    for (const b of bubbles) {
      b.y -= b.v * dt;
      if (b.y < 0) {
        b.y = 1;
        b.x = Math.random();
      }
      const bx = left + (right - left) * (0.2 + b.x * 0.6);
      const by = surface + (bottom - surface) * b.y;
      ctx.beginPath();
      ctx.arc(bx, by, b.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawJarFront() {
    // ガラスの縁
    jarPath();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = 4;
    ctx.strokeStyle = GLASS;
    ctx.stroke();

    // 映り込み
    for (const h of jar.highlights) {
      ctx.beginPath();
      h.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.lineWidth = h.width;
      ctx.strokeStyle = glass(h.alpha);
      ctx.stroke();
    }

    // 口のふち（墨の帯）
    if (jar.rim) {
      const { x, y, w, h } = jar.rim;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 4);
      ctx.fillStyle = INK;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = GLASS;
      ctx.stroke();
    }

    // 抜いたコルク栓
    if (jar.cork) {
      const { x, y, w, h } = jar.cork;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(0.45);
      ctx.beginPath();
      ctx.moveTo(-w / 2, -h / 2);
      ctx.lineTo(w / 2, -h / 2);
      ctx.lineTo(w * 0.38, h / 2);
      ctx.lineTo(-w * 0.38, h / 2);
      ctx.closePath();
      ctx.fillStyle = GOLD;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = INK;
      ctx.stroke();
      ctx.restore();
    }

    // 札の紐
    if (jar.hole && jar.neck && p.label) {
      ctx.beginPath();
      ctx.moveTo(jar.neck.x - 2, jar.neck.y);
      ctx.quadraticCurveTo(jar.neck.x + 6, (jar.neck.y + jar.hole.y) / 2 + 10, jar.hole.x, jar.hole.y);
      ctx.lineWidth = 2;
      ctx.strokeStyle = GLASS;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(jar.neck.x - 4, jar.neck.y - 5);
      ctx.lineTo(jar.open.l + 4, jar.neck.y - 5);
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  }

  function drawItem({ body, gift, img, icon: iconImg, r }) {
    ctx.save();
    ctx.translate(body.position.x, body.position.y);
    ctx.rotate(body.angle);
    if (img) {
      const s = r * 2.3;
      ctx.drawImage(img, -s / 2, -s / 2, s, s);
    } else {
      const t = tier(gift.diamonds);
      const [bg, fg] = TOKEN[t];
      ctx.beginPath();
      ctx.arc(0, 0, r - 1, 0, Math.PI * 2);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.lineWidth = t === 'top' ? 3 : 2;
      ctx.strokeStyle = t === 'top' ? GOLD : INK;
      ctx.stroke();
      if (iconImg) {
        const s = r * 1.1;
        ctx.drawImage(iconImg, -s / 2, -s / 2, s, s);
      }
    }
    ctx.restore();
  }

  let last = performance.now();
  let acc = 0;
  const STEP = 1000 / 60;
  function loop(now) {
    const elapsed = Math.min(100, now - last);
    acc += elapsed;
    last = now;
    while (acc >= STEP) {
      Engine.update(engine, STEP);
      acc -= STEP;
    }
    ctx.clearRect(0, 0, W, H);
    drawJarBack();
    drawLiquid(now, elapsed / 1000);
    for (const it of items) drawItem(it);
    drawJarFront();

    // 瓶の外に飛び出して画面外へ落ちたものは片付ける
    for (const it of [...items]) if (it.body.position.y > H + 200) removeItem(it);
    requestAnimationFrame(loop);
  }

  // --- 受信 ---
  connect({
    event(e) {
      if (e.kind !== 'gift' || e.totalDiamonds < p.minCoins) return;
      if (p.gifts.length && !giftNamed(e.gift, p.gifts)) return;
      const n = Math.min(p.perGift, e.gift.count);
      for (let i = 0; i < n; i++) setTimeout(() => drop(e.gift), i * 90);
    },
    control(msg) {
      if (!isFor(msg, 'gift-jar')) return;
      if (msg.data?.id && msg.data.id !== jarId) return; // 特定の瓶だけへの操作
      if (msg.action === 'reset') reset();
      else if (msg.action === 'shake') shake();
    },
  });

  addEventListener('resize', () => buildJar());
  buildJar();
  restore();
  requestAnimationFrame(loop);
</script>
</body>
</html>
