<!-- ニュースティッカーを表示する OBS 用ページ。設定・状態はサーバーから受け取る。 -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ニュースティッカー</title>
<link rel="stylesheet" href="lib/overlay.css">
<link rel="stylesheet" href="/vendor/fonts/zen-kaku-gothic-new/700.css">
<style>
body { display: flex; align-items: stretch; }
.ticker { display: flex; width: 100%; height: 72px; background: var(--surface); color: var(--on-surface); overflow: hidden; }
.label { display: flex; align-items: center; flex: 0 0 auto; padding: 0 24px; background: var(--signal); color: var(--paper); font-size: 24px; font-weight: 900; white-space: nowrap; clip-path: inset(0 0 0 0); }
.label.gift { animation: wipe .35s var(--ease-wipe); }
.track { flex: 1; min-width: 0; display: flex; align-items: center; overflow: hidden; }
.line { display: inline-block; padding-left: 100%; white-space: nowrap; font-size: var(--ticker-size, 26px); font-weight: 700; animation: move var(--ticker-duration, 25s) linear 1; }
.empty { display: none; }
@keyframes move { from { transform: translateX(0); } to { transform: translateX(-100%); } }
@keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
</style>
</head>
<body>
<div class="ticker" id="ticker"><div class="label" id="label"></div><div class="track"><div class="line" id="line"></div></div></div>
<script src="lib/telop.js"></script>
<script src="ticker.js"></script>
<script type="module">
import { setupWidget, connect, fmt, applyTheme } from './lib/overlay.js';

var p = await setupWidget('tickers', { label: 'お知らせ', messages: [], showGifts: true, giftCount: 5, minCoins: 1, showGoals: true, goals: [], speed: 120, fontSize: 26, color: 'accent' });
var label = document.getElementById('label');
var line = document.getElementById('line');
var ticker = document.getElementById('ticker');
var feed = [];
var state = {};
var config = {};
var preview = new URLSearchParams(location.search).get('preview') === '1';

function goalText(name, value) {
  var goal = config.goals && config.goals[name];
  if (!goal) return '';
  var current = Number(state[goal.metric] || 0) + Number(goal.start || 0);
  var target = Number(goal.goal || 0);
  if (goal.step > 0) while (target <= current) target += goal.step;
  return current >= target ? (goal.title || '目標') + ' 達成' : (goal.title || '目標') + ' ' + fmt(current) + ' / ' + fmt(target);
}
function render() {
  var messages = p.messages.slice();
  if (p.showGoals) Object.keys(config.goals || {}).forEach(function (name) { if (!p.goals.length || p.goals.indexOf(name) >= 0) messages.push(goalText(name, state)); });
  if (p.showGifts) feed.slice(0, p.giftCount).forEach(function (item) { if (item.kind === 'gift' && item.gift && item.coins >= p.minCoins) messages.push(item.user.name + 'さん ' + (item.gift.nameJa || item.gift.name) + ' ×' + item.gift.count); });
  if (preview && !messages.length) messages = ['配信のお知らせがここを流れます', 'フォロー目標 42 / 100'];
  ticker.classList.toggle('empty', !messages.length);
  if (!messages.length) return;
  label.textContent = p.label;
  line.textContent = window.Telop.join(messages);
  document.documentElement.style.setProperty('--ticker-size', p.fontSize + 'px');
  document.documentElement.style.setProperty('--ticker-duration', Math.max(8, line.scrollWidth / p.speed) + 's');
  line.style.animation = 'none';
  setTimeout(function () { line.style.animation = ''; }, 20);
}
function add(event) { if (['gift', 'follow', 'share'].indexOf(event.kind) < 0) return; feed.unshift(event); feed = feed.slice(0, 30); if (event.kind === 'gift') { label.textContent = 'ギフト'; label.classList.remove('gift'); void label.offsetWidth; label.classList.add('gift'); setTimeout(function () { label.textContent = p.label; }, 3000); } render(); }
fetch('/api/sample').then(function (r) { return r.json(); }).then(function (s) { if (s.on) render(); }).catch(function () {});
connect({ hello: function (_status, nextState, msg) { state = nextState || {}; config = msg.config || {}; render(); }, event: function (event, nextState) { state = nextState || state; add(event); }, sample: function (on) { if (on) render(); } });
</script>
</body>
</html>
