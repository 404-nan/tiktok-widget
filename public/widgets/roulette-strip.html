<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギフトルーレット（横）</title>
<link rel="stylesheet" href="lib/overlay.css">
<link rel="stylesheet" href="lib/roulette.css">
<style>
  body { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; padding: 20px 16px; }
  .stage { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 14px; min-width: 0; }

  /* 窓: 墨の枠の中をカードが横に流れる */
  .window {
    position: relative;
    width: 100%;
    min-width: 0;
    padding: 10px 0;
    background: var(--surface);
    border-radius: var(--r);
    box-shadow: var(--lift);
  }
  .viewport {
    overflow: hidden;
    /* 両端は流れ込み・流れ出しが分かるよう溶かす */
    -webkit-mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent);
    mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent);
  }
  .track { display: flex; gap: var(--gap); width: max-content; will-change: transform; }
  .tile {
    display: grid;
    place-items: center;
    width: var(--tile);
    height: var(--tile-h);
    padding: 10px 12px;
    border-radius: 3px;
    font-size: 22px;
    font-weight: 900;
    line-height: 1.25;
    text-align: center;
    overflow-wrap: anywhere;
    transition: opacity .3s linear, transform .5s var(--ease-out);
  }
  .tile.long { font-size: 17px; }
  .settled .tile:not(.win) { opacity: .3; }
  .settled .tile.win { transform: scale(1.04); }

  /* 中央の針: 上下の三角と細い線 */
  .marker { position: absolute; left: 50%; top: 0; bottom: 0; width: 0; pointer-events: none; }
  .marker::before {
    content: "";
    position: absolute;
    top: 6px;
    bottom: 6px;
    left: -1.5px;
    width: 3px;
    background: var(--signal);
    box-shadow: 0 0 0 1.5px var(--ink);
  }
  .marker i {
    position: absolute;
    left: -13px;
    width: 26px;
    height: 16px;
    background: var(--signal);
    transition: transform .08s linear;
  }
  .marker i:first-child { top: -8px; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .marker i:last-child { bottom: -8px; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .marker.kick i:first-child { transform: translateX(-5px) rotate(-8deg); }
  .marker.kick i:last-child { transform: translateX(-5px) rotate(8deg); }

  .queue { top: -12px; right: 0; }
  .result { top: calc(var(--window-h) + 14px); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="window" id="window">
    <div class="viewport"><div class="track" id="track"></div></div>
    <div class="marker" id="marker"><i></i><i></i></div>
  </div>
  <div class="hint chip" id="hint"></div>
  <div class="queue chip" id="queue"><span>あと</span><span class="num" id="queueNum"></span><span>回</span></div>
  <div class="result" id="result">
    <div class="kicker" id="kicker"></div>
    <div class="body">
      <div class="label">結果</div>
      <div class="name" id="resultName"></div>
      <div class="by" id="resultBy"></div>
    </div>
  </div>
</div>
<script type="module">
  import { setupPage } from './lib/overlay.js';
  import { readParams, parseItems, pickWeighted, startRoulette, tick } from './lib/roulette.js';

  setupPage();
  const p = readParams();
  const items = parseItems(p.items);

  const stage = document.getElementById('stage');
  const win = document.getElementById('window');
  const track = document.getElementById('track');
  const marker = document.getElementById('marker');

  let T = 150;   // カードの幅
  let G = 8;     // カードの間隔
  let seq = [];  // 並んでいる項目（items の添字）
  let x = 0;     // track の横位置

  // 同じ項目が続きすぎないよう、直前と同じなら一度だけ引き直す
  function randomPick(prev) {
    let it = pickWeighted(items);
    if (items.length > 1 && it.index === prev) it = pickWeighted(items);
    return it.index;
  }

  function tileNode(index) {
    const it = items[index];
    const el = document.createElement('div');
    el.className = 'tile';
    if (it.name.length > 6) el.classList.add('long');
    el.style.background = it.fill;
    el.style.color = it.ink;
    el.textContent = it.name;
    return el;
  }

  function renderTrack() {
    track.replaceChildren(...seq.map(tileNode));
    track.style.transform = `translate3d(${x}px, 0, 0)`;
  }

  const center = () => win.clientWidth / 2;
  const xFor = (i, offset = 0) => center() - (i * (T + G) + T / 2 + offset);
  const indexAt = (pos) => Math.floor((center() - pos) / (T + G));

  function layout() {
    T = Math.round(Math.min(180, Math.max(110, innerWidth / 5.2)));
    G = Math.round(T * 0.055);
    stage.style.setProperty('--tile', `${T}px`);
    stage.style.setProperty('--tile-h', `${Math.round(T * 0.82)}px`);
    stage.style.setProperty('--gap', `${G}px`);
    stage.style.setProperty('--window-h', `${win.offsetHeight}px`);
  }

  function init() {
    layout();
    seq = [];
    for (let i = 0; i < 15; i++) seq.push(randomPick(seq.at(-1)));
    x = xFor(7);
    renderTrack();
    stage.style.setProperty('--window-h', `${win.offsetHeight}px`);
  }

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  async function spin(winner) {
    win.classList.remove('settled');
    track.querySelector('.win')?.classList.remove('win');

    // 今見えている分は残して、その先に新しいカードを継ぎ足す（見た目は途切れない）
    const keepFrom = Math.max(0, indexAt(x) - 8);
    seq = seq.slice(keepFrom);
    x += keepFrom * (T + G);
    const run = reduced ? 4 : 42 + Math.floor(Math.random() * 8);
    for (let i = 0; i < run; i++) seq.push(randomPick(seq.at(-1)));
    const target = seq.length;
    seq.push(winner.index);
    for (let i = 0; i < 8; i++) seq.push(randomPick(seq.at(-1)));
    renderTrack();

    // 当たりのカードの中で止まる位置も毎回ずらす
    const from = x;
    const to = xFor(target, (Math.random() - 0.5) * T * 0.7);
    const duration = reduced ? 300 : p.duration * 1000;
    let last = indexAt(from);
    let kickTimer = null;

    await new Promise((resolve) => {
      const t0 = performance.now();
      const frame = (now) => {
        const t = Math.min(1, (now - t0) / duration);
        x = from + (to - from) * (1 - Math.pow(1 - t, 4));
        track.style.transform = `translate3d(${x}px, 0, 0)`;
        const idx = indexAt(x);
        if (idx !== last) {
          last = idx;
          tick(p);
          marker.classList.add('kick');
          clearTimeout(kickTimer);
          kickTimer = setTimeout(() => marker.classList.remove('kick'), 70);
        }
        if (t < 1) requestAnimationFrame(frame);
        else resolve();
      };
      requestAnimationFrame(frame);
    });

    track.children[target].classList.add('win');
    win.classList.add('settled');
  }

  startRoulette({ p, items, spin, name: 'roulette-strip' });

  init();
  addEventListener('resize', () => {
    const i = indexAt(x);
    layout();
    x = xFor(i);
    track.style.transform = `translate3d(${x}px, 0, 0)`;
  });
</script>
</body>
</html>
