<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ギフトルーレット（横）</title>
<script>
  // 旧 URL。横スライド型は roulette.html の style=strip になった
  const q = new URLSearchParams(location.search);
  if (!q.has('style')) q.set('style', 'strip');
  location.replace(`roulette.html?${q}`);
</script>
</head>
<body></body>
</html>
