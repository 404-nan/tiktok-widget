<!doctype html>
<!-- コンボのサーバー状態を、送信者を主役にした短い演出として表示するウィジェット。 -->
<!-- WebSocket のイベントを受信順に処理し、回数・段階・期限は再計算しない。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コンボ</title>
<style>
  :root { color-scheme: dark; --ink: #111113; --paper: #f7f7f5; --muted: #c9c9d1; --blue: #4ca7ff; --green: #48d597; --red: #ff5d62; --gold: #ffc53d; --rainbow: #d48cff; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { background: transparent; color: var(--paper); font-family: "Yu Gothic UI", "Meiryo", sans-serif; font-size: 16px; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 6vmin; background: transparent; }
  .panel { width: min(88vw, 720px); min-height: 300px; padding: 5vmin; border: 4px solid var(--tier-color, var(--blue)); background: #111113; box-shadow: 0 16px 44px rgba(0, 0, 0, .45); opacity: 0; transform: translateY(18px) scale(.96); }
  .panel.show { opacity: 1; transform: none; }
  .panel.hit { animation: impact .32s ease-out; }
  .panel.ending { animation: end-card 1.1s ease-out both; }
  .panel.test-mode { border-style: dashed; }
  .waiting { position: absolute; right: 3vmin; bottom: 3vmin; color: var(--muted); font-size: 14px; }
  .waiting.hidden { display: none; }
  .sender { display: flex; align-items: center; gap: 12px; min-width: 0; color: var(--muted); font-size: clamp(16px, 3vw, 28px); font-weight: 700; }
  .avatar { width: 48px; height: 48px; flex: 0 0 48px; overflow: hidden; border: 2px solid var(--tier-color, var(--blue)); border-radius: 50%; background: #28282e; display: grid; place-items: center; font-size: 22px; color: var(--paper); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .sender-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .test-label { display: none; margin-left: auto; padding: 3px 7px; border: 1px solid var(--muted); color: var(--muted); font-size: 12px; font-weight: 400; }
  .test-mode .test-label { display: inline-block; }
  .count { margin: 5vmin 0 2vmin; color: var(--tier-color, var(--blue)); font-family: Arial, sans-serif; font-size: clamp(64px, 17vw, 180px); font-weight: 900; line-height: .9; text-align: center; text-shadow: 0 4px 0 #000; }
  .count small { font-size: .28em; }
  .gift { min-height: 1.4em; color: var(--paper); font-size: clamp(16px, 3vw, 28px); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .total { margin-top: 2vmin; color: var(--muted); font-size: clamp(14px, 2.4vw, 22px); text-align: center; }
  .end-text { margin-top: 3vmin; color: var(--tier-color, var(--gold)); font-size: clamp(16px, 3vw, 28px); font-weight: 700; text-align: center; }
  [data-tier="blue"] { --tier-color: var(--blue); }
  [data-tier="green"] { --tier-color: var(--green); }
  [data-tier="red"] { --tier-color: var(--red); }
  [data-tier="gold"] { --tier-color: var(--gold); }
  [data-tier="rainbow"] { --tier-color: var(--rainbow); background: linear-gradient(#111113, #111113) padding-box, linear-gradient(90deg, var(--red), var(--gold), var(--green), var(--blue), var(--rainbow)) border-box; border-color: transparent; }
  @keyframes impact { 0% { transform: translateY(0) scale(1.04); } 25% { transform: translateY(0) scale(.99); } 100% { transform: translateY(0) scale(1); } }
  @keyframes end-card { 0% { opacity: 1; transform: scale(1.02); } 100% { opacity: 0; transform: scale(.98); } }
  @media (max-width: 520px) {
    .stage { padding: 4vw; }
    .panel { min-height: 220px; padding: 7vw 5vw; }
    .avatar { width: 40px; height: 40px; flex-basis: 40px; }
    .total, .gift { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel { transition: none; }
    .panel.hit, .panel.ending { animation: none; }
  }
</style>
</head>
<body>
<main class="stage" aria-live="polite">
  <section class="panel" id="panel" aria-label="コンボ">
    <div class="sender"><span class="avatar" id="avatar"></span><span class="sender-name" id="sender"></span><span class="test-label">テスト</span></div>
    <div class="count" id="count"></div>
    <div class="gift" id="gift"></div>
    <div class="total" id="total"></div>
    <div class="end-text" id="end-text"></div>
  </section>
</main>
<div class="waiting" id="waiting">接続待ち</div>
<script>
/* ES5 の小さな表示器。サーバーから受けた combo の値だけを描画する。 */
(function () {
  'use strict';
  var pathMatch = location.pathname.match(/^(.*\/t\/[^/]+)(?:\/|$)/);
  var base = pathMatch ? pathMatch[1] : '';
  var api = base + '/api/combo';
  var wsPath = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + base + '/ws' + (/[?&]preview=1/.test(location.search) ? '?preview=1' : '');
  var panel = document.getElementById('panel');
  var waiting = document.getElementById('waiting');
  var avatar = document.getElementById('avatar');
  var sender = document.getElementById('sender');
  var count = document.getElementById('count');
  var gift = document.getElementById('gift');
  var total = document.getElementById('total');
  var endText = document.getElementById('end-text');
  var queue = [];
  var playing = false;
  var seen = {};
  var shownUsers = {};
  var serverOffset = 0;
  var enabled = true;
  var volume = 0.5;
  var sound = true;
  var endLabel = 'コンボ終了';
  var audioContext = null;
  var normalDuration = 1800;
  var tierDuration = 2600;
  var endDuration = 1100;
  var leadSilence = 250;
  var hitStop = 80;

  function serverNow() { return Date.now() + serverOffset; }
  function number(value, fallback) { return typeof value === 'number' && isFinite(value) ? value : fallback; }
  function userKey(user) { return String(user && (user.id || user.name) || '?'); }
  function messageKey(event, test) { return (test ? 'test:' : 'live:') + (event.id || event.endedAt || userKey(event.user) + ':' + String(event.count) + ':' + String(event.expiresAt) + ':' + String(event.kind)); }
  function tierName(value) { return /^(blue|green|red|gold|rainbow)$/.test(value) ? value : 'blue'; }
  function safeText(value) { return value == null ? '' : String(value); }

  function drawUser(user) {
    var name = safeText(user && (user.name || user.id));
    sender.textContent = name;
    avatar.textContent = name ? name.slice(0, 1) : '?';
    while (avatar.firstChild) avatar.removeChild(avatar.firstChild);
    if (user && user.avatar) {
      var image = document.createElement('img');
      image.alt = '';
      image.src = user.avatar;
      image.onerror = function () { if (image.parentNode) image.parentNode.removeChild(image); avatar.textContent = name ? name.slice(0, 1) : '?'; };
      avatar.appendChild(image);
    }
  }

  function drawState(snapshot) {
    if (!snapshot) return;
    if (snapshot.now) serverOffset = Number(snapshot.now) - Date.now();
    if (snapshot.active && snapshot.active.length) {
      var current = snapshot.active[0];
      if (current.expiresAt && serverNow() > Number(current.expiresAt)) return;
      drawUser(current.user);
      count.textContent = '×' + safeText(current.count);
      total.textContent = '合計 ' + safeText(current.total) + ' コイン';
      gift.textContent = '';
      endText.textContent = '';
      panel.setAttribute('data-tier', tierName(current.tier));
      panel.classList.add('show');
      shownUsers[userKey(current.user)] = true;
    } else if (snapshot.last) {
      drawUser(snapshot.last.user);
      count.textContent = '×' + safeText(snapshot.last.count);
      total.textContent = '合計 ' + safeText(snapshot.last.total) + ' コイン';
      gift.textContent = '';
      endText.textContent = endLabel;
      panel.setAttribute('data-tier', tierName(snapshot.last.tier));
      panel.classList.add('show');
    } else {
      clearPanel();
    }
  }

  function clearPanel() {
    queue = [];
    panel.classList.remove('show');
    panel.classList.remove('hit');
    panel.classList.remove('ending');
    panel.classList.remove('hit-stop');
    sender.textContent = '';
    count.textContent = '';
    gift.textContent = '';
    total.textContent = '';
    endText.textContent = '';
  }

  function playSound(kind) {
    if (!sound || volume <= 0 || !window.AudioContext) return;
    try {
      audioContext = audioContext || new window.AudioContext();
      var oscillator = audioContext.createOscillator();
      var gain = audioContext.createGain();
      var now = audioContext.currentTime;
      oscillator.frequency.value = kind === 'up' ? 1047 : 660;
      oscillator.type = kind === 'up' ? 'triangle' : 'sine';
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(volume * 0.25, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.2);
    } catch (error) { /* ブラウザが音を許可しないときは画面だけ続ける。 */ }
  }

  function showItem(item, done) {
    var event = item.event;
    var isEnd = event.kind === 'end';
    drawUser(event.user);
    count.textContent = '×' + safeText(event.count);
    gift.textContent = safeText(event.gift);
    total.textContent = '合計 ' + safeText(event.total) + ' コイン';
    endText.textContent = isEnd ? endLabel : '';
    panel.setAttribute('data-tier', tierName(event.tier));
    panel.classList.toggle('test-mode', item.test === true);
    panel.classList.remove('ending');
    panel.classList.add('show');
    if (isEnd) panel.classList.add('ending'); else panel.classList.add('hit');
    if (!item.test) shownUsers[userKey(event.user)] = true;
    playSound(event.up ? 'up' : 'hit');
    var duration = isEnd ? endDuration : (event.up ? tierDuration : normalDuration);
    if (event.up && leadSilence > 250) duration = 3000;
    panel.classList.add('hit-stop');
    setTimeout(function () { panel.classList.remove('hit-stop'); }, hitStop);
    setTimeout(function () {
      panel.classList.remove('hit');
      if (isEnd) panel.classList.remove('show');
      done();
    }, duration);
  }

  function playNext() {
    if (playing || !queue.length) return;
    playing = true;
    showItem(queue.shift(), function () { playing = false; playNext(); });
  }

  function enqueue(event, test) {
    if (!event || !event.kind || !event.user) return;
    pruneSeen();
    var key = messageKey(event, test);
    if (seen[key]) return;
    seen[key] = serverNow();
    if (event.kind === 'end' && !test && !shownUsers[userKey(event.user)]) return;
    if (queue.length >= 20) queue.shift();
    queue.push({ event: event, test: test === true });
    playNext();
  }

  function pruneSeen() {
    var keys = Object.keys(seen);
    var cutoff = serverNow() - 120000;
    var i;
    for (i = 0; i < keys.length; i++) {
      if (seen[keys[i]] < cutoff) delete seen[keys[i]];
    }
    keys = Object.keys(seen);
    if (keys.length > 200) {
      for (i = 0; i < keys.length - 200; i++) delete seen[keys[i]];
    }
  }

  function handleMessage(message) {
    if (!message) return;
    if (message.type === 'config' || message.config) applyConfig(message.config);
    if (message.type !== 'combo' || !enabled) return;
    if (message.test === true) { enqueue(message.event, true); return; }
    if (message.event) enqueue(message.event, message.test === true);
    else drawState(message.combo);
  }

  function applyConfig(config) {
    var combo = config && config.combo;
    if (!combo) return;
    enabled = combo.enabled !== false;
    sound = combo.sound !== false;
    volume = number(combo.volume, 0.5);
    endLabel = safeText(combo.endText || 'コンボ終了');
    if (!enabled) { panel.classList.remove('show'); waiting.classList.add('hidden'); }
  }

  function connect() {
    var socket;
    try { socket = new WebSocket(wsPath); } catch (error) { setTimeout(connect, 2000); return; }
    socket.onopen = function () { waiting.classList.add('hidden'); };
    socket.onmessage = function (message) { try { handleMessage(JSON.parse(message.data)); } catch (error) {} };
    socket.onclose = function () { waiting.classList.remove('hidden'); setTimeout(connect, 2000); };
    socket.onerror = function () { try { socket.close(); } catch (error) {} };
  }

  fetch(api).then(function (response) { if (!response.ok) throw new Error('combo'); return response.json(); }).then(function (snapshot) { drawState(snapshot); waiting.classList.add('hidden'); }).catch(function () { waiting.classList.remove('hidden'); setTimeout(load, 2000); });
  function load() {
    fetch(api).then(function (response) { if (!response.ok) throw new Error('combo'); return response.json(); }).then(function (snapshot) { drawState(snapshot); waiting.classList.add('hidden'); }).catch(function () { waiting.classList.remove('hidden'); setTimeout(load, 2000); });
  }
  fetch(base + '/api/config').then(function (response) { if (response.ok) return response.json(); return null; }).then(applyConfig).catch(function () {});
  connect();
}());
</script>
</body>
</html>
