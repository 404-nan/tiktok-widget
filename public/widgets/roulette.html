<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギフトルーレット</title>
<link rel="stylesheet" href="lib/overlay.css">
<link rel="stylesheet" href="lib/roulette.css">
<style>
  body { display: grid; grid-template-columns: minmax(0, 1fr); }
  body.style-wheel { place-items: center; }
  body.style-strip { align-content: start; padding: 20px 16px; }
  .stage { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 14px; min-width: 0; width: 100%; }
  /* ギフトが来たときだけ、画面の外（下）からすべり込む */
  .stage { transition: transform .5s var(--ease-out), opacity .5s linear; }
  .stage:not(.on) { transform: translateY(110vh); opacity: 0; }
  body.preview .stage { transform: none; opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .stage { transition: opacity .3s linear; } .stage:not(.on) { transform: none; } }
  .view { width: 100%; display: grid; justify-items: center; }
  .view[hidden] { display: none; }
  /* ルーレットが切り替わったときは左から拭き出す */
  .stage.swap .view:not([hidden]) { animation: wipe-in .5s var(--ease-wipe); }
  @keyframes wipe-in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  /* 丸型 */
  .wheel-view canvas { display: block; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .35)); transition: transform .5s cubic-bezier(.2, .9, .3, 1); transform-origin: 50% 0; }
  /* ギリギリ演出: 針のまわりを大きく写す */
  .wheel-view.chance canvas { transform: scale(1.7); }
  .strip-view .window { transition: transform .5s cubic-bezier(.2, .9, .3, 1); }
  .strip-view.chance .window { transform: scale(1.3); }
  .style-wheel .result { top: 58%; }

  /* 横スライド型 */
  .window {
    position: relative;
    width: 100%;
    min-width: 0;
    padding: 10px 0;
    background: var(--surface);
    border-radius: var(--r);
    box-shadow: var(--lift);
  }
  .viewport {
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent);
    mask-image: linear-gradient(to right, transparent, #000 14%, #000 86%, transparent);
  }
  .track { display: flex; gap: var(--gap); width: max-content; will-change: transform; }
  .tile {
    display: grid;
    place-items: center;
    align-content: center;
    gap: 6px;
    width: var(--tile);
    height: var(--tile-h);
    padding: 10px 12px;
    border-radius: 3px;
    font-weight: 900;
    line-height: 1.25;
    text-align: center;
    overflow: hidden;
    overflow-wrap: anywhere;
    transition: opacity .3s linear, transform .5s var(--ease-out);
  }
  .tile.has-image { grid-template-rows: minmax(0, 1fr) auto; padding: 10px 10px 8px; }
  .tile.has-image img { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
  .tile.has-image span { font-size: .78em; }
  .settled .tile:not(.win) { opacity: .3; }
  .settled .tile.win { transform: scale(1.04); }

  .marker { --pointer: var(--signal); position: absolute; left: 50%; top: 0; bottom: 0; width: 0; pointer-events: none; }
  .marker::before {
    content: "";
    position: absolute;
    top: 6px;
    bottom: 6px;
    left: -1.5px;
    width: 3px;
    background: var(--pointer);
    box-shadow: 0 0 0 1.5px var(--ink);
  }
  .marker i { position: absolute; left: -13px; width: 26px; height: 16px; background: var(--pointer); transition: transform .08s linear; }
  .marker i:first-child { top: -8px; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .marker i:last-child { bottom: -8px; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .marker.kick i:first-child { transform: translateX(-5px) rotate(-8deg); }
  .marker.kick i:last-child { transform: translateX(-5px) rotate(8deg); }
  /* 確定演出: 針が虹色に変わり続ける */
  .marker.rainbow i { background: #ff2d55; animation: pointer-hue .6s linear infinite; }
  @keyframes pointer-hue { to { filter: hue-rotate(360deg); } }
  .style-strip .queue { top: -12px; right: 0; }
  .style-strip .result { top: calc(var(--window-h, 150px) + 14px); }

  /* 当たりに画像があるときは、結果の左の面に画像を出す */
  .result .kicker.has-image { width: 96px; padding: 10px; }
  .result .kicker img { width: 100%; height: 100%; max-height: 76px; object-fit: contain; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="view wheel-view" id="wheelView" hidden><canvas></canvas></div>
  <div class="view strip-view" id="stripView" hidden>
    <div class="window">
      <div class="viewport"><div class="track"></div></div>
      <div class="marker"><i></i><i></i></div>
    </div>
  </div>
  <div class="spin-by chip" id="spinBy"></div>
  <div class="hint chip" id="hint"></div>
  <div class="queue chip" id="queue"><span>あと</span><span class="num" id="queueNum"></span><span>回</span></div>
  <div class="result" id="result">
    <div class="kicker" id="kicker"></div>
    <div class="body">
      <div class="label">結果</div>
      <div class="name" id="resultName"></div>
      <div class="by" id="resultBy"></div>
    </div>
  </div>
</div>
<script type="module">
  // 設定は config.yaml の roulettes。?ids=a,b で使うルーレットを絞り込める。
  // ギフトが届くと、条件に合うルーレットに切り替わって回る。
  import { loadRoulettes, startRoulettes } from './lib/roulette.js';
  import { createWheel } from './lib/roulette-wheel.js';
  import { createStrip } from './lib/roulette-strip.js';

  (async () => {
  const roulettes = await loadRoulettes();
  const stage = document.getElementById('stage');
  const views = {
    wheel: createWheel(document.getElementById('wheelView')),
    strip: createStrip(document.getElementById('stripView')),
  };

  startRoulettes({
    roulettes,
    views,
    onSwitch(r, style) {
      // 大きさ: URL の ?scale= があればそちらを優先
      const q = new URLSearchParams(location.search); // プレビューは枠に合わせて縮めるので倍率はかけない
      if (!q.get('scale') && q.get('preview') !== '1') document.documentElement.style.zoom = String(Number(r.scale) || 1);
      document.body.classList.toggle('style-wheel', style !== 'strip');
      document.body.classList.toggle('style-strip', style === 'strip');
      const win = document.querySelector('#stripView .window');
      stage.style.setProperty('--window-h', `${win.offsetHeight}px`);
      stage.classList.remove('swap');
      void stage.offsetWidth;
      stage.classList.add('swap');
    },
  });
  })();
</script>
</body>
</html>
