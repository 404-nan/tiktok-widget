<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギフトルーレット</title>
<link rel="stylesheet" href="lib/overlay.css">
<link rel="stylesheet" href="lib/roulette.css">
<style>
  body { display: grid; place-items: center; }
  .wrap { position: relative; display: grid; justify-items: center; gap: 14px; }
  canvas { display: block; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .35)); }
  .result { top: 58%; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="wheel"></canvas>
  <div class="queue chip" id="queue"><span>あと</span><span class="num" id="queueNum"></span><span>回</span></div>
  <div class="hint chip" id="hint"></div>
  <div class="result" id="result">
    <div class="kicker" id="kicker"></div>
    <div class="body">
      <div class="label">結果</div>
      <div class="name" id="resultName"></div>
      <div class="by" id="resultBy"></div>
    </div>
  </div>
</div>
<script type="module">
  import { setupPage } from './lib/overlay.js';
  import { readParams, parseItems, startRoulette, tick } from './lib/roulette.js';

  setupPage();
  const p = readParams();
  const items = parseItems(p.items);

  const css = getComputedStyle(document.documentElement);
  const C = (name) => css.getPropertyValue(name).trim();
  const INK = C('--ink'), PAPER = C('--paper'), SIGNAL = C('--signal');
  const TAU = Math.PI * 2;
  const FONT = '"Zen Kaku Gothic New", "Hiragino Sans", sans-serif';

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  let size = 0;
  let rotation = 0;
  let pointerKick = 0; // 針がペグにはじかれた角度（ラジアン）

  function resize() {
    size = Math.floor(Math.max(160, Math.min(innerWidth, innerHeight - 70) - 12));
    const dpr = devicePixelRatio || 1;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = canvas.style.height = `${size}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    const c = size / 2;
    const rim = 14;
    const r = c - rim - 2;
    ctx.clearRect(0, 0, size, size);

    // 縁
    ctx.beginPath();
    ctx.arc(c, c, r + rim, 0, TAU);
    ctx.fillStyle = INK;
    ctx.fill();

    for (const it of items) {
      const a0 = it.start * TAU + rotation;
      const a1 = it.end * TAU + rotation;
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, a0, a1);
      ctx.closePath();
      ctx.fillStyle = it.fill;
      ctx.fill();

      // 文字は扇の中心線に沿って、外周側に右寄せ
      const mid = (a0 + a1) / 2;
      const arc = (it.end - it.start) * TAU * r * 0.6;
      const fontSize = Math.max(12, Math.min(r * 0.12, arc * 0.5));
      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(mid);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.font = `900 ${fontSize}px ${FONT}`;
      ctx.fillStyle = it.ink;
      ctx.fillText(fitText(it.name, r * 0.62), r - 18, 1);
      ctx.restore();
    }

    // 扇の境目の線とペグ
    for (const it of items) {
      const a = it.start * TAU + rotation;
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.lineTo(c + Math.cos(a) * r, c + Math.sin(a) * r);
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(c + Math.cos(a) * (r + rim / 2), c + Math.sin(a) * (r + rim / 2), 3.5, 0, TAU);
      ctx.fillStyle = PAPER;
      ctx.fill();
    }

    // 中心
    ctx.beginPath();
    ctx.arc(c, c, r * 0.13, 0, TAU);
    ctx.fillStyle = INK;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(c, c, r * 0.13 - 5, 0, TAU);
    ctx.strokeStyle = SIGNAL;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(c, c, 4, 0, TAU);
    ctx.fillStyle = PAPER;
    ctx.fill();

    // 針（上）。ペグに当たると少しはじかれる
    ctx.save();
    ctx.translate(c, 6);
    ctx.rotate(pointerKick);
    ctx.beginPath();
    ctx.moveTo(-15, 0);
    ctx.lineTo(15, 0);
    ctx.lineTo(0, 38);
    ctx.closePath();
    ctx.lineJoin = 'round';
    ctx.lineWidth = 4;
    ctx.strokeStyle = INK;
    ctx.stroke();
    ctx.fillStyle = SIGNAL;
    ctx.fill();
    ctx.restore();
  }

  function fitText(text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) return text;
    let t = text;
    while (t.length > 1 && ctx.measureText(`${t}…`).width > maxWidth) t = t.slice(0, -1);
    return `${t}…`;
  }

  const POINTER = -Math.PI / 2;
  const norm = (a) => ((a % TAU) + TAU) % TAU;
  const indexAtPointer = () => {
    const a = norm(POINTER - rotation) / TAU;
    return items.findIndex((it) => a >= it.start && a < it.end);
  };

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  async function spin(winner) {
    const land = (winner.start + (0.15 + Math.random() * 0.7) * (winner.end - winner.start)) * TAU;
    const turns = reduced ? 0 : 5 + Math.floor(Math.random() * 3);
    const from = rotation;
    const to = from + norm(POINTER - land - from) + turns * TAU;
    const duration = reduced ? 300 : p.duration * 1000;

    let lastIndex = indexAtPointer();
    await new Promise((resolve) => {
      const t0 = performance.now();
      let prev = t0;
      const frame = (now) => {
        const t = Math.min(1, (now - t0) / duration);
        rotation = from + (to - from) * (1 - Math.pow(1 - t, 4));
        const idx = indexAtPointer();
        if (idx !== lastIndex) {
          pointerKick = -0.32;
          tick(p);
        }
        lastIndex = idx;
        // はじかれた針はすぐ戻る
        pointerKick *= Math.pow(0.0005, (now - prev) / 1000);
        prev = now;
        draw();
        if (t < 1) requestAnimationFrame(frame);
        else resolve();
      };
      requestAnimationFrame(frame);
    });
    rotation = norm(rotation);
    pointerKick = 0;
    draw();
  }

  startRoulette({ p, items, spin, name: 'roulette' });

  addEventListener('resize', resize);
  resize();
  // 和文フォントは使う文字の分だけ読み込まれるので、項目の文字を指定して待ってから描き直す
  document.fonts.load(`900 24px ${FONT}`, items.map((it) => it.name).join('')).then(draw, draw);
</script>
</body>
</html>
