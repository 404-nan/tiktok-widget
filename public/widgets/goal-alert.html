<!-- Minecraft のゴール接近警報を表示する公開ウィジェット。距離はサーバー通知だけを使う。 -->
<!-- 外部素材を使わず、OBSで読めるES5とWebAudioだけで短い警報を出す。 -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ゴール接近警報</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { font-family: "Yu Gothic UI", "Meiryo", sans-serif; color: #F6F5F1; }
    #alert { position: absolute; top: 5%; left: 5%; min-width: 360px; padding: 18px 24px; background: #111113; border-left: 12px solid #3B82F6; opacity: 0; transform: translateY(-24px); }
    #alert.show { opacity: 1; transform: translateY(0); transition: opacity 120ms ease, transform 180ms ease; }
    #alert.warning { border-left-color: #FF4F1F; }
    #alert.final { border-left-color: #FFC53D; }
    #message { font-size: 30px; font-weight: 700; letter-spacing: .04em; }
    #distance { margin-top: 6px; font-size: 22px; color: #F6F5F1; }
    #alert.warning #message { animation: blink 500ms ease-in-out 2; }
    @keyframes blink { 50% { opacity: .3; } }
  </style>
</head>
<body>
  <div id="alert" aria-live="assertive"><div id="message"></div><div id="distance"></div></div>
  <script>
    (function () {
      'use strict';
      var box = document.getElementById('alert');
      var message = document.getElementById('message');
      var distance = document.getElementById('distance');
      var hideTimer = null;
      var audio = null;

      function sound(stage) {
        try {
          audio = audio || new (window.AudioContext || window.webkitAudioContext)();
          var oscillator = audio.createOscillator();
          var gain = audio.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.value = stage === 'warning' ? 520 : 180;
          gain.gain.setValueAtTime(0.0001, audio.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.08, audio.currentTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + 0.18);
          oscillator.connect(gain); gain.connect(audio.destination);
          oscillator.start(); oscillator.stop(audio.currentTime + 0.2);
        } catch (e) {}
      }

      function show(event) {
        var value = Number(event.distance);
        box.className = event.stage || '';
        message.textContent = event.message || (event.stage === 'final' ? '最終防衛ライン' : 'ゴール接近');
        distance.textContent = isFinite(value) ? '距離 ' + value + 'm' : '';
        box.className += ' show';
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () { box.className = event.stage || ''; }, Math.min(3000, Number(event.durationMs) || 3000));
        sound(event.stage);
      }

      function receive(event) {
        if (event.type === 'goalAlert') show(event);
        if (event.type === 'hello' && event.goalAlert && event.goalAlert.distance != null) show(event.goalAlert);
      }

      fetch('/api/minecraft/goal-alert').then(function (response) { return response.json(); }).then(function (state) {
        if (state && state.distance != null && state.stage && state.stage !== 'safe') show({ type: 'goalAlert', stage: state.stage, distance: state.distance, message: state.stage === 'final' ? '最終防衛ライン' : 'ゴールまで ' + state.distance + 'm' });
      }).catch(function () {});

      var socket = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
      socket.onmessage = function (event) { try { receive(JSON.parse(event.data)); } catch (e) {} };
    }());
  </script>
</body>
</html>
