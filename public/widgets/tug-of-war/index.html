<!doctype html>
<!-- 綱引きギフトバトル: 左右2チームがギフトで綱を引き合う様子を、綱・引く力・残り時間・ヒット演出・逆転・決着と MVP で見せる。 -->
<!-- 勝ち負けや力の計算はサーバー側（src/tug-of-war.js）。この画面は届いた状態をそのまま描くだけ。 -->
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>綱引きギフトバトル</title>
<link rel="stylesheet" href="lib/overlay.css">
<link rel="stylesheet" href="/vendor/fonts/zen-kaku-gothic-new/900.css">
<link rel="stylesheet" href="/vendor/fonts/dela-gothic-one/400.css">
<style>
  :root {
    /* チームの色。濃い・明るい色は JS が設定の色から作る（Chromium 103 には color-mix が無いため） */
    --left: #FF3B5C; --left-dark: #8f1a30; --left-deep: #5c1a28; --left-light: #ff8da1;
    --right: #2F8CFF; --right-dark: #164d91; --right-deep: #1a3660; --right-light: #8cc0ff;
    --display: "Dela Gothic One", "Zen Kaku Gothic New", sans-serif;
    --shift: 0px; /* 綱がどれだけ左右へ寄ったか（左が勝っているとマイナス） */
  }
  body { overflow: hidden; }
  #fit { position: fixed; left: 50%; top: 50%; width: 1080px; height: 560px; transform-origin: 50% 50%; }
  #board { position: absolute; inset: 0; color: #fff; font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 900; transition: opacity .4s; }
  body.hidden-board #board { opacity: 0; pointer-events: none; }
  body.preview.hidden-board #board { opacity: .5; }

  /* ── 上の段: チームの札と時計 ─────────────────────── */
  #top { position: absolute; left: 0; right: 0; top: 0; height: 150px; display: grid; grid-template-columns: 1fr 210px 1fr; align-items: center; gap: 0; }
  .team { position: relative; height: 118px; display: flex; flex-direction: column; justify-content: center; padding: 0 34px; overflow: hidden;
    box-shadow: 0 14px 34px rgba(0,0,0,.45); }
  .team.left { background: linear-gradient(100deg, var(--left) 0%, var(--left-dark) 100%);
    clip-path: polygon(0 0, 100% 0, calc(100% - 34px) 100%, 0 100%); border-radius: 18px 0 0 18px; align-items: flex-start; }
  .team.right { background: linear-gradient(260deg, var(--right) 0%, var(--right-dark) 100%);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 34px 100%); border-radius: 0 18px 18px 0; align-items: flex-end; text-align: right; }
  .team::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,.07) 0 14px, transparent 14px 28px); pointer-events: none; }
  .team .name { font-size: 30px; letter-spacing: .04em; text-shadow: 0 3px 0 rgba(0,0,0,.3); white-space: nowrap; max-width: 330px; overflow: hidden; text-overflow: ellipsis; }
  .team .row { display: flex; align-items: baseline; gap: 12px; }
  .team.right .row { flex-direction: row-reverse; }
  .team .power { font-family: var(--font-num); font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .team .unit { font-size: 18px; opacity: .85; }
  .team .members { font-size: 17px; opacity: .9; padding: 2px 10px; border-radius: 999px; background: rgba(0,0,0,.28); }
  .team.leading { animation: lead-glow 1.4s ease-in-out infinite alternate; }
  @keyframes lead-glow { from { filter: brightness(1); } to { filter: brightness(1.18); } }
  .team.bump { animation: bump .28s ease-out; }
  @keyframes bump { 0% { transform: scale(1.06); } 100% { transform: scale(1); } }

  #clock { position: relative; z-index: 3; justify-self: center; width: 176px; height: 176px; margin-top: 26px; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #2b2b34 0%, #111116 70%); border: 6px solid #fff;
    box-shadow: 0 0 0 6px rgba(0,0,0,.35), 0 18px 40px rgba(0,0,0,.55); display: grid; place-items: center; text-align: center; }
  #clock .label { position: absolute; top: 26px; left: 0; right: 0; font-size: 15px; letter-spacing: .18em; color: #ffd75e; }
  #clock .time { font-family: var(--font-num); font-size: 62px; font-weight: 700; line-height: 1; margin-top: 10px; font-variant-numeric: tabular-nums; }
  #clock .sub { position: absolute; bottom: 24px; left: 0; right: 0; font-size: 15px; color: rgba(255,255,255,.75); }
  #clock.entry .time { font-family: var(--display); font-size: 30px; font-weight: 400; line-height: 1.15; }
  #clock.low { border-color: #ff4b3a; animation: clock-pulse .5s ease-in-out infinite alternate; }
  #clock.low .time { color: #ff6b4a; }
  @keyframes clock-pulse { from { transform: scale(1); } to { transform: scale(1.07); } }
  #clock svg { position: absolute; inset: -6px; width: 176px; height: 176px; transform: rotate(-90deg); }
  #clock svg circle { fill: none; stroke: #ffd75e; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
  #clock.low svg circle { stroke: #ff4b3a; }

  /* ── 真ん中: 綱 ──────────────────────────────── */
  #arena { position: absolute; left: 0; right: 0; top: 196px; height: 170px; border-radius: 22px; overflow: hidden;
    background: linear-gradient(90deg, var(--left-deep) 0%, #121218 50%, var(--right-deep) 100%);
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.14), 0 16px 40px rgba(0,0,0,.5); }
  #arena::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 2px, transparent 2px 54px); }
  /* 勝っている側の陣地が光る */
  #glow { position: absolute; inset: 0; background: radial-gradient(ellipse at var(--glow-x, 50%) 50%, var(--glow-c, transparent) 0%, transparent 60%); opacity: .55; transition: all .6s var(--ease-out); }
  #center { position: absolute; left: 50%; top: 10px; bottom: 10px; width: 0; border-left: 4px dashed rgba(255,255,255,.6); }
  .ko { position: absolute; top: 0; bottom: 0; width: 6px; background: repeating-linear-gradient(180deg, #ffd75e 0 12px, #111 12px 24px); opacity: .9; display: none; }
  .ko.on { display: block; }
  .ko span { position: absolute; top: 6px; white-space: nowrap; font-size: 13px; color: #ffd75e; text-shadow: 0 2px 0 #000; }
  #koLeft { left: 12%; } #koLeft span { left: 10px; }
  #koRight { right: 12%; } #koRight span { right: 10px; }
  #ropeWrap { position: absolute; left: -40%; width: 180%; top: 66px; height: 38px; transform: translateX(var(--shift)); transition: transform .7s cubic-bezier(.2, 1.4, .4, 1); }
  #rope { position: absolute; inset: 0; border-radius: 19px;
    background: repeating-linear-gradient(115deg, #e9c98c 0 11px, #b98a4a 11px 19px, #8d6430 19px 22px);
    box-shadow: inset 0 6px 6px rgba(255,255,255,.35), inset 0 -8px 8px rgba(0,0,0,.4), 0 10px 18px rgba(0,0,0,.5); }
  #knot { position: absolute; left: 50%; top: -30px; width: 0; height: 0; }
  #knot .flag { position: absolute; left: -26px; top: 0; width: 52px; height: 74px;
    background: linear-gradient(180deg, #fff 0 46%, #ff2d55 46% 54%, #fff 54% 100%); border-radius: 6px; border: 3px solid #111;
    box-shadow: 0 6px 14px rgba(0,0,0,.5); transform-origin: 50% 0; animation: sway 1.6s ease-in-out infinite alternate; }
  #knot .flag::after { content: "★"; position: absolute; left: 0; right: 0; top: 14px; text-align: center; color: #ffcc00; font-size: 22px; text-shadow: 0 2px 0 #000; }
  @keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  #ropeWrap.tug-left { animation: tug-left .32s ease-out; }
  #ropeWrap.tug-right { animation: tug-right .32s ease-out; }
  @keyframes tug-left { 0% { transform: translateX(calc(var(--shift) - 26px)); } 100% { transform: translateX(var(--shift)); } }
  @keyframes tug-right { 0% { transform: translateX(calc(var(--shift) + 26px)); } 100% { transform: translateX(var(--shift)); } }
  /* 両端の引っ張り役（いちばん引いている人の顔） */
  .puller { position: absolute; top: 34px; width: 102px; height: 102px; border-radius: 50%; display: grid; place-items: center; z-index: 2;
    border: 5px solid #fff; box-shadow: 0 10px 24px rgba(0,0,0,.55); overflow: hidden; font-size: 40px; }
  .puller.left { left: 22px; background: var(--left); }
  .puller.right { right: 22px; background: var(--right); }
  .puller .avatar { --size: 92px; }
  .puller .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .puller.yank-left { animation: yank-left .3s ease-out; }
  .puller.yank-right { animation: yank-right .3s ease-out; }
  @keyframes yank-left { 0% { transform: translateX(-14px) rotate(-8deg); } 100% { transform: none; } }
  @keyframes yank-right { 0% { transform: translateX(14px) rotate(8deg); } 100% { transform: none; } }
  .crown { position: absolute; top: 6px; z-index: 3; filter: drop-shadow(0 3px 0 rgba(0,0,0,.5)); animation: crown-bob 1.2s ease-in-out infinite alternate; }
  .crown[hidden] { display: none; }
  .crown.left { left: 51px; } .crown.right { right: 51px; }
  @keyframes crown-bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  .combo { position: absolute; top: 120px; z-index: 4; font-family: var(--display); font-size: 30px; line-height: 1; color: #fff; opacity: 0;
    -webkit-text-stroke: 2px rgba(0,0,0,.55); text-shadow: 0 4px 0 rgba(0,0,0,.4); }
  .combo.left { left: 140px; } .combo.right { right: 140px; text-align: right; }
  .combo.on { animation: combo-pop .9s ease-out forwards; }
  .combo b { font-size: 48px; color: #ffe066; }
  @keyframes combo-pop { 0% { opacity: 0; transform: scale(1.8); } 15% { opacity: 1; transform: scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-10px); } }

  /* 力の割合のバー */
  #meter { position: absolute; left: 70px; right: 70px; top: 384px; height: 22px; border-radius: 11px; overflow: hidden; display: flex; background: #222;
    box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 8px 18px rgba(0,0,0,.45); }
  #meterLeft { background: linear-gradient(180deg, var(--left-light), var(--left)); transition: width .5s var(--ease-out); width: 50%; }
  #meterRight { flex: 1; background: linear-gradient(180deg, var(--right-light), var(--right)); }
  .pct { position: absolute; top: 382px; font-family: var(--font-num); font-size: 26px; font-weight: 700; text-shadow: 0 2px 0 rgba(0,0,0,.6); }
  #pctLeft { left: 0; width: 64px; text-align: right; } #pctRight { right: 0; width: 64px; }

  /* 下の段: 応援上位と参加の案内 */
  #bottom { position: absolute; left: 0; right: 0; top: 422px; height: 138px; display: grid; grid-template-columns: 1fr 300px 1fr; gap: 12px; }
  .tops { display: flex; flex-direction: column; gap: 6px; }
  .tops.right { align-items: flex-end; }
  .top { display: flex; align-items: center; gap: 8px; max-width: 360px; padding: 4px 12px 4px 4px; border-radius: 999px; background: rgba(10,10,14,.82);
    border: 2px solid var(--c); font-size: 18px; box-shadow: 0 6px 14px rgba(0,0,0,.35); }
  .tops.right .top { flex-direction: row-reverse; padding: 4px 4px 4px 12px; }
  .top .rank { font-family: var(--font-num); font-size: 20px; color: #ffd75e; width: 22px; text-align: center; }
  .top .avatar { --size: 30px; font-size: 14px; }
  .top .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; }
  .top .pw { font-family: var(--font-num); font-size: 22px; color: #ffd75e; }
  #guide { align-self: start; text-align: center; padding: 10px 12px; border-radius: 16px; background: rgba(10,10,14,.86); border: 2px solid rgba(255,255,255,.25);
    font-size: 17px; line-height: 1.5; box-shadow: 0 8px 20px rgba(0,0,0,.4); }
  #guide .k { display: inline-block; padding: 0 8px; margin: 0 2px; border-radius: 6px; color: #fff; }
  #guide .k.left { background: var(--left); } #guide .k.right { background: var(--right); }
  #guide .gift-note { color: #ffd75e; }
  #testTag { position: absolute; right: 8px; top: 4px; padding: 2px 10px; border-radius: 6px; background: rgba(0,0,0,.6); border: 1px dashed #fff; font-size: 13px; display: none; z-index: 9; }
  #testTag.on { display: block; }

  /* ── 演出の層 ─────────────────────────────── */
  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 20; overflow: visible; }
  .hit { position: absolute; top: 226px; display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 999px;
    background: rgba(12,12,16,.92); border: 3px solid var(--c); box-shadow: 0 10px 24px rgba(0,0,0,.5), 0 0 22px var(--c);
    font-size: 20px; white-space: nowrap; will-change: transform, opacity; }
  .hit.left { left: 130px; animation: hit-left 1.9s cubic-bezier(.16,1,.3,1) forwards; }
  .hit.right { right: 130px; flex-direction: row-reverse; padding: 6px 6px 6px 16px; animation: hit-right 1.9s cubic-bezier(.16,1,.3,1) forwards; }
  .hit .avatar { --size: 40px; font-size: 18px; }
  .hit .who { max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
  .hit .gift-visual { --size: 40px; }
  .hit .plus { font-family: var(--font-num); font-size: 34px; font-weight: 700; color: #ffe066; text-shadow: 0 2px 0 #000; }
  .hit.big { font-size: 24px; border-width: 4px; }
  .hit.big .plus { font-size: 46px; }
  .hit.mega { font-size: 26px; border-width: 5px; border-color: #ffe066; }
  .hit.mega .plus { font-size: 58px; }
  /* 札は自分の陣地から真ん中へ向かって飛び、綱の帯の中で消える（時計や上の札には重ねない） */
  @keyframes hit-left { 0% { opacity: 0; transform: translate(-80px, var(--dy)) scale(.6); } 12% { opacity: 1; transform: translate(0, var(--dy)) scale(1.08); }
    22% { transform: translate(0, var(--dy)) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(110px, calc(var(--dy) - 14px)) scale(.9); } }
  @keyframes hit-right { 0% { opacity: 0; transform: translate(80px, var(--dy)) scale(.6); } 12% { opacity: 1; transform: translate(0, var(--dy)) scale(1.08); }
    22% { transform: translate(0, var(--dy)) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-110px, calc(var(--dy) - 14px)) scale(.9); } }
  .spark { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c), 0 0 2px #fff;
    animation: spark .8s ease-out forwards; }
  @keyframes spark { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(.2); } }
  .shout { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-family: var(--display); font-size: 74px; line-height: 1.1; color: #fff;
    -webkit-text-stroke: 4px #111; text-shadow: 0 8px 0 rgba(0,0,0,.45); animation: shout 1.4s cubic-bezier(.2,1.3,.4,1) forwards; }
  .shout small { display: block; font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 900; font-size: 28px; -webkit-text-stroke: 0; }
  @keyframes shout { 0% { opacity: 0; transform: scale(2.4); } 18% { opacity: 1; transform: scale(1); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1); } }
  .flash { position: absolute; inset: -40px; background: radial-gradient(circle, rgba(255,255,255,.85), transparent 70%); animation: flash .5s ease-out forwards; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  #fit.shake { animation: shake .45s linear; }
  @keyframes shake { 0%,100% { margin-left: 0; } 20% { margin-left: -10px; margin-top: 4px; } 40% { margin-left: 9px; margin-top: -4px; } 60% { margin-left: -6px; } 80% { margin-left: 4px; margin-top: 2px; } }
  /* 逆転の帯 */
  .reverse { position: absolute; left: -10%; right: -10%; top: 196px; height: 170px; display: grid; place-items: center; z-index: 25;
    background: repeating-linear-gradient(115deg, var(--c) 0 40px, var(--cd) 40px 80px);
    border-top: 6px solid #fff; border-bottom: 6px solid #fff; animation: reverse 1.9s cubic-bezier(.7,0,.2,1) forwards; }
  .reverse div { font-family: var(--display); font-size: 96px; color: #fff; -webkit-text-stroke: 5px #111; text-shadow: 0 8px 0 rgba(0,0,0,.5); letter-spacing: .08em; }
  .reverse small { display: block; text-align: center; font-family: "Zen Kaku Gothic New", sans-serif; font-weight: 900; font-size: 30px; -webkit-text-stroke: 0; letter-spacing: 0; }
  @keyframes reverse { 0% { clip-path: inset(0 100% 0 0); } 18% { clip-path: inset(0 0 0 0); } 80% { clip-path: inset(0 0 0 0); opacity: 1; } 100% { clip-path: inset(0 0 0 100%); opacity: 1; } }
  /* 残り10秒の大きな数字 */
  #big { position: absolute; left: 0; right: 0; top: 168px; text-align: center; font-family: var(--font-num); font-weight: 700; font-size: 220px; line-height: 1;
    color: #fff; -webkit-text-stroke: 6px #ff3b2f; text-shadow: 0 10px 0 rgba(0,0,0,.4); opacity: 0; z-index: 22; pointer-events: none; }
  #big.tick { animation: big-tick .95s ease-out forwards; }
  @keyframes big-tick { 0% { opacity: .95; transform: scale(1.5); } 30% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(.85); } }

  /* 決着 */
  #result { position: absolute; left: 40px; right: 40px; top: 160px; height: 380px; z-index: 30; display: none; border-radius: 26px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 0%, var(--cd) 0%, #0d0d12 75%);
    border: 6px solid #ffe066; box-shadow: 0 0 0 6px rgba(0,0,0,.4), 0 30px 60px rgba(0,0,0,.6); text-align: center; }
  #result.on { display: block; animation: result-in .7s cubic-bezier(.2,1.3,.4,1); }
  @keyframes result-in { 0% { opacity: 0; transform: scale(.6) rotate(-3deg); } 100% { opacity: 1; transform: none; } }
  #result .rays { position: absolute; left: 50%; top: 50%; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; opacity: .18;
    background: repeating-conic-gradient(from 0deg, #fff 0 8deg, transparent 8deg 20deg); animation: spin 14s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #result .inner { position: relative; padding: 22px 30px; }
  #resultReason { display: inline-block; padding: 3px 16px; border-radius: 999px; background: rgba(0,0,0,.45); font-size: 20px; color: #ffe066; }
  #resultMain { margin-top: 8px; font-family: var(--display); font-size: 78px; line-height: 1.1; color: #fff; -webkit-text-stroke: 4px #111; text-shadow: 0 8px 0 rgba(0,0,0,.45); }
  #resultScore { margin-top: 4px; font-family: var(--font-num); font-size: 40px; font-weight: 700; }
  #resultScore .l { color: var(--left-light); } #resultScore .r { color: var(--right-light); }
  #resultScore .vs { font-size: 26px; margin: 0 14px; opacity: .8; }
  #mvp { margin: 14px auto 0; display: inline-flex; align-items: center; gap: 16px; padding: 10px 26px 10px 10px; border-radius: 999px;
    background: linear-gradient(180deg, #ffe58a, #f2b01e); color: #2a1a00; box-shadow: 0 10px 24px rgba(0,0,0,.45); }
  #mvp .avatar { --size: 68px; font-size: 28px; border: 4px solid #fff; }
  #mvp .badge { font-family: var(--display); font-size: 34px; letter-spacing: .06em; }
  #mvp .who { font-size: 30px; max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mvp .pw { font-family: var(--font-num); font-size: 30px; font-weight: 700; }
  .confetti { position: absolute; top: -20px; width: 12px; height: 20px; border-radius: 2px; z-index: 31; animation: confetti linear forwards; }
  @keyframes confetti { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--cx), 640px) rotate(var(--cr)); opacity: .9; } }

  @media (prefers-reduced-motion: reduce) { #ropeWrap { transition: none; } }
</style>
</head>
<body>
<div id="fit">
  <main id="board" aria-live="polite">
    <div id="testTag">テスト</div>
    <section id="top">
      <div class="team left" id="teamLeft"><div class="name"></div><div class="row"><span class="power">0</span><span class="unit">コイン</span><span class="members"></span></div></div>
      <div id="clock">
        <svg viewBox="0 0 176 176"><circle cx="88" cy="88" r="82" id="clockRing"></circle></svg>
        <div class="label">のこり</div><div class="time">--</div><div class="sub"></div>
      </div>
      <div class="team right" id="teamRight"><div class="name"></div><div class="row"><span class="power">0</span><span class="unit">コイン</span><span class="members"></span></div></div>
    </section>
    <section id="arena">
      <div id="glow"></div>
      <div id="center"></div>
      <div class="ko" id="koLeft"><span>大差で決着</span></div>
      <div class="ko" id="koRight"><span>大差で決着</span></div>
      <div id="ropeWrap"><div id="rope"></div><div id="knot"><div class="flag"></div></div></div>
      <div class="puller left" id="pullerLeft"></div>
      <div class="puller right" id="pullerRight"></div>
      <div class="crown left" id="crownLeft" hidden><svg viewBox="0 0 64 48" width="44" height="33" aria-hidden="true"><path d="M4 14l14 12L32 4l14 22 14-12-6 30H10z" fill="#ffd23f" stroke="#7a4a00" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="30" r="5" fill="#ff3b5c"/></svg></div>
      <div class="crown right" id="crownRight" hidden><svg viewBox="0 0 64 48" width="44" height="33" aria-hidden="true"><path d="M4 14l14 12L32 4l14 22 14-12-6 30H10z" fill="#ffd23f" stroke="#7a4a00" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="30" r="5" fill="#ff3b5c"/></svg></div>
      <div class="combo left" id="comboLeft"></div>
      <div class="combo right" id="comboRight"></div>
    </section>
    <div class="pct" id="pctLeft">50%</div>
    <div id="meter"><div id="meterLeft"></div><div id="meterRight"></div></div>
    <div class="pct" id="pctRight">50%</div>
    <section id="bottom">
      <div class="tops left" id="topsLeft"></div>
      <div id="guide"></div>
      <div class="tops right" id="topsRight"></div>
    </section>
    <div id="big"></div>
    <div id="result"><div class="rays"></div><div class="inner">
      <div id="resultReason"></div>
      <div id="resultMain"></div>
      <div id="resultScore"></div>
      <div id="mvpWrap"></div>
    </div></div>
  </main>
  <div id="fx"></div>
</div>
<script type="module">
  import { BASE, loadConfig, applyTheme, resolveColor, setupPage, setupSample, setSampleRenderer, applyPageBackground, applyBaseFont, connect, chime, fmt, avatarNode, giftNode, giftLabel } from './lib/overlay.js';

  const W = 1080;
  const H = 560;
  const $ = (id) => document.getElementById(id);
  const fit = $('fit');
  const fx = $('fx');
  const els = {
    left: { team: $('teamLeft'), puller: $('pullerLeft'), crown: $('crownLeft'), combo: $('comboLeft'), tops: $('topsLeft'), pct: $('pctLeft') },
    right: { team: $('teamRight'), puller: $('pullerRight'), crown: $('crownRight'), combo: $('comboRight'), tops: $('topsRight'), pct: $('pctRight') },
  };
  const clock = $('clock');
  const ring = $('clockRing');
  const RING = 2 * Math.PI * 82;
  ring.style.strokeDasharray = String(RING);

  // 配信ソフトの枠の大きさに合わせて、1080×560 の盤面をそのまま拡大・縮小する
  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H) || 1;
    fit.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  window.addEventListener('resize', resize);
  resize();

  const { config } = await loadConfig();
  applyTheme(config?.theme);
  setupPage();
  applyPageBackground(config?.tugOfWar);
  applyBaseFont(config, config?.tugOfWar);
  setupSample('tugOfWar');
  let settings = config?.tugOfWar ?? {};

  let current = null;     // 最後に受けた状態
  let clockTimer = null;
  let lastTickSecond = null;
  let spurtShown = false;
  let shownPower = { left: 0, right: 0 };

  const volume = () => Math.max(0, Math.min(1, Number(settings.volume ?? 0.4)));
  const soundOn = () => settings.sound !== false;
  function play(kind) { if (soundOn()) chime(kind, volume()); }

  // 太鼓のような「ドン」。開始と逆転で鳴らす（音源ファイルは使わない）
  let audio = null;
  function drum(times = 1) {
    if (!soundOn()) return;
    try {
      audio = audio || new AudioContext();
      for (let i = 0; i < times; i += 1) {
        const t = audio.currentTime + i * 0.16;
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(48, t + 0.25);
        gain.gain.setValueAtTime(volume() * 1.4, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
        osc.connect(gain).connect(audio.destination);
        osc.start(t);
        osc.stop(t + 0.4);
      }
    } catch { /* 自動再生が止められている環境では鳴らさない */ }
  }

  // 名前に「さん」をつける（もう敬称がついている名前には重ねない）
  const honorific = (name) => {
    const text = String(name ?? '').trim();
    return /(さん|さま|様|ちゃん|くん|君|氏)$/.test(text) ? text : `${text}さん`;
  };
  const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  const later = (el, ms) => setTimeout(() => el.remove(), ms);

  // 設定の色（#RRGGBB か accent などの名前）を RGB の数に直す。読めなければ fallback
  function rgbOf(value, fallback) {
    const c = String(resolveColor(value || '') || '').trim();
    const hex = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c);
    if (hex) {
      const h = hex[1].length === 3 ? hex[1].split('').map((x) => x + x).join('') : hex[1];
      return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
    }
    const rgb = c.match(/^rgba?\(([^)]+)\)/);
    if (rgb) return rgb[1].split(',').slice(0, 3).map((x) => Number(x.trim()) || 0);
    return fallback;
  }
  const mixRgb = (a, b, t) => `rgb(${a.map((x, i) => Math.round(x + (b[i] - x) * t)).join(', ')})`;

  function setColors(state) {
    const root = document.documentElement.style;
    for (const [side, fallback] of [['left', [255, 59, 92]], ['right', [47, 140, 255]]]) {
      const base = rgbOf(state[side].color, fallback);
      root.setProperty(`--${side}`, mixRgb(base, base, 0));
      root.setProperty(`--${side}-dark`, mixRgb(base, [0, 0, 0], 0.38));
      root.setProperty(`--${side}-deep`, mixRgb(base, [11, 11, 16], 0.5));
      root.setProperty(`--${side}-light`, mixRgb(base, [255, 255, 255], 0.38));
    }
  }

  // 綱の位置: 大差の決着があればその差で端まで、なければ力の割合で寄せる
  function ropeShift(state) {
    const l = state.left.power;
    const r = state.right.power;
    const diff = l - r;
    const max = W * 0.38;
    let ratio = 0;
    if (state.koLead > 0) ratio = Math.max(-1, Math.min(1, diff / state.koLead));
    else if (l + r > 0) ratio = diff / (l + r);
    return -ratio * max;
  }

  function renderPuller(side, state) {
    const top = state[side].top[0];
    const el = els[side].puller;
    const key = top ? `${top.user.id || top.user.name}|${top.user.avatar || ''}` : `name|${state[side].name}`;
    if (el.dataset.key === key) return;
    el.dataset.key = key;
    el.replaceChildren(top ? avatarNode(top.user, 92) : document.createTextNode(String(state[side].name || '').slice(0, 1)));
  }

  function renderTops(side, state) {
    const rows = state[side].top.map((row, i) => {
      const div = document.createElement('div');
      div.className = 'top';
      div.style.setProperty('--c', side === 'left' ? 'var(--left)' : 'var(--right)');
      const rank = document.createElement('span'); rank.className = 'rank'; rank.textContent = String(i + 1);
      const who = document.createElement('span'); who.className = 'who'; who.textContent = row.user.name;
      const pw = document.createElement('span'); pw.className = 'pw'; pw.textContent = fmt(row.power);
      div.append(rank, avatarNode(row.user, 30), who, pw);
      return div;
    });
    els[side].tops.replaceChildren(...rows);
  }

  function renderGuide(state) {
    const guide = $('guide');
    const word = (side) => {
      const span = document.createElement('span');
      span.className = `k ${side}`;
      span.textContent = state[side].words[0] ?? (side === 'left' ? '1' : '2');
      return span;
    };
    const line1 = document.createElement('div');
    line1.append('コメント ', word('left'), ' か ', word('right'), ' で参加！');
    const line2 = document.createElement('div');
    line2.className = 'gift-note';
    line2.textContent = state.phase === 'battle' ? 'ギフトで綱を引け！ 1コイン＝1' : 'ギフトのコインが引く力になるよ';
    guide.replaceChildren(line1, line2);
  }

  function renderPower(side, state) {
    const el = els[side].team.querySelector('.power');
    const to = state[side].power;
    const from = shownPower[side];
    shownPower[side] = to;
    if (from === to) { el.textContent = fmt(to); return; }
    const start = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - start) / 500);
      el.textContent = fmt(from + (to - from) * (1 - Math.pow(1 - t, 3)));
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function render(state) {
    current = state;
    if (!state) return;
    setColors(state);
    const idle = state.phase === 'idle';
    const hide = !state.enabled || (idle && state.idleMode === 'hide');
    document.body.classList.toggle('hidden-board', hide);
    window.__twIsIdle = () => idle || state.phase === 'result';
    $('testTag').classList.toggle('on', state.test === true && state.phase !== 'idle');
    for (const side of ['left', 'right']) {
      const t = state[side];
      const team = els[side].team;
      team.querySelector('.name').textContent = t.name;
      team.querySelector('.members').textContent = `${fmt(t.members)}人`;
      renderPower(side, state);
      team.classList.toggle('leading', state.phase === 'battle' && state.leader === side);
      els[side].crown.hidden = !(state.phase !== 'idle' && state.leader === side);
      renderPuller(side, state);
      renderTops(side, state);
    }
    const total = state.left.power + state.right.power;
    const leftPct = total > 0 ? Math.round(state.left.power / total * 100) : 50;
    $('meterLeft').style.width = `${leftPct}%`;
    els.left.pct.textContent = `${leftPct}%`;
    els.right.pct.textContent = `${100 - leftPct}%`;
    const shift = ropeShift(state);
    document.documentElement.style.setProperty('--shift', `${shift}px`);
    const glow = $('glow');
    glow.style.setProperty('--glow-x', state.leader === 'left' ? '12%' : state.leader === 'right' ? '88%' : '50%');
    glow.style.setProperty('--glow-c', state.leader ? (state.leader === 'left' ? 'var(--left)' : 'var(--right)') : 'transparent');
    $('koLeft').classList.toggle('on', state.koLead > 0);
    $('koRight').classList.toggle('on', state.koLead > 0);
    renderGuide(state);
    renderClock();
    renderResult(state);
  }

  function renderClock() {
    const state = current;
    if (clockTimer) { clearTimeout(clockTimer); clockTimer = null; }
    const time = clock.querySelector('.time');
    const label = clock.querySelector('.label');
    const sub = clock.querySelector('.sub');
    clock.classList.remove('entry', 'low');
    if (!state || state.phase !== 'battle') {
      ring.style.strokeDashoffset = '0';
      if (state?.phase === 'result') { label.textContent = ''; time.textContent = '決着'; clock.classList.add('entry'); sub.textContent = ''; }
      else { label.textContent = ''; time.textContent = '参加\n受付中'; time.style.whiteSpace = 'pre-line'; clock.classList.add('entry'); sub.textContent = 'まもなく開始'; }
      return;
    }
    time.style.whiteSpace = '';
    label.textContent = 'のこり';
    if (!state.endsAt) {
      time.textContent = '∞';
      sub.textContent = '';
      ring.style.strokeDashoffset = '0';
      return;
    }
    // サーバーとの時計のずれを、受けた時の now でならす
    const skew = (state.now || Date.now()) - (state.receivedAt || Date.now());
    const left = Math.max(0, state.endsAt - (Date.now() + skew));
    const secs = Math.ceil(left / 1000);
    time.textContent = secs >= 60 ? `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}` : String(secs);
    sub.textContent = '秒';
    if (secs >= 60) sub.textContent = '';
    const total = Math.max(1, (state.seconds || 1) * 1000);
    ring.style.strokeDashoffset = String(RING * (1 - left / total));
    clock.classList.toggle('low', secs <= 10);
    if (secs <= 30 && secs > 10 && !spurtShown && state.seconds > 40) { spurtShown = true; shout('ラストスパート！', '残り30秒'); drum(2); }
    if (secs <= 10 && secs > 0 && lastTickSecond !== secs) {
      lastTickSecond = secs;
      const big = $('big');
      big.textContent = String(secs);
      restart(big, 'tick');
      play('tick');
    }
    if (left > 0) clockTimer = setTimeout(renderClock, 200);
  }

  function shout(text, small) {
    const div = document.createElement('div');
    div.className = 'shout';
    div.textContent = text;
    if (small) { const s = document.createElement('small'); s.textContent = small; div.append(s); }
    fx.append(div);
    later(div, 1500);
  }

  function sparks(side, count) {
    const x = side === 'left' ? 150 : W - 150;
    const y = 280;
    for (let i = 0; i < count; i += 1) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.left = `${x}px`;
      s.style.top = `${y}px`;
      s.style.setProperty('--c', i % 3 === 0 ? '#ffe066' : side === 'left' ? 'var(--left)' : 'var(--right)');
      const angle = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 120;
      s.style.setProperty('--sx', `${Math.cos(angle) * dist}px`);
      s.style.setProperty('--sy', `${Math.sin(angle) * dist}px`);
      fx.append(s);
      later(s, 850);
    }
  }

  // ギフト1件ごとの演出。届いた分は全部出す（間引かない）
  function showHit(hit) {
    const side = hit.side;
    const power = Number(hit.power) || 0;
    const size = power >= 1000 ? 'mega' : power >= 100 ? 'big' : '';
    const div = document.createElement('div');
    div.className = `hit ${side} ${size}`;
    div.style.setProperty('--c', side === 'left' ? 'var(--left)' : 'var(--right)');
    div.style.setProperty('--dy', `${Math.round(Math.random() * 70 - 10)}px`);
    const who = document.createElement('span'); who.className = 'who'; who.textContent = hit.user?.name ?? '';
    const plus = document.createElement('span'); plus.className = 'plus'; plus.textContent = `+${fmt(power)}`;
    const parts = [avatarNode(hit.user, 40), who];
    if (hit.kind === 'gift' && hit.gift) {
      const g = giftNode(hit.gift, 40);
      g.title = giftLabel(hit.gift);
      parts.push(g);
      if ((hit.gift.count ?? 1) > 1) { const c = document.createElement('span'); c.textContent = `×${hit.gift.count}`; parts.push(c); }
    } else if (hit.kind === 'like') {
      const heart = document.createElement('span'); heart.textContent = `♥×${fmt(hit.likes ?? 0)}`; parts.push(heart);
    }
    parts.push(plus);
    div.append(...parts);
    fx.append(div);
    later(div, 2000);
    sparks(side, size === 'mega' ? 26 : size === 'big' ? 16 : 8);
    restart($('ropeWrap'), side === 'left' ? 'tug-left' : 'tug-right');
    restart(els[side].puller, side === 'left' ? 'yank-left' : 'yank-right');
    restart(els[side].team, 'bump');
    if (hit.combo >= 2) {
      const c = els[side].combo;
      c.replaceChildren();
      const b = document.createElement('b'); b.textContent = String(hit.combo);
      c.append(b, ' コンボ！');
      restart(c, 'on');
    }
    if (size === 'mega') {
      const f = document.createElement('div'); f.className = 'flash'; fx.append(f); later(f, 600);
      restart(fit, 'shake');
      // 逆転の帯と同時だと文字が重なるので、逆転したときは帯が抜けてから出す
      setTimeout(() => shout('超加勢！', `${honorific(hit.user?.name)} +${fmt(power)}`), hit.reversal ? 1900 : 0);
      drum(1);
    }
    if (hit.kind === 'gift') play(size ? 'gift' : 'tick');
    if (hit.reversal) showReversal(side);
  }

  function showReversal(side) {
    const div = document.createElement('div');
    div.className = 'reverse';
    div.style.setProperty('--c', side === 'left' ? 'var(--left)' : 'var(--right)');
    div.style.setProperty('--cd', side === 'left' ? 'var(--left-dark)' : 'var(--right-dark)');
    const inner = document.createElement('div');
    inner.textContent = '逆転！';
    const small = document.createElement('small');
    small.textContent = `${current?.[side]?.name ?? ''}がリード！`;
    inner.append(small);
    div.append(inner);
    fx.append(div);
    later(div, 2000);
    restart(fit, 'shake');
    drum(3);
  }

  function showStart() {
    spurtShown = false;
    lastTickSecond = null;
    shout('綱引き開始！', 'ギフトで綱を引け！');
    drum(2);
  }

  function confetti(color) {
    for (let i = 0; i < 70; i += 1) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = `${Math.random() * W}px`;
      c.style.background = [color, '#ffe066', '#ffffff'][i % 3];
      c.style.setProperty('--cx', `${(Math.random() - 0.5) * 240}px`);
      c.style.setProperty('--cr', `${Math.round(Math.random() * 900)}deg`);
      c.style.animationDuration = `${2.2 + Math.random() * 1.8}s`;
      c.style.animationDelay = `${Math.random() * 0.6}s`;
      fx.append(c);
      later(c, 4800);
    }
  }

  function renderResult(state, celebrate = false) {
    const box = $('result');
    if (state.phase !== 'result') { box.classList.remove('on'); return; }
    const win = state.winner;
    const color = win === 'left' ? 'var(--left)' : win === 'right' ? 'var(--right)' : '#888';
    box.style.setProperty('--c', color);
    box.style.setProperty('--cd', win === 'left' ? 'var(--left-dark)' : win === 'right' ? 'var(--right-dark)' : '#333');
    $('resultReason').textContent = state.reason === 'ko' ? '大差で決着！' : state.reason === 'timeout' ? 'タイムアップ！' : '試合終了！';
    $('resultMain').textContent = win === 'draw' ? '引き分け！' : `${state[win].name}の勝利！`;
    const score = $('resultScore');
    score.replaceChildren();
    const l = document.createElement('span'); l.className = 'l'; l.textContent = fmt(state.left.power);
    const vs = document.createElement('span'); vs.className = 'vs'; vs.textContent = 'VS';
    const r = document.createElement('span'); r.className = 'r'; r.textContent = fmt(state.right.power);
    score.append(l, vs, r);
    const wrap = $('mvpWrap');
    wrap.replaceChildren();
    if (state.mvp) {
      const mvp = document.createElement('div');
      mvp.id = 'mvp';
      const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = 'MVP';
      const who = document.createElement('span'); who.className = 'who'; who.textContent = honorific(state.mvp.user.name);
      const pw = document.createElement('span'); pw.className = 'pw'; pw.textContent = `${fmt(state.mvp.power)} コイン`;
      mvp.append(avatarNode(state.mvp.user, 68), badge, who, pw);
      wrap.append(mvp);
    }
    if (!box.classList.contains('on') || celebrate) restart(box, 'on');
    if (celebrate) {
      confetti(win === 'left' ? 'var(--left)' : win === 'right' ? 'var(--right)' : '#cccccc');
      play('win');
      drum(3);
    }
  }

  function showJoin(join) {
    // 参加はチームの札を光らせて知らせる（文字の札は出さず、人数の数字で見せる）
    if (!join) return;
    restart(els[join.side].team, 'bump');
  }

  function receive(msg) {
    const state = msg.state ? { ...msg.state, receivedAt: Date.now() } : current;
    if (!state) return;
    render(state);
    if (msg.event === 'start') showStart();
    else if (msg.event === 'hit' && msg.hit) showHit(msg.hit);
    else if (msg.event === 'join') showJoin(msg.join);
    else if (msg.event === 'result') renderResult(state, true);
  }

  // 見本（ダッシュボードの「見本を出す」）: 試合の途中の絵を、サーバーへ何も送らずに描く
  const sampleState = () => {
    const name = (n) => ({ id: n, name: n, avatar: null });
    return {
      enabled: true, phase: 'battle', title: '綱引きギフトバトル', test: false, seconds: 180, startedAt: Date.now() - 60000,
      endsAt: Date.now() + 120000, now: Date.now(), koLead: 0, idleMode: 'entry', leader: 'left', reversals: 2, winner: null, reason: null, mvp: null,
      left: { name: settings.leftName || '赤チーム', color: settings.leftColor || '#FF3B5C', words: settings.leftWords || ['1'], power: 1320, members: 18, combo: 3,
        top: [{ user: name('さくら'), power: 600, gifts: 4 }, { user: name('たろう'), power: 420, gifts: 9 }, { user: name('みお'), power: 300, gifts: 3 }] },
      right: { name: settings.rightName || '青チーム', color: settings.rightColor || '#2F8CFF', words: settings.rightWords || ['2'], power: 980, members: 15, combo: 0,
        top: [{ user: name('ゆうと'), power: 500, gifts: 2 }, { user: name('あかり'), power: 280, gifts: 6 }, { user: name('Ken'), power: 200, gifts: 1 }] },
    };
  };
  let real = null;
  setSampleRenderer((on) => {
    if (on) { real = current; render({ ...sampleState(), receivedAt: Date.now() }); }
    else if (real || current) render(real || current);
  });

  async function loadState() {
    try {
      const res = await fetch(`${BASE}/api/tug-of-war`);
      if (!res.ok) return;
      const data = await res.json();
      render({ ...data, receivedAt: Date.now() });
    } catch { /* サーバーにつながらないときは、前の絵のまま何も出さない */ }
  }

  await loadState();
  connect({
    tugOfWar(msg) { if (!window.__twSampleOn) receive(msg); else real = msg.state ? { ...msg.state, receivedAt: Date.now() } : real; },
    config(next) { settings = next?.tugOfWar ?? settings; },
    hello() { loadState(); },
  });
</script>
</body>
</html>
