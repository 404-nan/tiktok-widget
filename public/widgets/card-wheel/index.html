<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Card Wheel - Lycone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --indigo-void: #060a18;
      --indigo-deep: #0b1228;
      --gold-foil: #e5c372;
      --gold-bright: #f8e4a6;
      --ivory: #ece5d5;
      --card-w: clamp(140px, 38vw, 184px);
      --card-h: calc(var(--card-w) * 1.5);
      --card-radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Shippori Mincho', serif; background-color: transparent; }

    /* Background Modes */
    body.bg-transparent { background: transparent; }
    body.bg-chroma { background: var(--chroma-color, #00FF00); }
    body.bg-solid { background: var(--solid-color, #0B1030); }
    body.bg-image { background-color: var(--indigo-void); }

    .bg-backdrop {
      position: absolute; inset: 0; background-position: center; background-size: cover; opacity: 0.92; pointer-events: none; display: none;
    }
    body.bg-image .bg-backdrop { display: block; }
    body.bg-chroma #starfield, body.bg-transparent #starfield { display: none; }
    body.bg-chroma .center-aura, body.bg-chroma .astrolabe-halo { display: none; }

    #starfield { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

    .viewport { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: stretch; overflow: hidden; }

    .widget-shell {
      position: relative; z-index: 2; width: 100%; max-width: 500px; height: 100%; display: grid; grid-template-rows: auto 1fr auto;
      padding: max(14px, env(safe-area-inset-top)) 0 max(18px, env(safe-area-inset-bottom));
    }

    .header { position: relative; display: flex; flex-direction: column; align-items: center; padding: 6px 52px; text-align: center; z-index: 20; }
    .header-title {
      font-family: 'Cinzel', serif; font-size: clamp(16px, 4.3vw, 20px); font-weight: 600; letter-spacing: 0.26em;
      background: linear-gradient(180deg, #fff3c7 0%, #e6c373 55%, #bc903f 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.75));
    }

    .stage { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; overflow: visible; }
    .astrolabe-halo {
      position: absolute; left: 50%; top: 50%; width: clamp(290px, 84vw, 390px); height: clamp(290px, 84vw, 390px);
      transform: translate(-50%, -50%); pointer-events: none; z-index: 1; opacity: 0.6;
    }
    .center-aura {
      position: absolute; left: 50%; top: 50%; width: calc(var(--card-w) * 1.5); height: calc(var(--card-h) * 1.3);
      transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(ellipse, rgba(229, 195, 114, 0.15) 0%, transparent 70%);
      filter: blur(12px); pointer-events: none; z-index: 1; transition: 0.5s;
    }
    .stage.is-revealed .center-aura { transform: translate(-50%, -52%) scale(1.2); opacity: 1; }

    .pointer-top {
      position: absolute; left: 50%; top: calc(50% - var(--card-h) * 0.5 - 42px); transform: translateX(-50%);
      z-index: 140; pointer-events: none; display: flex; flex-direction: column; align-items: center; transition: 0.4s;
    }
    .stage.is-revealed .pointer-top { opacity: 0.2; transform: translateX(-50%) translateY(-10px); }
    .pawl-piv { filter: drop-shadow(0 0 8px rgba(229, 195, 114, 0.4)); transform-origin: 50% 6px; }

    .wheel-viewport { position: relative; width: 100%; height: calc(var(--card-h) + 100px); perspective: 1200px; z-index: 10; cursor: grab; }
    .wheel-slot { position: absolute; left: 50%; top: 50%; width: var(--card-w); height: var(--card-h); margin-left: calc(var(--card-w) * -0.5); margin-top: calc(var(--card-h) * -0.5); transform-style: preserve-3d; will-change: transform; }
    .card-3d { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; border-radius: var(--card-radius); }
    .card-face {
      position: absolute; inset: 0; border-radius: var(--card-radius); overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      background-color: var(--indigo-deep); border: 1.2px solid rgba(229, 195, 114, 0.5);
    }
    .card-face img { width: 100%; height: 100%; object-fit: cover; }
    .card-face.front { transform: rotateY(180deg); }

    .holo-layer { position: absolute; inset: 0; border-radius: var(--card-radius); pointer-events: none; opacity: var(--holo-opacity, 0); }
    .holo-beam {
      mix-blend-mode: color-dodge;
      background: linear-gradient(var(--holo-angle, 118deg), transparent 0%, rgba(255, 250, 226, 0.8) var(--holo-pos, 50%), transparent 100%);
    }

    .footer-dock { position: relative; z-index: 30; display: flex; flex-direction: column; align-items: center; padding: 0 20px 10px; min-height: 180px; justify-content: flex-end; gap: 12px; }
    .reading-plaque {
      width: 100%; max-width: 400px; padding: 16px; border-radius: 12px; text-align: center;
      background: linear-gradient(180deg, rgba(14, 24, 52, 0.95), rgba(8, 13, 30, 0.98));
      border: 1px solid rgba(229, 195, 114, 0.5); box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      opacity: 0; transform: translateY(20px); transition: 0.6s cubic-bezier(0.22, 1, 0.36, 1); pointer-events: none;
    }
    .reading-plaque.is-visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .reading-user { font-size: 13px; color: var(--gold-bright); margin-bottom: 4px; letter-spacing: 0.1em; }
    .reading-kicker { font-family: 'Cinzel', serif; font-size: 17px; font-weight: 600; color: var(--gold-bright); letter-spacing: 0.1em; margin-bottom: 4px; }
    .reading-text { font-size: 13px; line-height: 1.6; color: var(--ivory); }

    .spin-btn {
      display: none; height: 48px; padding: 0 32px; border-radius: 24px; border: 1px solid var(--gold-foil);
      background: linear-gradient(180deg, #1a384e, #090f24); color: var(--gold-bright);
      font-family: 'Cinzel', serif; font-size: 13px; font-weight: 600; letter-spacing: 0.2em; cursor: pointer;
    }
    body.is-preview .spin-btn { display: inline-flex; align-items: center; }

    @media (prefers-reduced-motion: reduce) {
      .astrolabe-halo { animation: none !important; }
      .holo-layer { transition: none !important; }
    }
  </style>
</head>
<body class="bg-transparent">
  <div class="viewport">
    <div id="bgBackdrop" class="bg-backdrop"></div>
    <canvas id="starfield"></canvas>
    <main class="widget-shell">
      <header class="header"><h1 class="header-title">CARD WHEEL</h1></header>
      <section id="stage" class="stage">
        <div class="astrolabe-halo" id="astrolabe">
          <svg viewBox="0 0 400 400" fill="none"><circle cx="200" cy="200" r="180" stroke="#e5c372" stroke-opacity="0.2" stroke-width="1" /></svg>
        </div>
        <div class="center-aura"></div>
        <div class="pointer-top">
          <svg id="pawlSvg" width="38" height="36" viewBox="0 0 38 36">
            <path d="M19 10L25 19L19 32L13 19L19 10Z" fill="#e5c372" stroke="#fff" stroke-opacity="0.5" />
          </svg>
        </div>
        <div id="wheelViewport" class="wheel-viewport"></div>
      </section>
      <footer class="footer-dock">
        <article id="readingPlaque" class="reading-plaque">
          <div id="readingUser" class="reading-user"></div>
          <div id="readingTitle" class="reading-kicker"></div>
          <p id="readingText" class="reading-text"></p>
        </article>
        <button id="spinBtn" class="spin-btn">SPIN WHEEL</button>
      </footer>
    </main>
  </div>

<script type="module">
import { setupWidget, list, connect, giftNamed, createQueue } from './lib/overlay.js';

const FALLBACK_DECK = [
  { numeral: '0', title: 'THE FOOL', subtitle: '愚者', text: '恐れを手放し、新しい扉を開くとき。', image: 'card-00-fool.webp', weight: 1 },
  { numeral: 'I', title: 'THE MAGICIAN', subtitle: '魔術師', text: '創造の力はあなたの手にあります。', image: 'card-01-magician.webp', weight: 1 },
  { numeral: 'II', title: 'THE HIGH PRIESTESS', subtitle: '女教皇', text: '直感の声に耳を澄ませて。', image: 'card-02-high-priestess.webp', weight: 1 },
  { numeral: 'III', title: 'THE EMPRESS', subtitle: '女帝', text: '豊かさと愛が満ちる予感。', image: 'card-03-empress.webp', weight: 1 },
  { numeral: 'IV', title: 'THE EMPEROR', subtitle: '皇帝', text: '意志を貫き、基盤を築く。', image: 'card-04-emperor.webp', weight: 1 },
  { numeral: 'V', title: 'THE HIEROPHANT', subtitle: '教皇', text: '伝統と学びが助けとなります。', image: 'card-05-hierophant.webp', weight: 1 },
  { numeral: 'VI', title: 'THE LOVERS', subtitle: '恋人', text: '調和のとれた選択を。', image: 'card-06-lovers.webp', weight: 1 },
  { numeral: 'VII', title: 'THE CHARIOT', subtitle: '戦車', text: '勝利へ向かって邁進するとき。', image: 'card-07-chariot.webp', weight: 1 },
  { numeral: 'VIII', title: 'STRENGTH', subtitle: '力', text: '優しさこそが真の強さです。', image: 'card-08-strength.webp', weight: 1 },
  { numeral: 'IX', title: 'THE HERMIT', subtitle: '隠者', text: '内省の中に答えがあります。', image: 'card-09-hermit.webp', weight: 1 },
  { numeral: 'X', title: 'WHEEL OF FORTUNE', subtitle: '運命の輪', text: '幸運の転換期が訪れます。', image: 'card-10-wheel.webp', weight: 1 },
  { numeral: 'XI', title: 'JUSTICE', subtitle: '正義', text: '公正な判断が下されるでしょう。', image: 'card-11-justice.webp', weight: 1 },
  { numeral: 'XII', title: 'THE HANGED MAN', subtitle: '吊るされた男', text: '視点を変えれば光が見えます。', image: 'card-12-hanged-man.webp', weight: 1 },
  { numeral: 'XIII', title: 'DEATH', subtitle: '死神', text: '終わりは新たな始まり。', image: 'card-13-death.webp', weight: 1 },
  { numeral: 'XIV', title: 'TEMPERANCE', subtitle: '節制', text: '絶妙なバランスが成功の鍵。', image: 'card-14-temperance.webp', weight: 1 },
  { numeral: 'XV', title: 'THE DEVIL', subtitle: '悪魔', text: '囚われから抜け出す勇気を。', image: 'card-15-devil.webp', weight: 1 },
  { numeral: 'XVI', title: 'THE TOWER', subtitle: '塔', text: '劇的な変化が真実を暴く。', image: 'card-16-tower.webp', weight: 1 },
  { numeral: 'XVII', title: 'THE STAR', subtitle: '星', text: '希望の光があなたを導きます。', image: 'card-17-star.webp', weight: 1 },
  { numeral: 'XVIII', title: 'THE MOON', subtitle: '月', text: '迷いも想像力の糧になります。', image: 'card-18-moon.webp', weight: 1 },
  { numeral: 'XIX', title: 'THE SUN', subtitle: '太陽', text: '明るい祝福と成功が届きます。', image: 'card-19-sun.webp', weight: 1 },
  { numeral: 'XX', title: 'JUDGEMENT', subtitle: '審判', text: '覚醒と再生の時を迎えました。', image: 'card-20-judgement.webp', weight: 1 },
  { numeral: 'XXI', title: 'THE WORLD', subtitle: '世界', text: '完全なる調和と完成の瞬間。', image: 'card-21-world.webp', weight: 1 }
];

const p = await setupWidget('cardWheel', {
  events: ['gift'], gifts: [], minCoins: 1,
  background: 'transparent', chromaColor: '#00FF00', solidColor: '#0B1030',
  backgroundImage: '', cardBackImage: '',
  deck: [], spinSeconds: 4.5, showSeconds: 6, sound: true, volume: 0.3,
});

const isPreview = new URLSearchParams(location.search).has('preview');
if (isPreview) document.body.classList.add('is-preview');

const asset = (src, def) => {
  const s = src || def;
  if (!s) return '';
  return (s.includes('/') || s.startsWith('http')) ? s : `card-wheel/assets/${s}`;
};

let liveDeck = p.deck.length ? p.deck : FALLBACK_DECK;
let liveBack = asset(p.cardBackImage, 'card-back.webp');
let liveBg = asset(p.backgroundImage, 'bg-celestial.webp');

// 背景の適用（クラスは足し引きで変える。is-preview などを消さない）
const applyBackground = () => {
  document.body.classList.remove('bg-transparent', 'bg-chroma', 'bg-solid', 'bg-image');
  document.body.classList.add(`bg-${p.background}`);
  if (p.background === 'chroma') document.body.style.setProperty('--chroma-color', p.chromaColor);
  if (p.background === 'solid') document.body.style.setProperty('--solid-color', p.solidColor);
  if (p.background === 'image') document.getElementById('bgBackdrop').style.backgroundImage = `url(${liveBg})`;
};
applyBackground();

// Audio Engine
class AudioEngine {
  constructor() { this.ctx = null; this.lastTick = 0; }
  unlock() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); }
  playTick() {
    if (!p.sound || !this.ctx) return;
    const now = this.ctx.currentTime;
    if (now - this.lastTick < 0.05) return;
    this.lastTick = now;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.03);
    g.gain.setValueAtTime(p.volume * 0.5, now); g.gain.exponentialRampToValueAtTime(0.01, now + 0.03);
    osc.connect(g); g.connect(this.ctx.destination); osc.start(); osc.stop(now + 0.03);
  }
}
const audio = new AudioEngine();

// UI Elements
const viewport = document.getElementById('wheelViewport');
const stage = document.getElementById('stage');
const plaque = document.getElementById('readingPlaque');
const pawl = document.getElementById('pawlSvg');
let busy = false;
window.__twIsIdle = () => !busy;

// ホイールの組み立て（deck や裏面が変わったら作り直す）
let slotCount = 0;
const slots = [];
const buildWheel = () => {
  viewport.innerHTML = '';
  slots.length = 0;
  slotCount = Math.max(liveDeck.length, 12);
  for (let i = 0; i < slotCount; i++) {
    const c = liveDeck[i % liveDeck.length];
    const el = document.createElement('div');
    el.className = 'wheel-slot';
    el.innerHTML = `<div class="card-3d">
    <div class="card-face back"><img src="${liveBack}"></div>
    <div class="card-face front"><img src="${asset(c.image, 'card-00-fool.webp')}"><div class="holo-layer holo-beam"></div></div>
  </div>`;
    viewport.appendChild(el);
    slots.push({ el, card3d: el.querySelector('.card-3d'), holo: el.querySelector('.holo-beam') });
  }
};
buildWheel();

let wheelPos = 0;
let lastTickIdx = 0;
let pawlAngle = 0;
let reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const updateWheel = (now) => {
  const currentIdx = Math.round(wheelPos);
  if (currentIdx !== lastTickIdx) {
    audio.playTick();
    pawlAngle = (currentIdx > lastTickIdx ? -20 : 20);
    lastTickIdx = currentIdx;
  }
  pawlAngle *= 0.85;
  pawl.style.transform = `rotate(${pawlAngle}deg)`;

  const radiusX = Math.min(viewport.clientWidth * 0.5, 250);
  for (let i = 0; i < slotCount; i++) {
    let d = i - wheelPos;
    while (d > slotCount / 2) d -= slotCount;
    while (d < -slotCount / 2) d += slotCount;
    const absD = Math.abs(d);
    const opacity = absD > 3 ? Math.max(0, 1 - (absD - 3)) : 1;
    const scale = 0.4 + 0.6 / (1 + 0.6 * d * d);
    const x = Math.sin(d * 0.4) * radiusX;
    const z = Math.round(100 - absD * 20);
    slots[i].el.style.transform = `translate3d(${x}px, 0, 0) scale(${scale})`;
    slots[i].el.style.opacity = opacity;
    slots[i].el.style.zIndex = z;
  }
  requestAnimationFrame(updateWheel);
};
requestAnimationFrame(updateWheel);

const pickIndex = () => {
  const weights = liveDeck.map(c => Number(c.weight || 0));
  const total = weights.reduce((a, b) => a + b, 0);
  if (total <= 0) return Math.floor(Math.random() * liveDeck.length);
  let r = Math.random() * total;
  for (let i = 0; i < liveDeck.length; i++) {
    if (r < weights[i]) return i;
    r -= weights[i];
  }
  return 0;
};

async function run(e) {
  busy = true;
  audio.unlock();
  const targetIdx = pickIndex();
  const card = liveDeck[targetIdx];
  const spinTime = reducedMotion ? 1 : p.spinSeconds * 1000;
  const showTime = p.showSeconds * 1000;

  // Clear UI
  plaque.classList.remove('is-visible');
  stage.classList.remove('is-revealed');
  slots.forEach(s => { s.card3d.style.transform = ''; s.holo.style.setProperty('--holo-opacity', 0); });

  // Spin
  const startPos = wheelPos;
  const spins = 3 + Math.floor(Math.random() * 2);
  const endPos = Math.round(wheelPos / slotCount) * slotCount + spins * slotCount + targetIdx;
  const startTime = performance.now();

  await new Promise(res => {
    function animate(now) {
      const elapsed = now - startTime;
      const t = Math.min(1, elapsed / spinTime);
      const ease = 1 - Math.pow(1 - t, 4);
      wheelPos = startPos + (endPos - startPos) * ease;
      if (t < 1) requestAnimationFrame(animate); else res();
    }
    requestAnimationFrame(animate);
  });

  // Flip
  const targetSlot = slots[targetIdx];
  const flipDur = reducedMotion ? 400 : 1000;
  stage.classList.add('is-revealed');
  targetSlot.el.style.zIndex = 500;
  
  await new Promise(res => {
    targetSlot.card3d.style.transition = `transform ${flipDur}ms cubic-bezier(0.22, 1, 0.36, 1)`;
    targetSlot.card3d.style.transform = `rotateY(180deg) scale(1.15) translateZ(50px)`;
    setTimeout(res, flipDur);
  });

  // Show Plaque
  document.getElementById('readingUser').textContent = e.user?.name ? `${e.user.name} さん` : '';
  document.getElementById('readingTitle').textContent = `${card.numeral} · ${card.title}${card.subtitle ? ` ― ${card.subtitle}` : ''}`;

  document.getElementById('readingText').textContent = card.text;
  plaque.classList.add('is-visible');

  // Holo Shine
  if (!reducedMotion) {
    targetSlot.holo.style.setProperty('--holo-opacity', 0.8);
    let hPos = 0;
    const holoAnimate = () => {
      if (!busy) return;
      hPos = (hPos + 2) % 200;
      targetSlot.holo.style.setProperty('--holo-pos', `${hPos - 50}%`);
      requestAnimationFrame(holoAnimate);
    };
    holoAnimate();
  }

  await new Promise(res => setTimeout(res, showTime));

  // Close
  plaque.classList.remove('is-visible');
  targetSlot.card3d.style.transform = '';
  stage.classList.remove('is-revealed');
  await new Promise(res => setTimeout(res, 600));
  busy = false;
  if (pendingRebuild) { pendingRebuild = false; applyDeck(); }
}

let pendingRebuild = false;
const applyDeck = () => {
  liveDeck = p.deck.length ? p.deck : FALLBACK_DECK;
  liveBack = asset(p.cardBackImage, 'card-back.webp');
  liveBg = asset(p.backgroundImage, 'bg-celestial.webp');
  buildWheel();
  applyBackground();
};

// 設定が変わったら開いている画面へ即反映する（背景と音はすぐ、deck は待機中に差し替え）
window.addEventListener('tw-config-change', (e) => {
  const next = e.detail?.config?.cardWheel?.[window.__twWidgetId];
  if (!next) return;
  Object.assign(p, next);
  applyBackground();
  if (!busy) applyDeck(); else pendingRebuild = true;
});

const queue = createQueue(run, { max: 30 });
connect({
  event(e) {
    if (!list(p.events).includes(e.kind)) return;
    if (e.kind === 'gift') {
      if ((e.totalDiamonds ?? 0) < p.minCoins) return;
      if (list(p.gifts).length && !giftNamed(e.gift, list(p.gifts))) return;
    }
    queue.push(e);
  },
});

if (isPreview) {
  document.getElementById('spinBtn').onclick = () => queue.push({ kind: 'preview', user: { name: 'プレビュー' } });
  // ドラッグでホイールを動かす（プレビューだけの操作）
  let dragX = null; let dragPos = 0;
  viewport.addEventListener('pointerdown', (ev) => { if (busy) return; dragX = ev.clientX; dragPos = wheelPos; viewport.setPointerCapture(ev.pointerId); });
  viewport.addEventListener('pointermove', (ev) => { if (dragX == null) return; wheelPos = dragPos + (ev.clientX - dragX) / 45; });
  viewport.addEventListener('pointerup', () => { dragX = null; });
  viewport.addEventListener('pointercancel', () => { dragX = null; });
}

// Starfield Logic
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let w, h;
const stars = [];
const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
window.onresize = resize; resize();
for (let i = 0; i < 50; i++) stars.push({ x: Math.random() * 2000, y: Math.random() * 2000, r: Math.random() * 1.5, o: Math.random() });
const drawStars = () => {
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = "#e5c372";
  stars.forEach(s => {
    s.o = (s.o + 0.01) % 1;
    ctx.globalAlpha = Math.abs(Math.sin(s.o * Math.PI)) * 0.5;
    ctx.beginPath(); ctx.arc((s.x % w), (s.y % h), s.r, 0, Math.PI * 2); ctx.fill();
  });
  requestAnimationFrame(drawStars);
};
drawStars();
</script>
</body>
</html>
