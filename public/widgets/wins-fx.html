<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIN数の全画面演出</title>
<link rel="stylesheet" href="lib/overlay.css">
<link rel="stylesheet" href="/vendor/fonts/dela-gothic-one/400.css">
<style>
  /* WIN数の全画面演出。配信画面いっぱいに重ねる。
     一度に大きく減ったとき: 大妨害（ひび）→ 超妨害（全面のひび・サイレン・赤い警報）→ 壊滅（暗転して止まり、ガラスが割れて落ちる）。
     0 を割ったときは、画面の上下に「マイナス突入」の危険の帯が流れる */
  html, body { width: 100%; height: 100%; }
  .stage { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  canvas.glass { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* 赤い警報: 画面の縁が赤く脈打つ */
  .alarm { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 20, 20, .55) 100%); }
  .alarm.on { animation: alarm .7s ease-in-out infinite; }
  @keyframes alarm { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }

  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .flash.go { animation: flash .35s ease-out; }
  @keyframes flash { 0% { opacity: .9; } 40% { opacity: .4; background: #FF2A2A; } 100% { opacity: 0; } }

  /* 壊滅の前の暗転（フリーズ） */
  .freeze { position: absolute; inset: 0; background: #000; opacity: 0; display: grid; place-items: center; transition: opacity .2s linear; }
  .freeze.on { opacity: .94; }
  .freeze span { font-family: var(--font-num); color: rgba(255, 255, 255, .45); font-size: 28px; letter-spacing: .4em; }

  /* 真ん中の文字: 段階の札 → WIN -100 → 送った人 */
  .center { position: absolute; left: 50%; top: 46%; width: 0; height: 0; }
  .label {
    position: absolute;
    left: 0;
    bottom: calc(var(--fs, 160px) * .62);
    transform: translateX(-50%) rotate(-6deg) scale(2.4);
    padding: 10px 34px 12px;
    background: #111113;
    color: #FFC53D;
    border: 8px solid transparent;
    border-image: repeating-linear-gradient(-45deg, #FFC53D 0 14px, #111113 14px 28px) 8;
    font-family: "Dela Gothic One", var(--font);
    font-size: calc(var(--fs, 160px) * .42);
    line-height: 1;
    white-space: nowrap;
    opacity: 0;
  }
  .word {
    position: absolute;
    left: 0;
    top: 0;
    font-family: "Dela Gothic One", var(--font);
    font-size: var(--fs, 160px);
    line-height: 1;
    white-space: nowrap;
    transform: translate(-50%, -50%) rotate(-6deg) skewX(-8deg) scale(3);
    opacity: 0;
  }
  .word span { display: block; }
  .word .back { color: #111; -webkit-text-stroke: calc(var(--fs) * .16) #111; text-shadow: calc(var(--fs) * .04) calc(var(--fs) * .07) 0 #111, calc(var(--fs) * .08) calc(var(--fs) * .14) 0 rgba(0, 0, 0, .6); }
  .word .mid { position: absolute; inset: 0; color: #fff; -webkit-text-stroke: calc(var(--fs) * .07) #fff; }
  .word .front { position: absolute; inset: 0; background: linear-gradient(180deg, #FF6A4A, #FF1A1A 55%, #A80000); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .who {
    position: absolute;
    left: 0;
    top: calc(var(--fs, 160px) * .7);
    transform: translateX(-50%) rotate(-6deg);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 26px 10px 12px;
    background: #111113;
    border-left: 10px solid #FF2A2A;
    color: #F6F5F1;
    font-weight: 900;
    font-size: calc(var(--fs, 160px) * .2);
    white-space: nowrap;
    clip-path: inset(0 100% 0 0);
  }
  .who:empty { display: none; }
  .who .av { width: 1.6em; height: 1.6em; border-radius: 50%; object-fit: cover; background: #333; display: grid; place-items: center; font-style: normal; flex: none; }
  .who b { color: #FF4F1F; }

  .go .label { opacity: 1; transform: translateX(-50%) rotate(-6deg); transition: transform .14s cubic-bezier(.5, 0, .9, .6), opacity .05s linear; }
  .go .word { opacity: 1; transform: translate(-50%, -50%) rotate(-6deg) skewX(-8deg); transition: transform .14s cubic-bezier(.5, 0, .9, .6) .12s, opacity .05s linear .12s; }
  .go .who { clip-path: inset(0 0 0 0); transition: clip-path .3s var(--ease-wipe) .4s; }
  .out .label, .out .word, .out .who { opacity: 0; transition: opacity .35s linear; }

  /* マイナス突入: 画面の上下に危険の帯が流れる */
  .band {
    position: absolute;
    left: -10%;
    right: -10%;
    height: 9vh;
    display: flex;
    align-items: center;
    overflow: hidden;
    background: #111113;
    border-top: 1.2vh solid transparent;
    border-bottom: 1.2vh solid transparent;
    border-image: repeating-linear-gradient(-45deg, #FFC53D 0 18px, #111113 18px 36px) 12;
    transform: scaleY(0);
    transition: transform .25s var(--ease-wipe);
  }
  .band.top { top: 6vh; transform-origin: top; rotate: -3deg; }
  .band.bottom { bottom: 8vh; transform-origin: bottom; rotate: -3deg; }
  .bands.on .band { transform: none; }
  .band .run { display: flex; white-space: nowrap; animation: run 3s linear infinite; }
  .band.bottom .run { animation-direction: reverse; }
  .band .run span { font-family: "Dela Gothic One", var(--font); font-size: 5vh; line-height: 1; color: #FF2A2A; padding: 0 3vh; }
  @keyframes run { to { transform: translateX(-50%); } }
  /* マイナスの間ずっと: 画面の縁が赤く脈打つ（深いほど強く速く） */
  .ambient { position: absolute; inset: 0; opacity: 0; transition: opacity .8s linear; background: radial-gradient(ellipse at center, transparent 55%, rgba(255, 20, 20, var(--amb-a, .35)) 100%); }
  .ambient.on { opacity: 1; animation: breathe var(--amb-s, 2.4s) ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { filter: brightness(.6); } 50% { filter: brightness(1.2); } }

  /* お祝い（目標達成・マイナス脱出・リーチ）: 金の放射、金の文字、紙吹雪 */
  canvas.confetti { position: absolute; inset: 0; width: 100%; height: 100%; }
  .rays {
    position: absolute;
    left: 50%;
    top: 46%;
    width: 170vmax;
    height: 170vmax;
    margin: -85vmax 0 0 -85vmax;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255, 210, 90, .45) 0deg 6deg, transparent 6deg 16deg);
    -webkit-mask: radial-gradient(closest-side, #000 12%, transparent 100%);
    mask: radial-gradient(closest-side, #000 12%, transparent 100%);
    opacity: 0;
    transform: scale(0);
  }
  .rays.on { opacity: 1; transform: scale(1); transition: transform .45s var(--ease-out), opacity .1s linear; animation: spin 8s linear infinite; }
  .rays.off { opacity: 0; transition: opacity .6s linear; }
  @keyframes spin { from { rotate: 0deg; } to { rotate: 360deg; } }
  .center.gold .word .front { background: linear-gradient(180deg, #FFF6C8, #FFC53D 55%, #C98A00); -webkit-background-clip: text; background-clip: text; }
  .center.gold .label { background: #FFC53D; color: #111113; border-image: none; border: 6px solid #fff; }
  .center.gold .who { border-left-color: #FFC53D; }
  .center.gold .who b { color: #FFC53D; }
  .label:empty { display: none; }
  .center.rainbow .word .front { background: linear-gradient(90deg, #FF3B5C, #FF9F1A, #FFE14D, #3DFF8A, #2EE6FF, #5B6BFF, #D04DFF, #FF3B5C); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; animation: rbslide .7s linear infinite; }
  @keyframes rbslide { to { background-position: 200% 0; } }
  .center.rainbow .who { border-left-color: #fff; }
  .center.blink .word { animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .who:has(.av:only-child) { padding: 8px; border-left: 0; border-radius: 50%; background: #fff; }
  .who .av:only-child { width: 2.4em; height: 2.4em; }
  .rays.rb { background: repeating-conic-gradient(from 0deg, rgba(255, 255, 255, .5) 0deg 6deg, transparent 6deg 16deg), conic-gradient(#FF3B5C, #FF9F1A, #FFE14D, #3DFF8A, #2EE6FF, #5B6BFF, #D04DFF, #FF3B5C); }
  .stage.pulse { animation: pulse .6s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pulse { 0% { scale: 1.06; } 100% { scale: 1; } }
  .ambient.reach { opacity: 1; --amb-a: .5; background: radial-gradient(ellipse at center, transparent 50%, rgba(255, 197, 61, .55) 100%); animation: breathe .6s ease-in-out infinite; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="ambient" id="ambient"></div>
  <div class="rays" id="rays"></div>
  <canvas class="glass" id="glass"></canvas>
  <canvas class="confetti" id="confetti"></canvas>
  <div class="alarm" id="alarm"></div>
  <div class="bands" id="bands">
    <div class="band top"><div class="run"></div></div>
    <div class="band bottom"><div class="run"></div></div>
  </div>
  <div class="center" id="center">
    <div class="label" id="label"></div>
    <div class="word" id="word"><span class="back"></span><span class="mid"></span><span class="front"></span></div>
    <div class="who" id="who"></div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="freeze" id="freeze"><span>・・・</span></div>
</div>
<script type="module">
  import { setupWidget, connect, fmt, sleep } from './lib/overlay.js';

  // 設定は config.yaml の wins.<id>（?id= がなければ default）。WIN数の板（wins.html）と同じ設定で動く
  const p = await setupWidget('wins', {
    sound: true, volume: 0.4, bigLossText: '大妨害', hugeLossText: '超妨害', ruinLossText: '壊滅', power: 1,
    goal: 0, minusAmbient: true, celebrate: true, winText: 'WIN!',
  });
  const id = window.__twWidgetId || 'default';
  const $ = (x) => document.getElementById(x);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const TIER_TEXT = ['', p.bigLossText, p.hugeLossText, p.ruinLossText];

  // --- 効果音（音源なしで合成） ---
  let ac;
  const audio = () => (ac ??= new AudioContext());
  const ok = (fn) => {
    if (!p.sound) return;
    try {
      fn(audio());
    } catch {}
  };
  const tone = (type, f0, f1, at, len, peak) =>
    ok((a) => {
      const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + len * 0.8);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak * p.volume, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g).connect(a.destination);
      o.start(t);
      o.stop(t + len + 0.05);
    });
  const noise = (seconds, type, freq, vol, at = 0) =>
    ok((a) => {
      const t = a.currentTime + at;
      const buf = a.createBuffer(1, a.sampleRate * seconds, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 2;
      const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      src.buffer = buf;
      f.type = type;
      f.frequency.value = freq;
      g.gain.value = vol * p.volume;
      src.connect(f).connect(g).connect(a.destination);
      src.start(t);
    });
  const SOUND = {
    // ガラスが割れる: 高いノイズと、ちりちりした破片の音
    glass(len = 0.6) {
      noise(len, 'highpass', 4200, 0.7);
      for (let i = 0; i < 10; i++) tone('triangle', rnd(2500, 6000), rnd(2500, 6000), rnd(0.05, len), 0.08, 0.12);
    },
    boom(size = 1) {
      tone('sine', 140, 28, 0, 0.6 + size * 0.4, 1.2);
      noise(0.5 + size * 0.3, 'lowpass', 900, 0.9);
    },
    siren(times = 4) {
      for (let i = 0; i < times; i++) {
        tone('square', 880, 880, i * 0.36, 0.17, 0.22);
        tone('square', 660, 660, i * 0.36 + 0.18, 0.17, 0.22);
      }
    },
    // キュイン
    kyuin() {
      for (const [f0, f1, d] of [[1400, 2800, 0], [2100, 4200, 0.02]]) tone('triangle', f0, f1, d, 1.1, 0.3);
      for (let i = 0; i < 6; i++) tone('triangle', 523 * 2 ** (i / 2.4), 523 * 2 ** (i / 2.4), i * 0.05, 0.3, 0.12);
    },
    // 壊滅: 落ちていく低いうなり
    drone() {
      tone('sawtooth', 220, 40, 0.1, 2.6, 0.35);
      tone('sawtooth', 225, 42, 0.1, 2.6, 0.25);
    },
  };

  // --- ガラスのひびと破片（canvas） ---
  const cv = $('glass');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 1.5);
    W = innerWidth;
    H = innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
  }
  addEventListener('resize', resize);
  resize();

  let webs = []; // { cx, cy, rays: [[{x,y}...]], rings, born, life, grow }
  let shards = []; // { pts, x, y, vx, vy, rot, vr, born }

  // 蜘蛛の巣のようなひび: 中心から放射状の線と、それをつなぐ輪
  function makeWeb(cx, cy, radius, rayCount, ringCount, life) {
    const rays = [];
    for (let i = 0; i < rayCount; i++) {
      const base = (i / rayCount) * Math.PI * 2 + rnd(-0.12, 0.12);
      const pts = [];
      const steps = 10;
      let a = base;
      for (let k = 0; k <= steps; k++) {
        a += rnd(-0.05, 0.05);
        const r = (k / steps) * radius * rnd(0.85, 1.1);
        pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, r });
      }
      rays.push(pts);
    }
    const rings = [];
    for (let k = 1; k <= ringCount; k++) rings.push(Math.round((10 * (k / (ringCount + 1)) ** 1.25)));
    const web = { cx, cy, radius, rays, rings, born: performance.now(), life, grow: 160 };
    webs.push(web);
    return web;
  }

  // 輪と放射線で区切られた破片を、いくつか落とす
  function dropShards(web, ratio) {
    const { rays, rings } = web;
    const cuts = [0, ...rings, 10];
    for (let i = 0; i < rays.length; i++) {
      const a = rays[i], b = rays[(i + 1) % rays.length];
      for (let k = 0; k < cuts.length - 1; k++) {
        if (Math.random() > ratio) continue;
        const k0 = cuts[k], k1 = cuts[k + 1];
        const pts = [a[k0], a[k1], b[k1], b[k0]];
        const cx = pts.reduce((s, q) => s + q.x, 0) / 4, cy = pts.reduce((s, q) => s + q.y, 0) / 4;
        shards.push({
          pts: pts.map((q) => ({ x: q.x - cx, y: q.y - cy })),
          x: cx,
          y: cy,
          vx: (cx - web.cx) * rnd(0.4, 1.2) + rnd(-60, 60),
          vy: rnd(-200, 40),
          rot: 0,
          vr: rnd(-3, 3),
          born: performance.now() + rnd(0, 200),
        });
      }
    }
  }

  function strokePath(pts, upto) {
    ctx.beginPath();
    pts.forEach((q, i) => {
      if (q.r > upto) return;
      i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y);
    });
    ctx.stroke();
  }

  let raf = null;
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    webs = webs.filter((w) => now - w.born < w.life);
    for (const w of webs) {
      const age = now - w.born;
      const upto = w.radius * Math.min(1, age / w.grow);
      const fade = Math.min(1, (w.life - age) / 900);
      ctx.lineJoin = 'round';
      for (const [style, width, alpha] of [['rgba(0,0,0,1)', 4.5, 0.45], ['rgba(255,255,255,1)', 1.6, 0.95]]) {
        ctx.strokeStyle = style;
        ctx.lineWidth = width;
        ctx.globalAlpha = alpha * fade;
        for (const ray of w.rays) strokePath(ray, upto);
        for (const k of w.rings) {
          ctx.beginPath();
          w.rays.forEach((ray, i) => {
            const q = ray[k];
            if (q.r > upto) return;
            i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y);
          });
          ctx.closePath();
          ctx.stroke();
        }
      }
      // 当たった所の白いくぼみ
      ctx.globalAlpha = 0.5 * fade;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(w.cx, w.cy, 10 + w.radius * 0.02, 0, Math.PI * 2);
      ctx.fill();
    }
    shards = shards.filter((s) => s.y < H + 200 && now - s.born < 4000);
    for (const s of shards) {
      if (now < s.born) continue;
      s.vy += 1400 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.rot += s.vr * dt;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.beginPath();
      s.pts.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)));
      ctx.closePath();
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(200, 220, 235, .16)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, .85)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    if (webs.length || shards.length) raf = requestAnimationFrame(frame);
    else raf = null;
  }
  const animate = () => {
    if (!raf) {
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }
  };

  // --- 文字 ---
  function fitWord(text) {
    const word = $('word');
    for (const s of word.children) s.textContent = text;
    let fs = Math.min(innerWidth * 0.2, innerHeight * 0.15);
    $('center').style.setProperty('--fs', `${fs}px`);
    const w = word.offsetWidth;
    const max = innerWidth * 0.86;
    if (w > max) {
      fs *= max / w;
      $('center').style.setProperty('--fs', `${fs}px`);
    }
  }

  function whoLine(by) {
    const el = $('who');
    el.replaceChildren();
    if (!by?.user) return;
    const av = by.user.avatar
      ? Object.assign(new Image(), { src: by.user.avatar, referrerPolicy: 'no-referrer', className: 'av', alt: '' })
      : Object.assign(document.createElement('i'), { className: 'av', textContent: (by.user.name ?? '?').slice(0, 1) });
    const name = document.createElement('span');
    name.textContent = by.user.name ?? '';
    const what = document.createElement('b');
    what.textContent = `${by.gift}${by.count > 1 ? ` ×${by.count}` : ''}`;
    el.append(av, name, ' の ', what);
  }

  async function shake(amp, seconds) {
    const el = $('stage');
    const end = performance.now() + seconds * 1000;
    while (performance.now() < end) {
      const k = (end - performance.now()) / (seconds * 1000);
      el.style.transform = `translate(${rnd(-amp, amp) * k}px, ${rnd(-amp, amp) * k}px)`;
      await sleep(30);
    }
    el.style.transform = '';
  }

  const restart = (el, cls) => {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  };

  function bands(on) {
    if (on) {
      for (const run of document.querySelectorAll('.band .run')) {
        run.replaceChildren(...Array.from({ length: 16 }, () => Object.assign(document.createElement('span'), { textContent: 'マイナス突入 ▼' })));
      }
    }
    $('bands').classList.toggle('on', on);
  }

  // --- 本体 ---
  async function play({ counter: c, prev, event }) {
    const delta = event?.delta ?? 0;
    if (delta >= 0 || event.kind === 'undo') return;
    if (!event.by && (event.kind === 'set' || event.kind === 'reset')) return;
    // 段階はサーバーが決める（減り方と連続妨害の多いほう。境目は設定の lossPreset）
    const tier = event.tier ?? 0;
    const k = p.power; // 演出の強さの倍率
    const entered = prev.wins >= 0 && c.wins < 0;
    if (!tier && !entered) return;

    // マイナス突入だけのとき: 上下の危険の帯とサイレン
    if (!tier) {
      bands(true);
      SOUND.siren(3);
      shake(10 * k, 0.5);
      await sleep(2600);
      bands(false);
      return;
    }

    const center = $('center');
    center.classList.remove('go', 'out', 'gold');
    $('label').textContent = [TIER_TEXT[tier], event.combo >= 2 ? `連続妨害 ×${event.combo}` : ''].filter(Boolean).join('　');
    fitWord(`WIN ${delta}`);
    whoLine(event.by);

    if (tier >= 3) {
      // 壊滅: 一瞬止まって、静かになってから
      $('freeze').classList.add('on');
      await sleep(1100);
      $('freeze').classList.remove('on');
    }
    restart($('flash'), 'go');
    void center.offsetWidth;
    center.classList.add('go');
    if (entered) bands(true);

    if (tier === 1) {
      makeWeb(rnd(W * 0.2, W * 0.8), rnd(H * 0.25, H * 0.7), Math.min(W, H) * 0.32 * Math.min(2, k), 14, 3, 2600);
      SOUND.boom(0.6);
      SOUND.glass(0.4);
      shake(14 * k, 0.5);
    } else if (tier === 2) {
      const web = makeWeb(W / 2, H * 0.46, Math.hypot(W, H) * 0.6, 22, 5, 4200);
      dropShards(web, Math.min(0.5, 0.12 * k));
      $('alarm').classList.add('on');
      SOUND.siren(5);
      SOUND.boom(1);
      SOUND.glass(0.8);
      shake(24 * k, 0.9);
    } else {
      const web = makeWeb(W / 2, H * 0.46, Math.hypot(W, H) * 0.7, 30, 6, 5200);
      makeWeb(rnd(W * 0.1, W * 0.3), rnd(H * 0.15, H * 0.35), Math.min(W, H) * 0.4, 16, 3, 5200);
      makeWeb(rnd(W * 0.7, W * 0.9), rnd(H * 0.6, H * 0.85), Math.min(W, H) * 0.4, 16, 3, 5200);
      setTimeout(() => dropShards(web, Math.min(0.9, 0.55 * k)), 700);
      $('alarm').classList.add('on');
      SOUND.boom(2);
      SOUND.glass(1.2);
      SOUND.drone();
      SOUND.siren(7);
      shake(36 * k, 1.6);
    }
    animate();
    await sleep(1400 + tier * 900);
    center.classList.add('out');
    await sleep(400);
    center.classList.remove('go', 'out');
    $('alarm').classList.remove('on');
    bands(false);
  }

  // --- マイナスの間の赤い縁（深さで強さが変わる） ---
  function ambient(c) {
    const el = $('ambient');
    const on = p.minusAmbient && c.wins < 0;
    el.classList.toggle('on', on);
    if (!on) return;
    const d = c.depth ?? 0;
    el.style.setProperty('--amb-a', String([0.25, 0.4, 0.55, 0.75][d]));
    el.style.setProperty('--amb-s', `${[2.6, 1.8, 1.2, 0.8][d]}s`);
  }

  // --- 紙吹雪 ---
  const cf = $('confetti');
  const cx2 = cf.getContext('2d');
  let bits = [];
  let cfRaf = null;
  const COLORS = ['#FFC53D', '#FFE38A', '#FFFFFF', '#FF4F1F', '#3DFF8A', '#2EE6FF', '#D04DFF'];
  function confetti(count) {
    cf.width = Math.round(innerWidth * dpr);
    cf.height = Math.round(innerHeight * dpr);
    for (let i = 0; i < count; i++) {
      bits.push({
        x: innerWidth / 2 + rnd(-60, 60),
        y: innerHeight * 0.46 + rnd(-40, 40),
        vx: rnd(-900, 900),
        vy: rnd(-1500, -300),
        w: rnd(8, 16),
        h: rnd(4, 9),
        rot: rnd(0, Math.PI),
        vr: rnd(-10, 10),
        flip: rnd(0, Math.PI * 2),
        color: COLORS[(Math.random() * COLORS.length) | 0],
        born: performance.now(),
      });
    }
    if (!cfRaf) {
      let prev = performance.now();
      const step = (now) => {
        const dt = Math.min(0.05, (now - prev) / 1000);
        prev = now;
        cx2.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx2.clearRect(0, 0, innerWidth, innerHeight);
        bits = bits.filter((b) => b.y < innerHeight + 40 && now - b.born < (b.round ? 1600 : 6000));
        for (const b of bits) {
          b.vx *= 1 - (b.round ? 2.4 : 1.6) * dt;
          b.vy = b.vy * (1 - (b.round ? 2.4 : 1.2) * dt) + (b.round ? 300 : 1500) * dt;
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          b.rot += b.vr * dt;
          b.flip += 9 * dt;
          cx2.save();
          cx2.translate(b.x, b.y);
          cx2.rotate(b.rot);
          if (b.round) cx2.globalAlpha = Math.max(0, 1 - (now - b.born) / 1600);
          else cx2.globalAlpha = 1;
          cx2.scale(1, b.round ? 1 : Math.cos(b.flip));
          cx2.fillStyle = b.color;
          if (b.round) {
            cx2.beginPath();
            cx2.arc(0, 0, b.w / 2, 0, Math.PI * 2);
            cx2.fill();
          } else cx2.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
          cx2.restore();
        }
        cfRaf = bits.length ? requestAnimationFrame(step) : null;
        if (!cfRaf) cx2.clearRect(0, 0, innerWidth, innerHeight);
      };
      cfRaf = requestAnimationFrame(step);
    }
  }

  // ファンファーレ: パッパラー
  function fanfare(big) {
    const notes = big ? [523, 523, 523, 659, 784, 1047] : [784, 1047];
    const at = big ? [0, 0.12, 0.24, 0.36, 0.5, 0.66] : [0, 0.14];
    notes.forEach((f, i) => {
      tone('sawtooth', f, f, at[i], 0.22, 0.18);
      tone('triangle', f * 2, f * 2, at[i], 0.25, 0.12);
    });
    const end = at.at(-1);
    for (const f of [523, 659, 784, 1047]) {
      tone('sawtooth', f, f, end, big ? 1.6 : 0.9, 0.08);
      tone('triangle', f * 2, f * 2, end, big ? 1.8 : 1, 0.06);
    }
    for (let i = 0; i < 8; i++) tone('sine', rnd(2000, 4200), rnd(2000, 4200), end + rnd(0, 0.8), 0.15, 0.08);
  }

  // --- 増えたとき: 文字は数字かひと言だけ。段階が上がるほど光・色・音で押す ---
  // 花火: 画面のあちこちで丸い光が弾ける
  function fireworks(bursts) {
    for (let b = 0; b < bursts; b++) {
      setTimeout(() => {
        const x = rnd(innerWidth * 0.15, innerWidth * 0.85), y = rnd(innerHeight * 0.12, innerHeight * 0.55);
        const hue = rnd(0, 360);
        for (let i = 0; i < 46; i++) {
          const a = (i / 46) * Math.PI * 2, v = rnd(380, 620);
          bits.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 6, h: 6, rot: 0, vr: 0, flip: 0, color: `hsl(${(hue + rnd(-30, 30)) % 360}, 100%, 66%)`, born: performance.now(), round: true });
        }
        tone('sine', 90, 40, 0, 0.35, 0.6);
        noise(0.4, 'highpass', 3000, 0.25);
        confetti(0);
      }, b * 260 + rnd(0, 120));
    }
  }

  // 白い閃光を数回（目に優しいように 1 秒に 3 回まで）
  async function strobe(times) {
    for (let i = 0; i < times; i++) {
      restart($('flash'), 'go');
      await sleep(340);
    }
  }

  // 増えたときの演出。style: 'gold'（大）/ 'rainbow'（超）/ 'peak'（最大・目標達成）/ 'reach'（リーチ）
  async function burst(word, by, style) {
    const center = $('center');
    center.classList.remove('go', 'out', 'gold', 'rainbow', 'blink');
    $('label').textContent = '';
    fitWord(word);
    avatarOnly(by);
    const k = p.power;
    if (style === 'reach') {
      // リーチ: 喜びではなく溜め。鼓動と点滅だけ
      center.classList.add('gold', 'blink');
      void center.offsetWidth;
      center.classList.add('go');
      $('ambient').classList.add('reach');
      for (const at of [0, 0.22, 0.8, 1.02, 1.6, 1.82]) tone('sine', 70, 55, at, 0.2, 1.3);
      await sleep(2400);
      $('ambient').classList.remove('reach');
    } else {
      if (style === 'peak') {
        $('freeze').classList.add('on');
        await sleep(1100);
        $('freeze').classList.remove('on');
        strobe(3);
      } else {
        restart($('flash'), 'go');
      }
      center.classList.add(style === 'gold' ? 'gold' : 'rainbow');
      const rays = $('rays');
      rays.classList.remove('off');
      rays.classList.toggle('rb', style !== 'gold');
      rays.classList.add('on');
      void center.offsetWidth;
      center.classList.add('go');
      if (style === 'gold') {
        confetti(60 * k);
        fanfare(false);
        shake(6 * k, 0.4);
      } else if (style === 'rainbow') {
        confetti(140 * k);
        SOUND.kyuin();
        restart($('stage'), 'pulse');
        shake(12 * k, 0.6);
      } else {
        confetti(220 * k);
        setTimeout(() => confetti(160 * k), 700);
        setTimeout(() => confetti(160 * k), 1500);
        fireworks(Math.round(6 * Math.min(2, k)));
        fanfare(true);
        SOUND.kyuin();
        restart($('stage'), 'pulse');
        shake(16 * k, 1);
      }
      await sleep({ gold: 1800, rainbow: 2600, peak: 4200 }[style]);
      rays.classList.add('off');
    }
    center.classList.add('out');
    await sleep(500);
    $('rays').classList.remove('on', 'off', 'rb');
    center.classList.remove('go', 'out', 'gold', 'rainbow', 'blink');
  }

  function avatarOnly(by) {
    const el = $('who');
    el.replaceChildren();
    if (!by?.user) return;
    el.append(
      by.user.avatar
        ? Object.assign(new Image(), { src: by.user.avatar, referrerPolicy: 'no-referrer', className: 'av', alt: '' })
        : Object.assign(document.createElement('i'), { className: 'av', textContent: (by.user.name ?? '?').slice(0, 1) }),
    );
  }

  async function onPlus({ counter: c, prev, event }) {
    if (!p.celebrate || event.kind === 'undo' || !(event.delta > 0)) return;
    if (!event.by && (event.kind === 'set' || event.kind === 'reset')) return;
    const n = c.wins;
    const tier = event.tier ?? 0;
    const word = event.kind === 'win' ? p.winText : `+${fmt(event.delta)}`;
    if (event.goal || (p.goal > 0 && prev.wins < p.goal && n >= p.goal)) return burst('CLEAR', event.by, 'peak');
    if (tier >= 3) return burst(word, event.by, 'peak');
    if (p.goal > 0 && n === p.goal - 1) return burst('リーチ', event.by, 'reach');
    if (tier >= 2) return burst(word, event.by, 'rainbow');
    if (prev.wins < 0 && n >= 0) return burst('脱出', event.by, 'gold');
    if (tier >= 1) return burst(word, event.by, 'gold');
  }

  // 連続妨害が途切れたとき: ×3 以上か、合計が大妨害以上なら全画面で結果を出す
  async function onComboEnd({ combo: k }) {
    if (k.n < 3 && k.tier < 1) return;
    const tier = Math.max(1, k.tier);
    const center = $('center');
    center.classList.remove('go', 'out', 'gold');
    $('label').textContent = `連続妨害 ×${k.n}`;
    fitWord(`合計 ${fmt(k.total)} WIN`);
    $('who').replaceChildren();
    restart($('flash'), 'go');
    void center.offsetWidth;
    center.classList.add('go');
    // ジャラララ…ドン
    const n = Math.min(18, k.n * 2);
    for (let i = 0; i < n; i++) tone('square', 1600 - i * 60, 1600 - i * 60, i * 0.05, 0.04, 0.15);
    await sleep(n * 50);
    makeWeb(W / 2, H * 0.46, Math.min(W, H) * (0.3 + tier * 0.18) * Math.min(2, p.power), 12 + tier * 6, 2 + tier, 2400 + tier * 600);
    animate();
    SOUND.boom(tier * 0.6);
    SOUND.glass(0.3 + tier * 0.2);
    if (tier >= 2) $('alarm').classList.add('on');
    shake((10 + tier * 8) * p.power, 0.5 + tier * 0.2);
    await sleep(1600 + tier * 500);
    center.classList.add('out');
    await sleep(400);
    center.classList.remove('go', 'out');
    $('alarm').classList.remove('on');
  }

  // 演出は順番に（続けて来ても重ならないように）
  let chain = Promise.resolve();
  const queue = (fn) => (chain = chain.then(fn).catch(() => {}));
  async function sync() {
    try {
      const all = await (await fetch('/api/wins')).json();
      if (all[id]) ambient(all[id]);
    } catch {}
  }
  await sync();
  connect({
    hello: sync,
    wins(msg) {
      if (msg.id !== id) return;
      ambient(msg.counter);
      queue(() => play(msg));
      queue(() => onPlus(msg));
    },
    winsCombo(msg) {
      if (msg.id !== id) return;
      queue(() => onComboEnd(msg));
    },
  });
</script>
</body>
