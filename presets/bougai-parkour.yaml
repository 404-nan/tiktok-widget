# 妨害マイクラ（アスレ）
#
# 公開されているアスレのマップ「Parkour Paradise 3」（Hielke 作・100 ステージ）を使う。
#   配布ページ: https://www.minecraftmaps.com/parkour-maps/parkour-paradise-3
#   （マップはこのリポジトリには入れない。配布ページから落として、サーバーの世界として置く）
# 5 ステージ進むごとに 1 WIN。妨害は「足場から落とす・操作を狂わせる」に寄せていて、マップは壊さない。
#
# マップを壊してもいい配信にするなら、いちばん下の「破壊あり」のルールの # を外す。
# そのときは配信の前に必ず世界のフォルダを丸ごとコピーしておく（壊れたら戻せるように）。
#
# 切り替え: 配信ページ（/stream/）で選ぶか、npm run tw -- preset apply bougai-parkour
# Minecraft のコマンドの対象は @a。配信者のほかに人がいるときは、配信者の名前に置き換える。

name: 妨害マイクラ（アスレ）
summary: Parkour Paradise 3 を 5 ステージ進むごとに 1 WIN。ギフトで落とされる
game: アスレ（Parkour Paradise 3・アドベンチャーモード）
clear: 5 ステージ進むごとに +1。1回も落ちずに 5 ステージ進めたら「ノーミス」でさらに +1
goal: 10 # 目標の WIN 数の初めの値（配信ページで配信ごとに変えられる）

buttons:
  - {label: 5ステージ クリア, action: win}
  - {label: ノーミス ボーナス, value: 1}

setup:
  - マップを配布ページから落とし、サーバーの世界のフォルダ（world）と入れ替えて起動する。マップの対応バージョンに合わせたサーバーを使う
  - 配信の前に、世界のフォルダを丸ごとコピーしておく
  - server.properties で enable-rcon=true・rcon.port・rcon.password を決め、設定画面の「Minecraft 連携」で接続を確かめる
  - 配信者はアドベンチャーモード（/gamemode adventure 名前）。ブロックを壊せなくなる
  - 敵は出さないので、難易度はピースフルでよい（妨害の効果は効く）
  - SuperStream のプロフィールは /ss profile start しない（演出が二重になる）
  - Universe と Lion は /kill でチェックポイントに戻す。マップのチェックポイントがどこに戻すかを先に1回試しておく

layout:
  - {widget: wins, x: 240, y: 60, w: 600, h: 200}
  - {widget: roulette, query: ids=bougai, show: spin, hold: 3, x: 240, y: 1180, w: 600, h: 680}
  - {widget: cutin, x: 0, y: 0, w: 1080, h: 1920}
  - {widget: rush, x: 0, y: 0, w: 1080, h: 1920}
  - {widget: wins-fx, x: 0, y: 0, w: 1080, h: 1920}

config:
  wins:
    default:
      title: WIN
      goal: 10
      negative: true
      lossPreset: custom # -10 で大妨害、-50 で超妨害、-100 で壊滅
      bigLoss: 10
      hugeLoss: 50
      ruinLoss: 100
      gainPreset: custom # +5 で大、+10 で超、+30 で最大
      bigGain: 5
      hugeGain: 10
      topGain: 30
      milestone: 5
      rules:
        - {gifts: [Universe, Lion], add: -100, perCount: false, text: 壊滅}
        - {gifts: [Galaxy], add: -10, text: 大妨害}
        - {gifts: [Doughnut], add: -1, text: 妨害成功}
        - {gifts: [Money Gun], add: 5, perCount: false, text: 救済}
        - {gifts: [Hand Hearts], add: 1, text: 救済}

  roulettes:
    bougai:
      name: 妨害ルーレット
      style: wheel
      gifts: [Corgi]
      duration: 5
      hold: 3
      items:
        - {label: 浮く, color: accent, weight: 2, commands: ["effect give @a levitation 2 1"]}
        - {label: 回れ右, weight: 2, commands: ["execute as @a at @s run tp @s ~ ~ ~ ~180 ~"]}
        - {label: ジャンプ狂い, weight: 2, commands: ["effect give @a jump_boost 15 3"]}
        - {label: ぐらぐら, commands: ["effect give @a nausea 15 0"]}
        - {label: 真っ暗, commands: ["effect give @a darkness 10 0"]}
        - {label: ゆっくり落ちる, color: gold, commands: ["effect give @a slow_falling 20 0"]}
        - {label: ハズレ, color: ink-2, weight: 2}
        - {label: RUSH, color: gold, weight: 0.5, rush: true}

  rush:
    enabled: true
    gifts: [Lion]
    enterCoins: 20000
    duration: 60
    extendMinCoins: 100
    extendSeconds: 5
    maxSeconds: 300

  # Minecraft で起きること（合ったルールは全部動く）。RCON の接続設定は変えない
  minecraft:
    forwardGifts: false
    rules:
      - name: フォローで応援の文字
        events: [follow]
        commands: ["title @a actionbar {\"text\":\"{user} さん フォローありがとう\",\"color\":\"white\"}"]
      - name: Rose でぐらぐら
        gifts: [Rose]
        commands: ["effect give @a nausea 6 0"]
      - name: TikTok で 90 度まわる
        gifts: [TikTok]
        commands: ["execute as @a at @s run tp @s ~ ~ ~ ~90 ~"]
      - name: GG で応援の文字
        gifts: [GG]
        commands: ["title @a actionbar {\"text\":\"{user} GG!\",\"color\":\"gold\"}"]
      - name: Finger Heart で目つぶし
        gifts: [Finger Heart]
        commands: ["effect give @a blindness 3 0"]
      - name: Perfume でジャンプが狂う
        gifts: [Perfume]
        commands: ["effect give @a jump_boost 10 2"]
      - name: Doughnut で回れ右と鈍足（WIN -1）
        gifts: [Doughnut]
        commands: ["execute as @a at @s run tp @s ~ ~ ~ ~180 ~", "effect give @a slowness 3 1"]
      - name: Hand Hearts で救済（WIN +1）
        gifts: [Hand Hearts]
        commands: ["effect give @a slow_falling 15 0", "title @a actionbar {\"text\":\"救済 {user}\",\"color\":\"gold\"}"]
      - name: Money Gun で大救済（WIN +5）
        gifts: [Money Gun]
        commands: ["effect give @a slow_falling 40 0", "effect give @a speed 40 0", "title @a subtitle {\"text\":\"{user}\"}", "title @a title {\"text\":\"救済\",\"color\":\"gold\"}"]
      - name: Galaxy で浮かされる（WIN -10）
        gifts: [Galaxy]
        commands: ["effect give @a levitation 3 1", "title @a subtitle {\"text\":\"{user}\"}", "title @a title {\"text\":\"WIN -10\",\"color\":\"red\"}"]
      - name: Lion でチェックポイントに戻る（WIN -100・RUSH 突入）
        gifts: [Lion]
        commands: ["kill @a", "title @a subtitle {\"text\":\"{user}\"}", "title @a title {\"text\":\"WIN -100\",\"color\":\"dark_red\"}"]
      - name: Universe でチェックポイントに戻る（WIN -100）
        gifts: [Universe]
        commands: ["kill @a", "title @a subtitle {\"text\":\"{user}\"}", "title @a title {\"text\":\"壊滅\",\"color\":\"dark_red\"}"]
      # 破壊あり（マップを壊してもいい配信だけ。# を外す）: Galaxy で足元を爆破
      # - name: Galaxy で足元を爆破（破壊あり）
      #   gifts: [Galaxy]
      #   commands: ["execute at @a run summon tnt ~ ~ ~ {fuse:40}"]
