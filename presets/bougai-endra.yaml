# 妨害マイクラ（エンドラ討伐）
#
# サバイバルの世界を1からはじめて、エンダードラゴンを倒したら 1 WIN。
# 視聴者はギフトで妨害（WIN が減る）か救済（WIN が増える）をする。
#
# 切り替え: 配信ページ（/stream/）で選ぶか、npm run tw -- preset apply bougai-endra
# config.yaml の wins・roulettes は丸ごと入れ替わり、rush と minecraft は下に書いた項目だけ入れ替わる。
# 切り替える前の config.yaml は data/backups/ に残る。
#
# Minecraft のコマンドの対象は @a（サーバーにいる全員）。配信者のほかに人がいるときは、
# @a を配信者の名前（例 tanaka123）に置き換える。

name: 妨害マイクラ（エンドラ討伐）
summary: サバイバルでエンダードラゴンを倒したら 1 WIN。ギフトで妨害と救済
game: サバイバル（ふつうの世界を1から）
clear: エンダードラゴンを倒したら +1。死なずに倒せたら「ノーデス」でさらに +1
goal: 3 # 目標の WIN 数の初めの値（配信ページで配信ごとに変えられる）

# 配信ページに出す WIN のボタン（+1・戻す・リセットはいつも出る）
buttons:
  - {label: クリア, action: win}
  - {label: ノーデス ボーナス, value: 1}

# 配信の前に Minecraft 側でやること
setup:
  - Minecraft への送り方を決める。レンタルサーバー（ポートが1つ）はパネルの API（minecraft の via: panel・panelUrl・panelServer・panelKey）、自分の PC は RCON（server.properties の enable-rcon=true・rcon.port・rcon.password）
  - 設定画面の「Minecraft 連携」で接続を確かめ、minecraft.enabled を true にする
  - SuperStream のプロフィールは /ss profile start しない（このひな形がギフトを受けて演出を送るので、両方動くと二重になる）
  - 難易度はノーマル以上（/difficulty normal）。ピースフルだと敵が出ない
  - 新しい世界ではじめる

# まとめ表示（/widgets/stage.html）に並べるウィジェット。配信画面 1080 × 1920 の中の位置（下にあるものほど上に重なる）
# show: spin は回っている間だけ出す（ルーレットがずっと画面に残らないように）
layout:
  - {widget: wins, x: 240, y: 60, w: 600, h: 200}
  - {widget: roulette, query: ids=bougai, show: spin, hold: 3, x: 240, y: 1180, w: 600, h: 680}
  - {widget: cutin, x: 0, y: 0, w: 1080, h: 1920}
  - {widget: rush, x: 0, y: 0, w: 1080, h: 1920}
  - {widget: wins-fx, x: 0, y: 0, w: 1080, h: 1920}

config:
  # WIN 数。ギフトで減るのは -1・-10・-100 の3段階（-100 より大きくは減らさない）
  wins:
    default:
      title: WIN
      goal: 3
      negative: true
      # 演出の境目: -10 で大妨害、-50 で超妨害、-100 で壊滅（連続妨害でも段階が上がる）
      lossPreset: custom
      bigLoss: 10
      hugeLoss: 50
      ruinLoss: 100
      # 増えたとき: +5 で大、+10 で超、+30 で最大（クリアはいつも「大」以上）
      gainPreset: custom
      bigGain: 5
      hugeGain: 10
      topGain: 30
      milestone: 0 # 目標が小さいので、5 ごとのお祝いはしない
      rules:
        - {gifts: [Universe, Lion], add: -100, perCount: false, text: 壊滅} # 何個送っても -100 まで
        - {gifts: [Galaxy], add: -10, text: 大妨害}
        - {gifts: [Doughnut], add: -1, text: 妨害成功}
        - {gifts: [Money Gun], add: 5, perCount: false, text: 救済}
        - {gifts: [Hand Hearts], add: 1, text: 救済}

  # 妨害ルーレット（Corgi で回る）。当たった項目のコマンドを結果が出たときに送る
  roulettes:
    bougai:
      name: 妨害ルーレット
      style: wheel
      gifts: [Corgi]
      duration: 5
      hold: 3
      items:
        - {label: クリーパー ×3, color: accent, commands: ["execute at @a run summon creeper ~3 ~ ~3", "execute at @a run summon creeper ~-3 ~ ~3", "execute at @a run summon creeper ~3 ~ ~-3"]}
        - {label: 雷, commands: ["execute at @a run summon lightning_bolt ~ ~ ~"]}
        - {label: 金床の雨, weight: 2, commands: ["execute at @a run summon falling_block ~ ~8 ~ {BlockState:{Name:\"minecraft:anvil\"},Time:1}", "execute at @a run summon falling_block ~1 ~10 ~ {BlockState:{Name:\"minecraft:anvil\"},Time:1}", "execute at @a run summon falling_block ~-1 ~12 ~ {BlockState:{Name:\"minecraft:anvil\"},Time:1}"]}
        - {label: クモの巣, weight: 2, commands: ["execute at @a run fill ~-1 ~ ~-1 ~1 ~1 ~1 cobweb replace air"]}
        - {label: 真っ暗, weight: 2, commands: ["effect give @a darkness 15 0", "effect give @a blindness 8 0"]}
        - {label: 金リンゴ, color: gold, commands: ["give @a golden_apple 2"]}
        - {label: ハズレ, color: ink-2, weight: 2}
        - {label: RUSH, color: gold, weight: 0.5, rush: true}

  # RUSH: Lion か 20000 コイン以上で突入。RUSH 中は 100 コイン以上のギフトで 5 秒ずつ延びる
  rush:
    enabled: true
    gifts: [Lion]
    enterCoins: 20000
    duration: 60
    extendMinCoins: 100
    extendSeconds: 5
    maxSeconds: 300

  # Minecraft で起きること（合ったルールは全部動く）。接続の設定（via・host・port・password・panelUrl など・enabled）は変えない
  minecraft:
    forwardGifts: false
    rules:
      - name: フォローで雷
        events: [follow]
        commands: ["execute at @a run summon lightning_bolt ~6 ~ ~6"]
      - name: Rose でゾンビ（送った人の名前つき）
        gifts: [Rose]
        perCount: true
        commands: ["execute at @a run summon zombie ~3 ~ ~3 {CustomName:\"{user}\",CustomNameVisible:1b}"]
      - name: TikTok でシルバーフィッシュ
        gifts: [TikTok]
        perCount: true
        commands: ["execute at @a run summon silverfish ~2 ~ ~2"]
      - name: GG で応援の文字
        gifts: [GG]
        commands: ["title @a actionbar {\"text\":\"{user} GG!\",\"color\":\"gold\"}"]
      - name: Finger Heart で目つぶし
        gifts: [Finger Heart]
        commands: ["effect give @a blindness 4 0"]
      - name: Perfume で空腹と鈍足
        gifts: [Perfume]
        commands: ["effect give @a hunger 15 2", "effect give @a slowness 10 1"]
      - name: Doughnut でクリーパー（WIN -1）
        gifts: [Doughnut]
        perCount: true
        commands: ["execute at @a run summon creeper ~3 ~ ~3 {CustomName:\"{user}\",CustomNameVisible:1b}"]
      - name: Hand Hearts で救済（WIN +1）
        gifts: [Hand Hearts]
        commands: ["effect give @a regeneration 10 1", "give @a golden_apple 1", "title @a actionbar {\"text\":\"救済 {user}\",\"color\":\"gold\"}"]
      - name: Money Gun で大救済（WIN +5）
        gifts: [Money Gun]
        commands: ["give @a golden_apple 3", "give @a ender_pearl 4", "give @a arrow 32", "effect give @a resistance 30 1", "title @a subtitle {\"text\":\"{user}\"}", "title @a title {\"text\":\"救済\",\"color\":\"gold\"}"]
      - name: Galaxy で TNT（WIN -10）
        gifts: [Galaxy]
        commands: ["execute at @a run summon tnt ~ ~ ~ {fuse:50}", "title @a subtitle {\"text\":\"{user}\"}", "title @a title {\"text\":\"WIN -10\",\"color\":\"red\"}"]
      - name: Lion でウォーデン（WIN -100・RUSH 突入）
        gifts: [Lion]
        commands: ["execute at @a run summon warden ~8 ~ ~8", "title @a subtitle {\"text\":\"{user}\"}", "title @a title {\"text\":\"WIN -100\",\"color\":\"dark_red\"}"]
      - name: Universe で持ち物ぜんぶ消える（WIN -100）
        gifts: [Universe]
        commands: ["clear @a", "title @a subtitle {\"text\":\"{user}\"}", "title @a title {\"text\":\"壊滅\",\"color\":\"dark_red\"}"]
