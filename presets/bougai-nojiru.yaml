# 妨害マイクラ（サバイバル・脳汁MAX）
#
# エンドラ討伐（bougai-endra.yaml）と同じギフトの割り当てに、パチンコの文法の演出を全部盛りにしたもの。
#   - 溜めてから放つ: WIN が大きく動くギフトは、ゲームの中で一瞬暗くしてから（darkness）タイトルと音を叩きつける
#   - 色で期待度: カットインは 10 コインから 青 → 50 緑 → 199 赤 → 999 金 → 10,000 虹（確定）。安いギフトでも連打で格上げ
#   - 段階的に上がる: 15 秒以内に続くと連続妨害・連続救済で段階が上がる。演出の境目は -3 / -10 / -30（+ も同じ）
#   - 主役は送った人: ギフト通知（アイコンと名前）と、ゲームの中のタイトルの下に送った人の名前
#   - RUSH に入りやすく: 5,000 コイン以上か Lion で突入。RUSH 中は 30 コイン以上で 3 秒ずつ延びる
#   - まれな裏切り: 運試し（Heart Me）に 1/50 くらいの「プレミア」（WIN +3 と RUSH）
#   - WIN が動くギフトはカットインを出さず（skipGifts）、WIN の全画面演出に任せる（大きな文字を 2 つ重ねない）
#   - ゲームの中: 花火・トーテムの光・ウィザーの声・雷の音・SuperStream の隕石と地震（SuperStream が入っているとき）
#
# 切り替え: 配信の準備（/stream/）で選ぶか、npm run tw -- preset apply bougai-nojiru
# Minecraft のコマンドの対象は @a（サーバーにいる全員）。配信者のほかに人がいるときは、配信者の名前に置き換える。

name: 妨害マイクラ（サバイバル・脳汁MAX）
summary: エンドラ討伐と同じギフトに、カットイン・RUSH・花火・隕石まで演出を全部盛り。エンドラを倒したら 1 WIN
game: サバイバル（ふつうの世界を1から）
clear: エンダードラゴンを倒したら +1。死なずに倒せたら「ノーデス」でさらに +1
goal: 3 # 目標の WIN 数の初めの値（配信の準備で配信ごとに変えられる）

buttons:
  - {label: クリア, action: win}
  - {label: ノーデス ボーナス, value: 1}

setup:
  - "Minecraft への送り方を決める。レンタルサーバー（ポートが1つ）はパネルの API（設定の minecraft で via を panel にして panelUrl・panelServer・panelKey を入れる）、自分の PC は RCON（server.properties の enable-rcon=true など）"
  - 設定画面の「Minecraft 連携」で接続を確かめ、minecraft.enabled を true にする
  - SuperStream のプロフィールは /ss profile start しない（このひな形がギフトを受けて演出を送るので、両方動くと二重になる）
  - 上の「Minecraft をこのゲームにする」を押す（新しい世界・サバイバル・難易度ノーマルで起動し直す）
  - SuperStream が入っていれば、WIN -30 で地震・WIN -100 で隕石も起きる（入っていなければ、その1行だけ何も起きない）
  - 配信の説明やピン留めに「ギフトで起きること」の表を出しておく（何で何が起きるか分かると投げやすい）

# まとめ表示（/widgets/stage.html）に並べるウィジェット。配信画面 1080 × 1920 の中の位置（下にあるものほど上に重なる）
# show: spin は回っている間だけ出す（ルーレットがずっと画面に残らないように）
layout:
  - {widget: wins, x: 240, y: 60, w: 600, h: 200}
  - {widget: gift-alert, x: 160, y: 380, w: 760, h: 200} # RUSH の帯（上）と重ならない高さ
  - {widget: roulette, show: spin, hold: 3, x: 90, y: 1160, w: 900, h: 700}
  - {widget: cutin, x: 0, y: 0, w: 1080, h: 1920}
  - {widget: rush, x: 0, y: 0, w: 1080, h: 1920}
  - {widget: wins-fx, x: 0, y: 0, w: 1080, h: 1920}

# 配信の準備の「Minecraft をこのゲームにする」で、サーバーをこのゲームに合わせる
#   パネル（minecraft.via: panel）なら、止める → 新しい世界にする → 起動 → コマンド。RCON ならコマンドだけ
#   allow-flight: 吹き飛ぶ・浮く妨害で「飛んでいる」とサーバーから追い出されないように
server:
  world: new # 毎回新しい世界（古い世界のフォルダは残るので、ディスクがいっぱいになったらパネルで消す）
  properties: {gamemode: survival, difficulty: normal, level-type: "minecraft:normal", generator-settings: "{}", generate-structures: true, allow-flight: true, spawn-protection: 0}
  commands: ["difficulty normal", "gamemode survival @a", "time set day", "weather clear"]

config:
  # WIN 数。99 コインから動く。+ と - は同じくらいの値段で対（-100 より大きくは動かない）
  wins:
    default:
      title: WIN
      goal: 3
      negative: true
      # 演出の境目を低めに: -3 で大妨害、-10 で超妨害、-30 で壊滅（連続妨害でも段階が上がる）
      lossPreset: custom
      bigLoss: 3
      hugeLoss: 10
      ruinLoss: 30
      gainPreset: custom # +3 で大、+10 で超、+30 で最大（クリアはいつも「大」以上）
      bigGain: 3
      hugeGain: 10
      topGain: 30
      comboUp: true
      power: 1.6 # 揺れ・ひび・ダメージの数字を大きく
      minusAmbient: true
      celebrate: true
      clearFx: true
      milestone: 0
      rules:
        - {gifts: [TikTok Universe, Pegasus], add: -100, perCount: false, text: 壊滅}
        - {gifts: [Flying Jets], add: -30, text: 超妨害}
        - {gifts: [Unicorn Fantasy], add: 30, text: 超救済}
        - {gifts: [Galaxy], add: -10, text: 大妨害}
        - {gifts: [Fireworks], add: 10, text: 大救済}
        - {gifts: [Money Gun], add: -5, text: 妨害}
        - {gifts: [DJ Glasses], add: 5, text: 救済}
        - {gifts: [Singing Mushroom], add: -1, text: 妨害成功}
        - {gifts: [Hand Heart], add: 1, text: 救済}

  # ガチャ（どれも /widgets/roulette.html の1つで、届いたギフトに合うものが回る）
  roulettes:
    unten:
      name: 運試し
      style: wheel
      gifts: [Heart Me] # 1 日 1 回だけ送れる 1 コインのギフト（7 人が使っている）
      duration: 3
      hold: 2
      items:
        - {label: プレミア, color: gold, weight: 0.12, wins: 3, rush: true, commands: ["execute as @a at @s run playsound minecraft:ui.toast.challenge_complete master @s ~ ~ ~ 1 1", "title @a title [{\"text\":\"プ\",\"color\":\"red\"},{\"text\":\"レ\",\"color\":\"gold\"},{\"text\":\"ミ\",\"color\":\"green\"},{\"text\":\"ア\",\"color\":\"aqua\"}]"]}
        - {label: 金リンゴ, color: gold, weight: 0.5, commands: ["give @a golden_apple 1"]}
        - {label: パン, commands: ["give @a bread 3"]}
        - {label: ゾンビ 2体, color: accent, commands: ["execute at @a run summon zombie ~3 ~ ~3", "execute at @a run summon zombie ~-3 ~ ~3"]}
        - {label: 鈍足, commands: ["effect give @a slowness 8 1"]}
        - {label: ハズレ, color: ink-2, weight: 2}
    bougai:
      name: 妨害ガチャ
      style: wheel
      gifts: [Corgi]
      duration: 5
      hold: 3
      items:
        - {label: クリーパー ×3, color: accent, commands: ["execute at @a run summon creeper ~3 ~ ~3", "execute at @a run summon creeper ~-3 ~ ~3", "execute at @a run summon creeper ~3 ~ ~-3"]}
        - {label: 金床の雨, weight: 2, commands: ["execute at @a run summon falling_block ~ ~8 ~ {BlockState:{Name:\"minecraft:anvil\"},Time:1}", "execute at @a run summon falling_block ~1 ~10 ~ {BlockState:{Name:\"minecraft:anvil\"},Time:1}", "execute at @a run summon falling_block ~-1 ~12 ~ {BlockState:{Name:\"minecraft:anvil\"},Time:1}"]}
        - {label: クモの巣, weight: 2, commands: ["execute at @a run fill ~-1 ~ ~-1 ~1 ~1 ~1 cobweb replace air"]}
        - {label: 真っ暗, weight: 2, commands: ["effect give @a darkness 15 0", "effect give @a blindness 8 0"]}
        - {label: ファントム, commands: ["execute at @a run summon phantom ~ ~6 ~", "execute at @a run summon phantom ~2 ~7 ~"]}
        - {label: ゾンビ ×5, commands: ["execute at @a run summon zombie ~3 ~ ~", "execute at @a run summon zombie ~-3 ~ ~", "execute at @a run summon zombie ~ ~ ~3", "execute at @a run summon zombie ~ ~ ~-3", "execute at @a run summon zombie ~3 ~ ~3"]}
        - {label: ハズレ, color: ink-2}
        - {label: RUSH, color: gold, weight: 1, rush: true}
    kyusai:
      name: 救済ガチャ
      style: wheel
      gifts: [Puppy Kisses]
      duration: 5
      hold: 3
      items:
        - {label: 金リンゴ ×2, color: gold, commands: ["give @a golden_apple 2"]}
        - {label: 鉄の装備, weight: 2, commands: ["give @a iron_helmet 1", "give @a iron_chestplate 1", "give @a iron_leggings 1", "give @a iron_boots 1"]}
        - {label: エンダーパール ×4, weight: 2, commands: ["give @a ender_pearl 4"]}
        - {label: 再生と耐性, weight: 2, commands: ["effect give @a regeneration 20 1", "effect give @a resistance 30 1"]}
        - {label: ステーキ, weight: 2, commands: ["give @a cooked_beef 16"]}
        - {label: ハズレ, color: ink-2}
    wingacha:
      fontScale: 1.8 # 数字を大きく
      name: WINガチャ
      style: strip
      gifts: [Travel with You] # 999 コイン。R ±3 / N ±5 / SR ±10 の形（芳野にいなさんの WIN ガチャ）
      duration: 6
      hold: 3
      items:
        - {label: "-3", color: ink-2, textColor: paper, weight: 3, wins: -3}
        - {label: "+3", color: paper, weight: 3, wins: 3}
        - {label: "-5", color: accent, weight: 2, wins: -5}
        - {label: "+5", color: accent, weight: 2, wins: 5}
        - {label: "-10", color: gold, weight: 1, wins: -10}
        - {label: "+10", color: gold, weight: 1, wins: 10}
        - {label: "-30", color: accent, textColor: paper, weight: 0.3, wins: -30}
        - {label: "+30", color: gold, weight: 0.3, wins: 30}
    oogacha:
      fontScale: 1.8 # 数字を大きく
      name: 大WINガチャ
      style: strip
      gifts: [Interstellar] # 10,000 コイン
      duration: 7
      hold: 3
      items:
        - {label: "-50", color: accent, wins: -50}
        - {label: "-30", color: ink-2, textColor: paper, wins: -30}
        - {label: "+30", color: paper, wins: 30}
        - {label: "+50", color: gold, wins: 50}
    unmei:
      fontScale: 1.8 # 数字を大きく
      name: 運命
      style: strip
      gifts: [Lion] # 29,999 コイン。±100 のどちらか（RUSH にも入る）
      duration: 8
      hold: 4
      items:
        - {label: "-100", color: accent, wins: -100}
        - {label: "+100", color: gold, wins: 100}

  # RUSH: Lion か 5,000 コイン以上で突入（入りやすく）。RUSH 中は 30 コイン以上のギフトで 3 秒ずつ延びる
  rush:
    enabled: true
    gifts: [Lion]
    enterCoins: 5000
    duration: 45
    extendMinCoins: 30
    extendSeconds: 3
    maxSeconds: 180

  # カットイン: 10 コインから。青 → 緑 → 赤（激アツ）→ 金 → 虹（確定・フリーズ）。連打の合計で格上げ
  # WIN が動くギフトは出さない（WIN の全画面演出があるので）
  cutins:
    default:
      minCoins: 10
      greenCoins: 50
      redCoins: 199
      goldCoins: 999
      rainbowCoins: 10000
      skipGifts: [Singing Mushroom, Hand Heart, Money Gun, DJ Glasses, Galaxy, Fireworks, Flying Jets, Unicorn Fantasy, Pegasus, TikTok Universe]
      blueText: チャンス
      greenText: チャンス!!
      redText: 激アツ
      goldText: 超激アツ
      rainbowText: 確定
      hold: 1.2
      shake: 1.4
      freeze: true
      lines: true

  # ギフト通知: 送った人のアイコンと名前（主役は送った人）。199 コインから金色
  alerts:
    default:
      events: [gift, follow]
      minCoins: 1
      bigCoins: 199
      position: top
      align: center

  # Minecraft で起きること（合ったルールは全部動く）。接続の設定（via・host・port・password・panelUrl など・enabled）は変えない
  minecraft:
    forwardGifts: false
    rules:
      # 無料（フォロー・いいね）
      - name: フォローで TNT
        events: [follow]
        commands: ["execute at @a run summon tnt ~3 ~ ~3 {fuse:80}"]
      - name: いいね 200 回ごとに TNT
        events: [like]
        everyLikes: 200
        commands: ["execute at @a run summon tnt ~-3 ~ ~3 {fuse:80}", "title @a actionbar {\"text\":\"いいね 200 TNT\",\"color\":\"red\"}"]
      # 1 コイン
      - name: Rose でゾンビ（送った人の名前つき）
        gifts: [Rose]
        perCount: true
        commands: ["execute at @a run summon zombie ~3 ~ ~3 {CustomName:\"{user}\",CustomNameVisible:1b}"]
      - name: TikTok で小救済（パンと回復）
        gifts: [TikTok]
        commands: ["give @a bread 2", "effect give @a instant_health 1 0"]
      - name: GG で俊足
        gifts: [GG]
        commands: ["effect give @a speed 10 1"]
      # 5 コイン
      - name: Finger Heart でぶっ飛び
        gifts: [Finger Heart]
        commands: ["execute as @a at @s run tp @s ~ ~6 ~"]
      - name: Hello Traveler で少し後ろへ
        gifts: [Hello Traveler]
        commands: ["execute as @a at @s run tp @s ^ ^ ^-5"]
      - name: Name shoutout で名前を呼んで回復
        gifts: [Name shoutout]
        commands: ["title @a actionbar {\"text\":\"{user} さん ありがとう\",\"color\":\"gold\"}", "effect give @a instant_health 1 0"]
      # 10 コイン
      - name: Nebaarukun でクリーパー（送った人の名前つき）
        gifts: [Nebaarukun]
        perCount: true
        commands: ["execute at @a run summon creeper ~3 ~ ~3 {CustomName:\"{user}\",CustomNameVisible:1b}"]
      - name: Udon-nou でエンダーマン ×3
        gifts: [Udon-nou]
        commands: ["execute at @a run summon enderman ~4 ~ ~", "execute at @a run summon enderman ~-4 ~ ~", "execute at @a run summon enderman ~ ~ ~4"]
      - name: Ice Lolly でガラスに閉じ込める
        gifts: [Ice Lolly]
        commands: ["execute at @a run fill ~-1 ~-1 ~-1 ~1 ~2 ~1 glass hollow"]
      - name: Friendship Necklace で回復
        gifts: [Friendship Necklace]
        commands: ["effect give @a instant_health 1 1"]
      # 20〜30 コイン
      - name: Perfume で中救済（金リンゴと再生）
        gifts: [Perfume]
        commands: ["give @a golden_apple 1", "effect give @a regeneration 10 1"]
      - name: Doughnut で TNT ×3
        gifts: [Doughnut]
        perCount: true
        commands: ["execute as @a at @s run playsound minecraft:entity.creeper.primed master @s ~ ~ ~ 1 0.8", "execute at @a run summon tnt ~2 ~ ~ {fuse:40}", "execute at @a run summon tnt ~-2 ~ ~ {fuse:60}", "execute at @a run summon tnt ~ ~ ~2 {fuse:80}"]
      # 50〜199 コイン
      - name: Genius でスケルトン ×3
        gifts: [Genius]
        commands: ["execute at @a run summon skeleton ~4 ~ ~", "execute at @a run summon skeleton ~-4 ~ ~", "execute at @a run summon skeleton ~ ~ ~4"]
      - name: Hat and Mustache でゾンビ ×10
        gifts: [Hat and Mustache]
        commands: ["execute at @a run summon zombie ~4 ~ ~", "execute at @a run summon zombie ~-4 ~ ~", "execute at @a run summon zombie ~ ~ ~4", "execute at @a run summon zombie ~ ~ ~-4", "execute at @a run summon zombie ~3 ~ ~3", "execute at @a run summon zombie ~-3 ~ ~3", "execute at @a run summon zombie ~3 ~ ~-3", "execute at @a run summon zombie ~-3 ~ ~-3", "execute at @a run summon zombie ~5 ~ ~1", "execute at @a run summon zombie ~-5 ~ ~1"]
      - name: Confetti で動物園
        gifts: [Confetti]
        commands: ["execute at @a run summon goat ~3 ~ ~", "execute at @a run summon goat ~-3 ~ ~", "execute at @a run summon pig ~ ~ ~3", "execute at @a run summon cow ~ ~ ~-3", "execute at @a run summon sheep ~2 ~ ~2", "execute at @a run summon chicken ~-2 ~ ~2"]
      - name: Mishka Bear で大救済（金リンゴ・鉄の装備・耐性）
        gifts: [Mishka Bear]
        commands: ["execute as @a at @s run playsound minecraft:entity.player.levelup master @s ~ ~ ~ 1 1.2", "give @a golden_apple 3", "give @a iron_chestplate 1", "give @a iron_helmet 1", "effect give @a resistance 60 1", "title @a subtitle {\"text\":\"{user}\"}", "title @a title {\"text\":\"大救済\",\"color\":\"gold\"}"]
      - name: Love You で TNT タワー
        gifts: [Love You]
        commands: ["execute as @a at @s run playsound minecraft:entity.tnt.primed master @s ~ ~ ~ 1 0.6", "title @a actionbar {\"text\":\"TNT タワー  {user}\",\"color\":\"red\"}", "execute at @a run summon tnt ~ ~4 ~ {fuse:60}", "execute at @a run summon tnt ~ ~6 ~ {fuse:70}", "execute at @a run summon tnt ~ ~8 ~ {fuse:80}", "execute at @a run summon tnt ~ ~10 ~ {fuse:90}", "execute at @a run summon tnt ~ ~12 ~ {fuse:100}"]
      - name: Cheering Crab で上からマグマ
        gifts: [Cheering Crab]
        commands: ["execute at @a run setblock ~ ~5 ~ lava"]
      - name: Hearts で全回復と満腹
        gifts: [Hearts]
        commands: ["effect give @a instant_health 1 3", "effect give @a saturation 5 4"]
      # 1,000 コイン前後
      - name: Exclusive Spark でいきなりエンドへ
        gifts: [Exclusive Spark]
        commands: ["execute in minecraft:the_end run spreadplayers 0 0 5 20 false @a", "title @a subtitle {\"text\":\"{user}\"}", "title @a title {\"text\":\"いきなりエンド\",\"color\":\"light_purple\"}"]
      # WIN が動くギフト: 溜め（暗くする）→ 叩きつけ（タイトル・音・光）。段階が上がるほど派手に
      - name: Singing Mushroom（WIN -1）
        gifts: [Singing Mushroom]
        commands: ["title @a actionbar {\"text\":\"{user}  WIN -1\",\"color\":\"red\"}", "execute as @a at @s run playsound minecraft:block.note_block.bass master @s ~ ~ ~ 1 0.6", "execute at @a run particle minecraft:angry_villager ~ ~2 ~ 0.6 0.4 0.6 0 12"]
      - name: Hand Heart（WIN +1）
        gifts: [Hand Heart]
        commands: ["title @a actionbar {\"text\":\"{user}  WIN +1\",\"color\":\"gold\"}", "execute as @a at @s run playsound minecraft:block.note_block.pling master @s ~ ~ ~ 1 2", "execute at @a run particle minecraft:happy_villager ~ ~1 ~ 0.6 1 0.6 0 30"]
      - name: Money Gun（WIN -5）
        gifts: [Money Gun]
        commands: ["effect give @a darkness 2 0 true", "execute as @a at @s run playsound minecraft:entity.ender_dragon.growl master @s ~ ~ ~ 0.8 1.2", "title @a subtitle {\"text\":\"{user}\",\"color\":\"white\"}", "title @a title {\"text\":\"WIN -5\",\"color\":\"red\",\"bold\":true}", "execute at @a run particle minecraft:explosion ~ ~1 ~ 1 0.5 1 0 6"]
      - name: DJ Glasses（WIN +5）
        gifts: [DJ Glasses]
        commands: ["execute as @a at @s run playsound minecraft:entity.player.levelup master @s ~ ~ ~ 1 1", "title @a subtitle {\"text\":\"{user}\",\"color\":\"white\"}", "title @a title {\"text\":\"WIN +5\",\"color\":\"gold\",\"bold\":true}", "execute at @a run summon firework_rocket ~0 ~1 ~0 {LifeTime:15,FireworksItem:{id:\"minecraft:firework_rocket\",count:1,components:{\"minecraft:fireworks\":{flight_duration:1,explosions:[{shape:\"large_ball\",colors:[I;16761149],has_trail:true,has_twinkle:true}]}}}}"]
      - name: Galaxy（WIN -10）
        gifts: [Galaxy]
        commands: ["effect give @a darkness 3 0 true", "execute as @a at @s run playsound minecraft:entity.wither.spawn master @s ~ ~ ~ 0.6 1.1", "title @a subtitle {\"text\":\"{user}\",\"color\":\"white\"}", "title @a title {\"text\":\"WIN -10\",\"color\":\"dark_red\",\"bold\":true}", "execute at @a run particle minecraft:explosion_emitter ~ ~1 ~", "execute at @a run particle minecraft:soul_fire_flame ~ ~1 ~ 1.2 1 1.2 0.05 80"]
      - name: Fireworks（WIN +10）
        gifts: [Fireworks]
        commands: ["execute as @a at @s run playsound minecraft:ui.toast.challenge_complete master @s ~ ~ ~ 1 1", "title @a subtitle {\"text\":\"{user}\",\"color\":\"white\"}", "title @a title {\"text\":\"WIN +10\",\"color\":\"gold\",\"bold\":true}", "execute at @a run summon firework_rocket ~0 ~1 ~0 {LifeTime:15,FireworksItem:{id:\"minecraft:firework_rocket\",count:1,components:{\"minecraft:fireworks\":{flight_duration:1,explosions:[{shape:\"large_ball\",colors:[I;16761149],has_trail:true,has_twinkle:true}]}}}}", "execute at @a run summon firework_rocket ~2 ~1 ~0 {LifeTime:15,FireworksItem:{id:\"minecraft:firework_rocket\",count:1,components:{\"minecraft:fireworks\":{flight_duration:1,explosions:[{shape:\"large_ball\",colors:[I;16731935,16761149,6029055,4251856],has_trail:true,has_twinkle:true}]}}}}", "execute at @a run summon firework_rocket ~-2 ~1 ~0 {LifeTime:15,FireworksItem:{id:\"minecraft:firework_rocket\",count:1,components:{\"minecraft:fireworks\":{flight_duration:1,explosions:[{shape:\"large_ball\",colors:[I;16761149],has_trail:true,has_twinkle:true}]}}}}", "execute at @a run particle minecraft:totem_of_undying ~ ~1 ~ 0.6 1 0.6 0.4 120"]
      - name: Flying Jets で地震（WIN -30）
        gifts: [Flying Jets]
        superstreamAction: earthquake
